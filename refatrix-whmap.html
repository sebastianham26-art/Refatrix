<style>

<script src="refatrix-nav.js?v=20261021lg"></script>
<script>
(function(){
  /* =====================================================================
     Refatrix · 창고 도면 (Mapa del almacén) — build wm-1019a · 백엔드 whMapRoutes 20261019wm1 · 0288
     디렉터 요청(2026-10-19): 창고 도면 위에 랙 위치를 표시하고, 랙 번호를 누르면 그 랙에
       어떤 SKU 가 몇 개 있는지 보여 준다. 배치는 디렉터가 준 warehouse_image.html 을 그대로 옮겼다.
     · 도면 칸 = 랙 열(bay, 예 AA1). 실제 랙 AA1-1 … AA1-6 의 SKU 를 층별로 보여 준다.
     · 수량은 ERP 랙별 재고(product_rack_stock) — 이 화면에서 수량을 바꾸지 않는다(위치수정은 📍 랙별 재고).
     · 설정(디렉터): 구역 이동·크기·그리기·랙 열 편집 → 저장하면 모든 사용자에게 같은 도면.
     ===================================================================== */
  function sess(){
    try{ var r=sessionStorage.getItem('refatrix_session'); if(r){ var o=JSON.parse(r); if(o&&o.token) return o; } }catch(e){}
    try{ var h=location.hash.slice(1); if(h){ var p=new URLSearchParams(h); var t=p.get('token'); if(t) return {token:t,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')}; } }catch(e){}
    return null;
  }
  var BUILD='wm-1019c';
  var S=sess(); var API=(S&&S.api)||''; var AUTH=S?{Authorization:'Bearer '+S.token}:{};
  try{ console.log('[refatrix-whmap] build '+BUILD); }catch(e){}
  var LANG=(function(){ try{ var l=localStorage.getItem('wh_lang'); if(l==='es'||l==='ko') return l; }catch(e){} return (S&&S.user&&S.user.role==='warehouse')?'es':'ko'; })();
  function L(ko,es){ return LANG==='es'?es:ko; }
  var isDir=!!(S&&S.user&&S.user.role==='director');
  var CANEDIT=false;   // 서버가 판단: 디렉터 또는 「창고 도면 수정(whmap)」 권한 수정 (2026-10-19 wm-1019b)
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var fmt=function(n){return Number(n||0).toLocaleString(LANG==='es'?'es-MX':'ko-KR');};
  var toastT=null;
  function toast(m){ var el=$('toast'); el.textContent=m; el.style.display='block'; clearTimeout(toastT); toastT=setTimeout(function(){ el.style.display='none'; },String(m).length>60?7000:2600); }
  function api(path,opt){ opt=opt||{}; opt.headers=Object.assign({},AUTH,opt.headers||{});
    return fetch(API+path,opt).then(function(r){ return r.json().then(function(j){ return {ok:r.ok,status:r.status,body:j||{}}; })
      .catch(function(){ return {ok:r.ok,status:r.status,body:{}}; }); })
      .catch(function(){ return {ok:false,status:0,body:{error:'network'}}; }); }

  $('langToggle').textContent=LANG==='es'?'🌐 한국어':'🌐 Español';
  $('langToggle').addEventListener('click',function(){ var n=LANG==='es'?'ko':'es'; try{localStorage.setItem('wh_lang',n);}catch(e){} location.reload(); });
  $('ttl').textContent=L('창고 도면 · Mapa del almacén','Mapa del almacén');
  $('sub').textContent=L('랙 번호를 누르면 SKU · 수량이 보입니다','Toque un rack para ver SKU y cantidades');
  $('q').placeholder=L('제품번호 · 품명 검색','Buscar clave o nombre');
  (function(){ var a=document.querySelector('a.portalBtn'); if(a) a.textContent=L('← 포털','← Portal');
    var sb=document.querySelectorAll('#modeSeg button'); if(sb.length===3){ sb[0].textContent=L('재고','Existencia'); sb[1].textContent=L('📦 포장 피킹','📦 Surtido'); sb[2].textContent=L('설정','Configurar'); } })();
  if(!S){ $('app').innerHTML='<div class="card"><div class="hint">'+L('세션이 없습니다. 포털에서 다시 여세요.','Sin sesión. Abra desde el portal.')+'</div></div>'; return; }

  /* ---------- 상태 ---------- */
  var ZONES=[], SAVED='', VERSION=0, SEEDED=false, UPDATED=null, UPDBY=null;
  var RACKS={}, KNOWN={};            // 랙 → {skus,qty,kind} / ERP 에 있는 랙 이름
  var BAYS={};                       // bay → {qty, skus, racks:[..], fast, registered}
  var MODE='view', SELZ=null, SELB=null, Q='', HITS=null, SEARCH=[], BAYITEMS=null;
  var DRAW=false, DRAFT=null, DRAG=null;
  var DIRTY=false;
  // 포장 피킹(2026-10-19) — 포장지시서가 나온 오더의 피킹 위치를 주황으로
  var PICKQ=null, PICKQERR=null, PICKO=null, PICKID=null, PICKB={}, PICKOFF=[], PICKT=null;
  var URLPICK=(function(){ try{ var v=new URLSearchParams(location.search).get('pick'); return v&&/^\d+$/.test(v)?Number(v):null; }catch(e){ return null; } })();

  function bayOf(rack){ var s=String(rack||'').trim().toUpperCase(); var m=s.match(/^(.*\S)-\d+$/); return m?m[1]:s; }
  function natKey(v){ return String(v||'').toUpperCase().replace(/\d+/g,function(d){ return ('000000'+d).slice(-6); }); }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function zone(id){ for(var i=0;i<ZONES.length;i++) if(ZONES[i].id===id) return ZONES[i]; return null; }
  function bayIndex(){ var m={}; ZONES.forEach(function(z){ (z.rows||[]).forEach(function(r){ r.forEach(function(b){ m[b]=z.id; }); }); }); return m; }
  function zoneName(z){ if(!z) return ''; var n=String(z.name||''); var p=n.split(' · '); return p.length===2?(LANG==='es'?p[1]:p[0]):n; }

  function buildBays(){
    BAYS={};
    function g(b){ return BAYS[b]||(BAYS[b]={qty:0,skus:0,racks:[],fast:false,registered:false}); }
    Object.keys(KNOWN).forEach(function(r){ var x=g(bayOf(r)); x.registered=true; if(x.racks.indexOf(r)<0) x.racks.push(r); });
    Object.keys(RACKS).forEach(function(r){ var s=RACKS[r], x=g(bayOf(r)); x.registered=true; x.qty+=s.qty; x.skus+=s.skus; if(s.kind==='fast') x.fast=true; if(x.racks.indexOf(r)<0) x.racks.push(r); });
    // 칸 이름에 「-」가 있으면(예 FM-01) 그 랙 하나와 정확히 맞춘다
    var idx=bayIndex();
    Object.keys(idx).forEach(function(b){ if(b.indexOf('-')>=0 && !BAYS[b]){ var x=g(b); if(KNOWN[b]){ x.registered=true; x.racks=[b]; } if(RACKS[b]){ x.qty=RACKS[b].qty; x.skus=RACKS[b].skus; x.fast=RACKS[b].kind==='fast'; } } });
  }
  function bayStat(b){ return BAYS[b]||{qty:0,skus:0,racks:[],fast:false,registered:false}; }

  /* ---------- 로딩 ---------- */
  function load(){
    api('/api/wh-map').then(function(o){
      if(!o.ok||!o.body.ok){ $('app').innerHTML='<div class="card"><div class="note red">'+L('도면을 불러오지 못했습니다','No se pudo cargar el mapa')+' ('+esc(o.body.error||o.status)+')</div></div>'; return; }
      var b=o.body;
      ZONES=clone(b.zones||[]); SAVED=JSON.stringify(ZONES); VERSION=b.version||0; SEEDED=!!b.seeded; UPDATED=b.updated_at; UPDBY=b.updated_by;
      RACKS={}; (b.racks||[]).forEach(function(r){ RACKS[String(r.rack).toUpperCase()]=r; });
      KNOWN={}; (b.known||[]).forEach(function(r){ KNOWN[String(r).toUpperCase()]=1; });
      buildBays(); DIRTY=false;
      if(URLPICK&&MODE!=='pick'){ setMode('pick'); selectPick(URLPICK); URLPICK=null; return; }
      CANEDIT=!!b.can_edit;
      var sb=document.querySelector('#modeSeg button[data-m="setup"]'); if(sb) sb.style.display=CANEDIT?'':'none';
      render();
    });
  }

  /* ---------- 화면 ---------- */
  function render(){
    $('app').innerHTML='<div class="grid"><div class="mapcol card">'+mapHead()+'<div class="mapscroll"><div class="map'+(MODE==='setup'?' setup':'')+(DRAW?' draw':'')+'" id="map">'+mapInner()+'</div></div>'+legend()+'</div>'
      +'<div class="side card" id="side">'+sideHtml()+'</div></div>';
    wireMap(); wireSide();
  }
  function renderMap(){ var m=$('map'); if(!m){ render(); return; } m.innerHTML=mapInner(); m.className='map'+(MODE==='setup'?' setup':'')+(DRAW?' draw':''); }
  function renderSide(){ var s=$('side'); if(!s){ render(); return; } s.innerHTML=sideHtml(); wireSide(); }
  function mapHead(){
    var h=MODE==='setup'

  function mapInner(){
    var setup=MODE==='setup', h='';
    ZONES.forEach(function(z){
      var area=z.type==='area', sel=SELZ===z.id;
      h+='<div class="zone'+(area?' area':'')+(sel?' sel':'')+'" data-z="'+esc(z.id)+'" style="left:'+z.x+'%;top:'+z.y+'%;width:'+z.w+'%;height:'+z.h+'%">'
        +'<div class="zn" data-zn="'+esc(z.id)+'">'+esc(zoneName(z))+'</div>';
      if(!area) (z.rows||[]).forEach(function(row){
        h+='<div class="zrow">';
        row.forEach(function(b){
          var st=bayStat(b), cls='bay ';
          var pk=(MODE==='pick'&&PICKO)?PICKB[b]:null;
          if(MODE==='pick'&&PICKO){ cls+=pk?(pk.left>0?'pick':'pickdone'):'dim'; if(SELB===b) cls+=' sel'; }
          else if(SELB===b) cls+='sel';
          else if(HITS) cls+=(HITS[b]?'hit':'dim');
          else cls+=!st.registered?'unreg':(st.qty>0?'stock':'empty');
          var tip=b+(st.registered?(' · '+st.skus+' SKU · '+fmt(st.qty)+' EA'):(' · '+L('ERP 미등록','no registrado')));
          if(pk) tip=b+' · '+L('피킹','surtir')+' '+fmt(pk.left)+' / '+fmt(pk.qty)+' EA';
          h+='<div class="'+cls+'" data-b="'+esc(b)+'" data-z="'+esc(z.id)+'" title="'+esc(tip)+'">'+esc(b)+(pk?'<small>'+fmt(pk.left>0?pk.left:pk.qty)+'</small>':(st.fast?'<small>⚡</small>':''))+'</div>';
        });
        h+='</div>';
      });
      if(setup&&sel&&!DRAW){
        [['nw',0,0,'nwse-resize'],['n',50,0,'ns-resize'],['ne',100,0,'nesw-resize'],['e',100,50,'ew-resize'],['se',100,100,'nwse-resize'],['s',50,100,'ns-resize'],['sw',0,100,'nesw-resize'],['w',0,50,'ew-resize']]
          .forEach(function(d){ h+='<div class="hd" data-hd="'+d[0]+'" style="left:'+d[1]+'%;top:'+d[2]+'%;cursor:'+d[3]+'"></div>'; });
      }
      h+='</div>';
    });
    if(DRAFT) h+='<div class="draft" style="left:'+DRAFT.x+'%;top:'+DRAFT.y+'%;width:'+DRAFT.w+'%;height:'+DRAFT.h+'%"></div>';
    return h;
  }

      +'<div class="fld"><label>'+L('유형','Tipo')+'</label><span class="seg"><button type="button" class="'+(z.type!=='area'?'cur':'')+'" data-type="storage">'+L('보관 구역(랙)','Racks')+'</button><button type="button" class="'+(z.type==='area'?'cur':'')+'" data-type="area">'+L('일반 공간','Área')+'</button></span></div>';

  function markDirty(){ DIRTY=JSON.stringify(ZONES)!==SAVED; }

  /* ---------- 이벤트 ---------- */
  function pt(e){ var m=$('map'), r=m.getBoundingClientRect(); var c=function(v){ return Math.max(0,Math.min(100,v)); };
    return {x:c((e.clientX-r.left)/r.width*100), y:c((e.clientY-r.top)/r.height*100)}; }
  var q2=function(v){ return Math.round(v*2)/2; };
  function wireMap(){
    var m=$('map'); if(!m) return;
    m.addEventListener('pointerdown',function(e){
      if(MODE!=='setup') return;
      var hd=e.target.closest('.hd'), zEl=e.target.closest('.zone'), p=pt(e);
      if(DRAW){ e.preventDefault(); DRAG={kind:'draw',sx:p.x,sy:p.y}; DRAFT={x:p.x,y:p.y,w:0,h:0}; return; }
      if(hd&&SELZ){ e.preventDefault(); var z=zone(SELZ); DRAG={kind:'resize',dir:hd.getAttribute('data-hd'),sx:p.x,sy:p.y,o:{x:z.x,y:z.y,w:z.w,h:z.h}}; return; }
      if(zEl){ e.preventDefault(); var id=zEl.getAttribute('data-z'), z2=zone(id);
        if(SELZ!==id){ SELZ=id; renderSide(); }
        DRAG={kind:'move',id:id,sx:p.x,sy:p.y,ox:z2.x,oy:z2.y,moved:false}; renderMap(); }
    });
    m.addEventListener('click',function(e){
      if(MODE==='setup') return;
      var bEl=e.target.closest('.bay'), zEl=e.target.closest('.zone');
      if(bEl&&MODE==='pick'){ var pb=bEl.getAttribute('data-b'); SELB=(SELB===pb?null:pb); renderMap(); renderSide();
        var g=document.querySelector('#side .pk[data-pb="'+(window.CSS&&CSS.escape?CSS.escape(pb):pb)+'"]'); if(g&&g.scrollIntoView) try{ g.scrollIntoView({behavior:'smooth',block:'nearest'}); }catch(_){}
        return; }
      if(bEl){ selectBay(bEl.getAttribute('data-b')); return; }
      if(zEl&&!zEl.classList.contains('area')){ SELZ=zEl.getAttribute('data-z'); SELB=null; renderMap(); renderSide(); }
    });
  }
  window.addEventListener('pointermove',function(e){
    var d=DRAG; if(!d||!$('map')) return;
    var p=pt(e), dx=p.x-d.sx, dy=p.y-d.sy;
    if(d.kind==='draw'){ DRAFT={x:Math.min(p.x,d.sx),y:Math.min(p.y,d.sy),w:Math.abs(dx),h:Math.abs(dy)}; renderMap(); return; }
    var z=zone(d.id||SELZ); if(!z) return;
    if(d.kind==='move'){ if(Math.abs(dx)+Math.abs(dy)<0.3&&!d.moved) return; d.moved=true;
      z.x=q2(Math.max(0,Math.min(100-z.w,d.ox+dx))); z.y=q2(Math.max(0,Math.min(100-z.h,d.oy+dy))); }
    else if(d.kind==='resize'){
      var o=d.o, M=3, g={x:o.x,y:o.y,w:o.w,h:o.h};
      if(d.dir.indexOf('e')>=0) g.w=Math.max(M,Math.min(100-o.x,o.w+dx));
      if(d.dir.indexOf('s')>=0) g.h=Math.max(M,Math.min(100-o.y,o.h+dy));
      if(d.dir.indexOf('w')>=0){ var nx=Math.max(0,Math.min(o.x+o.w-M,o.x+dx)); g.w=o.w+(o.x-nx); g.x=nx; }
      if(d.dir.indexOf('n')>=0){ var ny=Math.max(0,Math.min(o.y+o.h-M,o.y+dy)); g.h=o.h+(o.y-ny); g.y=ny; }
      z.x=q2(g.x); z.y=q2(g.y); z.w=q2(g.w); z.h=q2(g.h);
    }
    renderMap();
  });
  window.addEventListener('pointerup',function(){
    var d=DRAG; DRAG=null; if(!d) return;
    if(d.kind==='draw'){
      var f=DRAFT; DRAFT=null;
      if(f&&f.w>2&&f.h>2){ var id='z'+Date.now(); ZONES.push({id:id,name:L('새 구역','Zona nueva'),type:'storage',x:q2(f.x),y:q2(f.y),w:q2(f.w),h:q2(f.h),rows:[]}); SELZ=id; DRAW=false; }
      markDirty(); render(); return;
    }
    markDirty(); render();
  });
  window.addEventListener('beforeunload',function(e){ if(DIRTY){ e.preventDefault(); e.returnValue=''; } });

  function selectBay(b){
    SELB=b; var z=bayIndex()[b]; if(z) SELZ=z; BAYITEMS=null;
    if(Q){ Q=''; HITS=null; $('q').value=''; }
    renderMap(); renderSide();
    if(!bayStat(b).registered) return;
    api('/api/wh-map/bay?bay='+encodeURIComponent(b)).then(function(o){
      if(SELB!==b) return;
      BAYITEMS={bay:b,items:(o.ok&&o.body.items)||[]}; renderSide();
      if((window.innerWidth||9999)<=760){ var sd=$('side'); if(sd&&sd.scrollIntoView) try{ sd.scrollIntoView({behavior:'smooth',block:'start'}); }catch(e){} }
    });
  }
  function wireSide(){
    var s=$('side'); if(!s) return;
    Array.prototype.forEach.call(s.querySelectorAll('[data-selz]'),function(el){ el.addEventListener('click',function(){ SELZ=el.getAttribute('data-selz'); SELB=null; renderMap(); renderSide(); }); });
    Array.prototype.forEach.call(s.querySelectorAll('[data-selb]'),function(el){ el.addEventListener('click',function(){ selectBay(el.getAttribute('data-selb')); }); });
    Array.prototype.forEach.call(s.querySelectorAll('[data-back]'),function(el){ el.addEventListener('click',function(){
      if(el.getAttribute('data-back')==='zone'){ SELB=null; } else { SELB=null; SELZ=null; } renderMap(); renderSide(); }); });
    if(MODE==='pick'){
      Array.prototype.forEach.call(s.querySelectorAll('[data-pick]'),function(el){ el.addEventListener('click',function(){ selectPick(Number(el.getAttribute('data-pick'))); }); });
      Array.prototype.forEach.call(s.querySelectorAll('[data-selpb]'),function(el){ el.addEventListener('click',function(){ var b=el.getAttribute('data-selpb'); SELB=(SELB===b?null:b); renderMap(); renderSide(); }); });
      var bk=$('pkBack'); if(bk) bk.addEventListener('click',function(){ PICKID=null; PICKO=null; PICKB={}; PICKOFF=[]; SELB=null; setUrlPick(null); loadPickQueue(); renderMap(); renderSide(); });
      var rl=$('pkReload'); if(rl) rl.addEventListener('click',function(){ if(PICKID) loadPick(PICKID,false); });
      return;
    }
    if(MODE!=='setup') return;
    var on=function(id,fn){ var el=$(id); if(el) el.addEventListener('click',fn); };
    on('bSave',save);
    on('bUndo',function(){ ZONES=JSON.parse(SAVED); SELZ=null; DIRTY=false; render(); });
    on('bAdd',function(){ var id='z'+Date.now(); ZONES.push({id:id,name:L('새 구역','Zona nueva'),type:'storage',x:40,y:40,w:20,h:15,rows:[]}); SELZ=id; DRAW=false; markDirty(); render(); });
    on('bDraw',function(){ DRAW=!DRAW; render(); });
    on('bSeed',function(){ if(!confirm(L('처음 받은 기본 도면으로 되돌릴까요? (저장해야 반영)','¿Restaurar el mapa base? (debe guardar)'))) return;
      api('/api/wh-map').then(function(o){ if(o.ok&&o.body.ok&&o.body.seeded){ ZONES=clone(o.body.zones); } else { ZONES=clone(SEED_FALLBACK()); } SELZ=null; markDirty(); render(); }); });
    on('bDel',function(){ var z=zone(SELZ); if(!z||!confirm(L('「'+z.name+'」 구역을 삭제할까요?','¿Eliminar la zona «'+z.name+'»?'))) return;
      ZONES=ZONES.filter(function(x){ return x.id!==z.id; }); SELZ=null; markDirty(); render(); });
    var z=zone(SELZ); if(!z) return;
    var en=$('eName'); if(en) en.addEventListener('change',function(){ z.name=en.value.trim().slice(0,60)||z.name; markDirty(); render(); });
    Array.prototype.forEach.call(s.querySelectorAll('.eg'),function(inp){ inp.addEventListener('change',function(){
      var k=inp.getAttribute('data-g'), n=parseFloat(inp.value); if(isNaN(n)) return;
      if(k==='w'||k==='h') n=Math.max(3,n); z[k]=Math.max(0,n);
      z.w=Math.min(z.w,100-z.x); z.h=Math.min(z.h,100-z.y); z.x=Math.min(z.x,100-z.w); z.y=Math.min(z.y,100-z.h);
      markDirty(); render(); }); });
    Array.prototype.forEach.call(s.querySelectorAll('[data-type]'),function(b){ b.addEventListener('click',function(){ z.type=b.getAttribute('data-type'); markDirty(); render(); }); });
    var er=$('eRacks'); if(er) er.addEventListener('change',function(){
      z.rows=er.value.split('\n').map(function(l){ return l.trim().toUpperCase().replace(/['’`]/g,'-').split(/[\s,]+/).filter(Boolean); }).filter(function(r){ return r.length; });
      markDirty(); buildBays(); render(); });
  }
  // 서버에 저장된 도면이 있을 때 「기본 도면으로」 — 서버 SEED 를 다시 못 받으므로 같은 값을 화면에도 둔다
  function SEED_FALLBACK(){
    var r=function(p,a,b){ var o=[]; for(var i=a;i<=b;i++) o.push(p+i); return o; };
    return [
      {id:'office',name:'사무실 · Oficina',type:'area',x:1.2,y:2.3,w:17.5,h:51,rows:[]},
      {id:'cage',name:'케이지 · Jaula',type:'storage',x:21,y:2.8,w:23,h:45,rows:[['B2','C1'],['B1','C2'],['A2','D1'],['A1','D2'],['E1','E2'],['E3','E4']]},
      {id:'za',name:'A 랙 · Racks A',type:'storage',x:46.3,y:5.1,w:35,h:41,rows:[r('AA',1,6),r('AB',1,5),r('AC',1,5),r('AD',1,6),r('AE',1,6)]},
      {id:'af',name:'AF',type:'storage',x:82,y:14,w:4.8,h:26,rows:[['AF1'],['AF2'],['AF3']]},
      {id:'wc',name:'화장실·식당 · Baños/Comedor',type:'area',x:88,y:2.3,w:9.5,h:52,rows:[]},
      {id:'mez',name:'메자닌 2층 · Mezzanine',type:'storage',x:44.3,y:58,w:53,h:36,rows:[r('BA',1,7),r('BB',1,6),r('BC',1,6),r('BD',1,7)]},
      {id:'entry',name:'입구 · Entrada →',type:'area',x:1.2,y:60,w:12,h:7,rows:[]},
      {id:'ramp',name:'램프(상하차) · Rampa',type:'area',x:1.2,y:71,w:18,h:25,rows:[]}
    ];
  }
  function save(){
    var b=$('bSave'); if(b) b.disabled=true;
    api('/api/wh-map',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({zones:ZONES,version:VERSION})}).then(function(o){
      if(o.status===403){ toast(L('창고 도면 수정 권한이 없습니다 — 관리자에게 요청하세요.','No tiene permiso para editar el mapa.')); if(b) b.disabled=false; return; }
      if(o.status===409&&o.body.error==='version_conflict'){ toast(L('다른 사람이 먼저 도면을 저장했습니다 — 새로고침 후 다시 하세요.','Otro usuario guardó primero — recargue.')); if(b) b.disabled=false; return; }
      if(!o.ok||!o.body.ok){
        var e=o.body||{}, msg=e.error==='dup_bay'?L('중복된 랙: ','Rack duplicado: ')+e.bay:e.error==='bad_bay'?L('잘못된 랙 번호: ','Rack inválido: ')+e.bay:(e.note||e.error||o.status);
        toast(L('저장 실패','Error al guardar')+' — '+msg); if(b) b.disabled=false; return; }
      ZONES=clone(o.body.zones); SAVED=JSON.stringify(ZONES); VERSION=o.body.version; SEEDED=false; UPDATED=o.body.updated_at; UPDBY=(S.user&&S.user.name)||null; DIRTY=false;
      toast('✔ '+L('도면을 저장했습니다','Mapa guardado')); render();
    });
  }

  /* ---------- 상단: 모드 · 검색 ---------- */
  function setMode(m){
    MODE=m; DRAW=false; SELB=null; SELZ=null; Q=''; HITS=null; $('q').value='';
    Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'),function(x){ x.classList.toggle('cur',x.getAttribute('data-m')===MODE); });
    $('q').disabled=(MODE!=='view');
    clearInterval(PICKT); PICKT=null;
    if(MODE==='pick'){ loadPickQueue(); PICKT=setInterval(function(){ if(document.hidden) return; if(PICKID) loadPick(PICKID,true); else loadPickQueue(); },20000); }
    else { PICKO=null; PICKID=null; PICKB={}; PICKOFF=[]; setUrlPick(null); }
    render();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#modeSeg button'),function(b){ b.addEventListener('click',function(){
    var m=b.getAttribute('data-m'); if(m===MODE) return;
    if(MODE==='setup'&&DIRTY&&!confirm(L('저장하지 않은 도면 변경이 있습니다. 버리고 나갈까요?','Hay cambios sin guardar. ¿Descartar?'))) return;
    if(MODE==='setup'&&DIRTY){ ZONES=JSON.parse(SAVED); DIRTY=false; }
    setMode(m); }); });

  /* ---------- 포장 피킹 (2026-10-19) ----------------------------------------------
     창고 홈의 포장지시(포장작업지시서 출력된 오더) → 피킹 위치를 도면에 주황으로.
     · 목록 = /api/warehouse/packing-queue · 오더 = /api/warehouse/packing/:id (지시서 위치 picks · 남은 수량)
     · 칸 = 랙 열(bay). 다 담은 품목(남은 0)은 연주황 · 취소선. 20초마다 새로 읽는다. */
  function setUrlPick(id){ try{ var u=new URL(location.href); if(id) u.searchParams.set('pick',id); else u.searchParams.delete('pick'); history.replaceState(null,'',u.pathname+u.search+u.hash); }catch(e){} }
  function loadPickQueue(){
    api('/api/warehouse/packing-queue').then(function(o){
      if(MODE!=='pick') return;
      if(!o.ok){ PICKQ=[]; PICKQERR=o.status===403?L('창고 권한이 있어야 포장 목록을 볼 수 있습니다.','Necesita permiso de almacén para ver la lista.'):L('포장 목록을 불러오지 못했습니다','No se pudo cargar la lista'); }
      else { PICKQ=o.body.items||[]; PICKQERR=null; }
      if(!PICKID) renderSide();
    });
  }
  function selectPick(id){ PICKID=id; PICKO=null; PICKB={}; PICKOFF=[]; SELB=null; setUrlPick(id); render(); loadPick(id,false); }
  function loadPick(id,quiet){
    api('/api/warehouse/packing/'+id).then(function(o){
      if(MODE!=='pick'||PICKID!==id) return;
      if(!o.ok||o.body.error){ if(!quiet){ toast(L('포장지시를 불러오지 못했습니다','No se pudo cargar la orden')+' ('+esc(o.body.error||o.status)+')'); PICKID=null; setUrlPick(null); renderSide(); } return; }
      PICKO=o.body; buildPick(); render();
    });
  }
  function bayPos(){ var m={}; ZONES.forEach(function(z,zi){ (z.rows||[]).forEach(function(r,ri){ r.forEach(function(b,ci){ m[b]=[zi,ri,ci]; }); }); }); return m; }
  function buildPick(){
    PICKB={}; PICKOFF=[];
    var idx=bayIndex();
    (PICKO.items||[]).forEach(function(it){
      var done=Number(it.remaining)<=0, picks=(it.picks&&it.picks.length)?it.picks:[{rack:null,qty:it.required}];
      // 남은 수량을 지시서 위치 순서대로 나눠 「아직 집을 것」을 칸별로 센다
      var left=Math.max(0,Number(it.remaining)||0);
      picks.forEach(function(pk){
        var q=Number(pk.qty)||0, l=Math.min(left,q); left-=l;
        var row={code:it.ctr_code,syd:it.syd_code,rack:pk.rack||null,qty:q,left:done?0:l,done:done||l<=0,picked:!!pk.picked};
        if(!pk.rack){ PICKOFF.push(row); return; }
        var b=bayOf(pk.rack); if(!idx[b]&&idx[String(pk.rack).toUpperCase()]) b=String(pk.rack).toUpperCase();
        row.bay=b; row.onmap=!!idx[b];
        var g=PICKB[b]||(PICKB[b]={bay:b,qty:0,left:0,rows:[],onmap:row.onmap}); g.qty+=q; g.left+=row.left; g.rows.push(row);
      });
    });
  }
  function pickHtml(){
    if(!PICKID){
      var h='<div class="k">'+L('포장 피킹','Surtido')+'</div><h2>'+L('포장 목록','Lista de empaque')+(PICKQ?' <span style="color:#E8730C">'+PICKQ.length+'</span>':'')+'</h2>'
        +'<div class="hint">'+L('포장작업지시서가 나온 오더입니다. 오더를 누르면 피킹할 위치가 도면에 주황색으로 표시됩니다.','Órdenes con hoja de empaque. Toque una para ver en naranja dónde surtir.')+'</div>';
      if(PICKQ==null) return h+'<div class="hint" style="margin-top:10px">'+L('불러오는 중…','Cargando…')+'</div>';
      if(PICKQERR) return h+'<div class="note red">'+esc(PICKQERR)+'</div>';
      if(!PICKQ.length) return h+'<div class="note green">'+L('대기 중인 포장지시가 없습니다.','No hay órdenes de empaque pendientes.')+'</div>';
      h+='<div style="border-top:2px solid var(--ink);margin-top:10px">';
      PICKQ.forEach(function(q){
        var pq=Number(q.packed_qty)||0, tq=q.total_qty==null?null:Number(q.total_qty);
        h+='<div class="pq'+(q.overdue?' over':'')+'" data-pick="'+q.quote_id+'"><span class="n">'+esc(q.quote_no||('#'+q.quote_id))+(q.overdue?' <small style="color:var(--red)">⚠ '+L('지연','atraso')+'</small>':'')+'</span>'
          +'<span class="p">'+fmt(pq)+' / '+(tq==null?'—':fmt(tq))+'</span><span class="c">'+esc(q.customer||'')+'</span></div>';
      });
      return h+'</div>';
    }
    var d=PICKO;
    var head='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px"><div><div class="k">'+L('포장 피킹','Surtido')+'</div>'
      +'<h2>'+esc(d?(d.quote_no||('#'+d.quote_id)):('#'+PICKID))+'</h2>'+(d?'<div class="hint">'+esc(d.customer||'')+'</div>':'')+'</div>'
      +'<button type="button" class="btn ghost sm" id="pkBack">← '+L('포장 목록','Lista')+'</button></div>';
    if(!d) return head+'<div class="hint" style="margin-top:10px">'+L('불러오는 중…','Cargando…')+'</div>';
    var req=Number(d.required_total)||0, sc=Number(d.scanned_total)||0, pct=req?Math.round(sc/req*100):0;
    var h=head+'<div class="hint" style="margin-top:6px">'+L('포장','Empacado')+' <b>'+fmt(sc)+'</b> / '+fmt(req)+' EA ('+pct+'%)</div><div class="pbar"><i style="width:'+pct+'%"></i></div>';
    var pos=bayPos(), groups=Object.keys(PICKB).map(function(k){ return PICKB[k]; });
    groups.sort(function(a,b){ var pa=pos[a.bay], pb=pos[b.bay];
      if(pa&&pb){ return pa[0]-pb[0]||pa[1]-pb[1]||pa[2]-pb[2]; } if(pa) return -1; if(pb) return 1; return natKey(a.bay)<natKey(b.bay)?-1:1; });
    var leftBays=groups.filter(function(g){ return g.left>0; }).length;
    h+='<div class="hint" style="margin-top:8px">'+L('들를 랙','Racks a visitar')+' <b style="color:#E8730C">'+leftBays+'</b>'+(groups.length>leftBays?' · '+L('끝난 랙','terminados')+' '+(groups.length-leftBays):'')+'</div>';
    groups.forEach(function(g){
      h+='<div class="pk'+(SELB===g.bay?' sel':'')+(g.onmap?'':' off')+(g.left>0?'':' done')+'" data-pb="'+esc(g.bay)+'"><div class="bh" data-selpb="'+esc(g.bay)+'"><span>'+esc(g.bay)+(g.onmap?'':' <small>· '+L('도면 밖','fuera del mapa')+'</small>')+'</span><small>'+(g.left>0?fmt(g.left)+' EA':'✓')+'</small></div>';
      g.rows.forEach(function(r){
        h+='<div class="pr'+(r.done?' done':'')+'"><span class="mono">'+esc(r.rack)+'</span><span><b class="mono">'+esc(r.code)+'</b>'+(r.syd?' <span class="hint">'+esc(r.syd)+'</span>':'')+'</span><span class="q">'+(r.done?'✓ ':'')+fmt(r.done?r.qty:r.left)+'</span></div>';
      });
      h+='</div>';
    });
    if(PICKOFF.length){
      h+='<div class="pk off"><div class="bh"><span>'+L('위치 미지정','Sin ubicación')+'</span><small>'+fmt(PICKOFF.reduce(function(a,r){ return a+(r.done?0:r.left); },0))+' EA</small></div>';
      PICKOFF.forEach(function(r){ h+='<div class="pr'+(r.done?' done':'')+'"><span class="mono">—</span><span><b class="mono">'+esc(r.code)+'</b></span><span class="q">'+fmt(r.done?r.qty:r.left)+'</span></div>'; });
      h+='</div><div class="hint">'+L('랙 기록이 없는 재고입니다 — 제품 위치 찾기로 확인하세요.','Sin ubicación registrada — use Buscar ubicación.')+'</div>';
    }
    if(!groups.length&&!PICKOFF.length) h+='<div class="note green">'+L('피킹할 품목이 없습니다.','Nada que surtir.')+'</div>';
    h+='<div class="rowb"><a class="btn sm" style="text-decoration:none;background:#E8730C" href="refatrix-warehouse.html">📦 '+L('포장 작업으로','Ir a empaque')+'</a>'
      +'<button type="button" class="btn ghost sm" id="pkReload">↻ '+L('새로고침','Actualizar')+'</button></div>';
    return h;
  }
  var qT=null, qSeq=0;
  $('q').addEventListener('input',function(){
    clearTimeout(qT); var v=$('q').value.trim();
    qT=setTimeout(function(){
      Q=v; SELB=null;
      if(!Q){ HITS=null; SEARCH=[]; renderMap(); renderSide(); return; }
      if(Q.length<2){ HITS={}; SEARCH=[]; renderMap(); renderSide(); return; }
      var my=++qSeq;
      api('/api/wh-map/search?q='+encodeURIComponent(Q)).then(function(o){
        if(my!==qSeq) return;
        SEARCH=(o.ok&&o.body.items)||[]; HITS={}; SEARCH.forEach(function(x){ HITS[x.bay]=1; HITS[x.rack]=1; });
        renderMap(); renderSide();
      });
    },220);
  });

  load();
})();
</script>
</body>
