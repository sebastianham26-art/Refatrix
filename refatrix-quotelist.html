  // ===== 포장 작업 지시서 (피킹/패킹) 출력 — ① 즉시 매출 SKU =====
  async function printPickList(){
    const pv=cvPreviewData;
    if(!pv || !(pv.in_stock||[]).length){ alert('즉시 매출 가능한 SKU가 없습니다.'); return; }
    // 랙 위치 순 정렬 — 작업자가 창고를 한 방향으로 돌며 피킹하도록.
    //   자연정렬(A-1-9 < A-1-10 · 존 지정 화면 rackSortKey 와 같은 규칙) · 랙 미지정 SKU 는 맨 뒤 · 같은 랙이면 SKU 코드순.
    const rackOf=(x)=>String((x&&(x.rack_location||x.rack||x.location))||'').trim();
    const rackKey=(s)=>s.toUpperCase().replace(/\d+/g,n=>n.padStart(6,'0'));
    const row=qRowsById[cvId]||{};
    const co=await getCompany();

    // 포장출력 기록 + 포장완료 기한(업무시간 6시간) 수신 → 슬립에 기한 표기.
    //   (최초 출력에만 기한 고정. 재출력해도 서버가 기존 기한을 그대로 반환.)
    let packDueAt=null, savedPicks=null;
    if(cvId){
      try{
        const pr=await fetch(session.api+'/api/quotes/'+cvId+'/packing-printed',{method:'POST',headers:auth()}).then(r=>r.json()).catch(()=>null);
        // 0224b — 판매중단 줄이 있어도 **포장은 그대로 진행한다.** 그 줄은 재고가 없어
        //   피킹 목록에 안 들어가고, 요청 기록은 견적에 남아 있다.
        if(pr){ packDueAt=pr.packing_due_at||null; savedPicks=pr.picks||null; if(pr.packing_printed_at&&qRowsById[cvId]) qRowsById[cvId].packing_printed_at=pr.packing_printed_at; }
      }catch(_){}
    }
    // 0245 · 피킹 정거장 = SKU × 랙 × 수량. 서버가 지시서 출력 시 저장한 위치(= 매출 전환 때 차감될 위치)를 쓴다.
    //   한 SKU 가 여러 랙에 있으면 fast moving 랙을 먼저, 줄을 나눠 찍는다. 랙재고로 다 못 채운 분량은 제품마스터 위치로 안내.
    const merged=[]; const byPid={};
    (pv.in_stock||[]).forEach(x=>{
      const k=x.product_id?('p'+x.product_id):('c'+(x.ctr_code||''));
      if(byPid[k]){ byPid[k].qty=Number(byPid[k].qty||0)+Number(x.qty||0); return; }
      byPid[k]=Object.assign({},x); merged.push(byPid[k]);
    });
    const items=[];
    merged.forEach(x=>{
      const pk=(savedPicks&&x.product_id&&savedPicks[x.product_id])||x.picks||null;
      if(pk&&pk.length){
        pk.forEach((k,i)=>items.push(Object.assign({},x,{
          stop_qty:k.qty, stop_rack:k.rack||rackOf(x), stop_kind:k.rack?(k.kind||'carton'):null,
          from_master:!k.rack && pk.length>1, split:pk.length>1, part:i+1, parts:pk.length, sku_total:x.qty })));   // 마스터 위치 표시는 랙재고와 섞일 때만
      } else {
        // 랙재고 정보가 아예 없는 응답(구버전 서버·마이그레이션 전) — 종전처럼 제품마스터 위치만, 표시 없음
        items.push(Object.assign({},x,{ stop_qty:x.qty, stop_rack:rackOf(x), stop_kind:null, from_master:false, split:false, part:1, parts:1, sku_total:x.qty }));
      }
    });
    items.sort((a,b)=>{
      const ra=a.stop_rack||'', rb=b.stop_rack||'';
      if(!ra!==!rb) return ra?-1:1;
      const fa=a.stop_kind==='fast'?0:1, fb=b.stop_kind==='fast'?0:1;
      if(fa!==fb) return fa-fb;
      const ka=rackKey(ra), kb=rackKey(rb);
      if(ka!==kb) return ka<kb?-1:1;
      return String(a.ctr_code||'').localeCompare(String(b.ctr_code||''),'en',{numeric:true});
    });
    const noRackCount=new Set(items.filter(x=>!x.stop_rack).map(x=>x.ctr_code||'')).size;   // 위치 없는 SKU 수 — 상단 경고 카드
    const mxFmtDl=(iso)=>{ if(!iso) return '—'; const d=new Date(new Date(iso).getTime()-360*60000); const p=n=>String(n).padStart(2,'0'); return p(d.getUTCMonth()+1)+'-'+p(d.getUTCDate())+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes()); };
    const dueStr=mxFmtDl(packDueAt);

    // CTR 코드 → SYD 코드 매핑 (견적 상세에서; convert-preview가 syd를 주면 그걸 우선 사용)
    let sydMap={};
    try{
      const qd=await fetch(session.api+'/api/quotes/'+cvId,{headers:auth()}).then(r=>r.json());
      (qd.lines||[]).forEach(l=>{ const c=(l.ctr_code||l.input_code||'').trim(); if(c) sydMap[c]=l.syd_codes||''; });
    }catch(e){}

    // 고객명: 불특정 견적이면 선택한 고객, 아니면 견적 고객명
    let custDisplay=row.party_name||'—';
    if(cvGuest){ const sel=$('cvCustomer'); if(sel&&sel.value){ custDisplay=sel.options[sel.selectedIndex].text; } }
    const issuer=issuerLabel(row);
    const quoteNo=row.quote_no||'';
    const now=new Date(); const pad=n=>String(n).padStart(2,'0');
    const dateStr=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
    const timeStr=pad(now.getHours())+':'+pad(now.getMinutes());
    const skuCount=merged.length;
    const totalQty=merged.reduce((s,x)=>s+(Number(x.qty)||0),0);
    const qfmt=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:3});

    const logo=co.logo_data
      ? '<img src="'+co.logo_data+'" style="max-height:52px;max-width:200px">'
      : '<div style="font-size:20px;font-weight:800;color:#143D34">'+esc(co.emisor||'Refatrix')+'</div>';

    const PER_PAGE=18;
    const pageCount=Math.max(1, Math.ceil(items.length/PER_PAGE));

    // 헤더(페이지마다 반복 고정)
    const headerHtml=
      '<div class="pk-head">'
      +'<div class="pk-brand">'+logo+'<div class="pk-co">'+(co.rfc?'RFC: '+esc(co.rfc)+(co.phone?' · ':''):'')+(co.phone?'Tel: '+esc(co.phone):'')+'</div></div>'
      +'<div class="pk-title"><h1>ORDEN DE SURTIDO Y EMPAQUE</h1><div class="pk-sub">Lista de surtido y empaque'+(quoteNo?(' · Cotización '+esc(quoteNo)):'')+'</div></div>'
      +'</div>'
      +'<div class="pk-sum">'
        +'<div class="pk-cell big"><span class="k">Cliente</span><span class="v">'+esc(custDisplay)+'</span></div>'
        +'<div class="pk-cell"><span class="k">Vendedor</span><span class="v">'+esc(issuer)+'</span></div>'
        +'<div class="pk-cell"><span class="k">Fecha</span><span class="v">'+dateStr+'</span></div>'
        +'<div class="pk-cell"><span class="k">Hora de impresión</span><span class="v">'+timeStr+'</span></div>'
      +'</div>'
      +'<div class="pk-sum">'
        +'<div class="pk-cell big accent"><span class="k">No. de SKU</span><span class="v">'+skuCount+'</span></div>'
        +'<div class="pk-cell big accent"><span class="k">Piezas totales</span><span class="v">'+qfmt(totalQty)+'</span></div>'
        +'<div class="pk-cell big" style="background:#fdeee9;border-color:#e0a89a"><span class="k">Límite de empaque (6 h hábiles · 07:30–17:00)</span><span class="v" style="color:#c0392b">'+dueStr+'</span></div>'
        +(noRackCount?'<div class="pk-cell big" style="background:#fdeee9;border-color:#e0a89a"><span class="k">SKU sin ubicación</span><span class="v" style="color:#c0392b">'+noRackCount+'</span></div>':'')
      +'</div>';

    const colHead='<thead><tr>'
      +'<th class="c-no">#</th><th class="c-sku">Clave SKU</th><th class="c-syd">Clave SYD</th><th class="c-name">Producto</th>'
      +'<th class="c-qty">Cantidad</th><th class="c-rack">Ubicación rack</th><th class="c-chk">Surtido</th>'
      +'</tr></thead>';

    // 하단 폼(페이지마다 반복 고정): 작업자 이름·서명·날짜·시각 + 페이지번호
    const footHtml=(n)=>
      '<div class="pk-foot">'
      +'<div class="pk-sign">'
        +'<div class="sg"><span class="lbl">Nombre del operador</span><span class="ln"></span></div>'
        +'<div class="sg"><span class="lbl">Firma</span><span class="ln"></span></div>'
        +'<div class="sg sm"><span class="lbl">Fecha</span><span class="ln"></span></div>'
        +'<div class="sg sm"><span class="lbl">Hora</span><span class="ln"></span></div>'
      +'</div>'
      +'<div class="pk-note">Una vez surtidos y empacados todos los SKU, la firma sirve como comprobante de empaque terminado.'
        +'<span class="pk-pg">Página <b>'+n+'</b> de '+pageCount+'</span></div>'
      +'</div>';

    let pagesHtml='';
    for(let p=0;p<pageCount;p++){
      const slice=items.slice(p*PER_PAGE,(p+1)*PER_PAGE);
      let rows='';
      slice.forEach((x,i)=>{
        const seq=p*PER_PAGE+i+1;
        // 0245 · 랙 위치 = 랙별 재고(지시서 저장 위치). FM = fast moving 랙. 랙재고가 없으면 제품마스터 위치.
        const rk=x.stop_rack||'';
        const rack=rk?(esc(rk)+(x.stop_kind==='fast'?' <span class="fm">FM</span>':'')+(x.from_master?'<span class="mst">ubic. maestro</span>':''))
                     :'<span class="norack">⚠ SIN UBICACIÓN</span>';
        rows+='<tr>'
          +'<td class="c-no">'+seq+'</td>'
          +'<td class="c-sku">'+esc(x.ctr_code||'—')+'</td>'
          +'<td class="c-syd">'+esc(x.syd_codes||sydMap[(x.ctr_code||'').trim()]||'')+'</td>'
          +'<td class="c-name">'+esc(x.product_name||'(미등록)')
            +(x.split?'<span class="split">'+x.part+'/'+x.parts+' · Total SKU '+qfmt(x.sku_total)+'</span>':'')+'</td>'
          +'<td class="c-qty">'+qfmt(x.stop_qty)+'</td>'
          +'<td class="c-rack">'+rack+'</td>'
          +'<td class="c-chk"><span class="chk"></span></td>'
          +'</tr>';

  async function doConvert(){
    const m=$('cvMsg');m.className='msg';
    const body={inv_date:$('cvDate').value||null};
    if(cvGuest){
      const cid=$('cvCustomer').value;
      if(!cid){m.className='msg err';m.textContent='고객을 지정하세요(불특정 견적).';return;}
      body.customer_id=Number(cid);
    }
    if($('cvSeller').value) body.seller_id=Number($('cvSeller').value);   // 0235
    $('cvBtn').disabled=true;
    try{
      const res=await fetch(session.api+'/api/quotes/'+cvId+'/convert',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify(body)});
      const d=await res.json();
      if(!res.ok||d.error){
        let msg=d.error;
        if(d.error==='guest_needs_customer')msg='불특정 견적입니다. 고객을 지정하세요.';
        else if(d.error==='no_valid_lines')msg='전환할 유효한 품목이 없습니다(매칭된 제품 필요).';
        else if(d.error==='already_converted')msg='이미 전환된 견적입니다.';
        else if(d.error==='packing_doc_required')msg='포장작업지시서 서명 스캔본을 먼저 업로드하세요.';
        // 0193 · 매출 전환도 RFC 가 있어야 한다(견적 단계까지는 RFC 없이 진행 가능).
        else if(d.error==='customer_rfc_required')msg=(d.note||'RFC 가 없는 고객입니다. 영업>고객등록에서 RFC 를 먼저 입력하세요.')+(d.customer_name?(' ('+d.customer_name+')'):'');
        // 0235 · 고객 독점 정책
        else if(d.error==='exclusive_other'||d.error==='seller_required'||d.error==='seller_self_only')msg=d.note||d.error;
        else if(d.error==='sale_failed')msg=(d.detail&&d.detail.note)?d.detail.note:('매출 생성 실패: '+JSON.stringify(d.detail||{}));
        else if(d.error==='no_list_price')msg=(d.note||'정가 없는 제품이 있습니다.')+' [ '+(d.items||[]).map(x=>x.code).join(', ')+' ]';
        // 0224b · 서버는 더 이상 이 오류로 전환을 막지 않는다. 구버전 백엔드와 섞여 배포된
        //   경우에만 보이므로 안내만 남겨 둔다(앞뒤 배포 시차 보호).
        else if(d.error==='inactive_product_lines')msg=(d.note||'판매중단 제품이 포함돼 있습니다.')
          +' [ '+(d.items||[]).map(x=>x.code).join(', ')+' ]';
        m.className='msg err';m.textContent='전환 실패: '+msg;return;
      }
      m.className='msg ok';
      let parts=[];
      if(d.invoice_id) parts.push('인보이스 #'+d.invoice_id+' 발행(가용재고분)');
      else parts.push('가용재고 없음 — 매출 0');
      if(d.shortages&&d.shortages.length){
        const amt=Number(d.shortage_amount||0);
        parts.push('부족 '+d.shortages.length+'건 기록'+(amt>0?(' · 매출 불가 $'+amt.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})):''));
      }
      if(d.dev_requests) parts.push('개발요청 '+d.dev_requests+'건');
      if(!d.invoice_id) m.className='msg err';
      m.textContent='견적 종료 — '+parts.join(' · ');
      setTimeout(()=>{ closeConvert(); load(); }, d.invoice_id?1600:2400);
    }catch(e){m.className='msg err';m.textContent='서버 연결 실패';}
    finally{$('cvBtn').disabled=false;}
  }

<script>
/* 2026-09-30 ql-0930sc2 · 표 위 가로 스크롤바 동기화.
   - 표가 상자보다 넓을 때만 보인다(한국어 화면에서 표가 다 들어오면 숨김).
   - 크롬 자동번역은 렌더 뒤에 글자를 바꿔 열 폭이 달라지므로, 목록 영역의 DOM·크기 변화를 감시해 폭을 다시 맞춘다.
   - 상단 고정 메뉴(#rnav) 높이만큼 아래에 붙는다. */
(function(){
  var wrap=document.getElementById('listWrap'), bar=document.getElementById('listTopScroll');
  if(!wrap||!bar) return;
  var inner=bar.firstElementChild, raf=0, ro=null, seen=null;
  function navH(){ var n=document.getElementById('rnav'); return n?Math.round(n.getBoundingClientRect().height):0; }
  function sync(){
    raf=0;
    var tbl=wrap.querySelector('table');
    if(ro&&tbl&&tbl!==seen){ if(seen) ro.unobserve(seen); ro.observe(tbl); seen=tbl; }
    if(!tbl||wrap.scrollWidth<=wrap.clientWidth+1){ bar.hidden=true; return; }
    bar.hidden=false;
    inner.style.width=wrap.scrollWidth+'px';
    bar.style.top=navH()+'px';
    if(Math.abs(bar.scrollLeft-wrap.scrollLeft)>1) bar.scrollLeft=wrap.scrollLeft;
  }
  function later(){ if(!raf) raf=requestAnimationFrame(sync); }
  bar.addEventListener('scroll',function(){ if(Math.abs(wrap.scrollLeft-bar.scrollLeft)>1) wrap.scrollLeft=bar.scrollLeft; });
  wrap.addEventListener('scroll',function(){ if(Math.abs(bar.scrollLeft-wrap.scrollLeft)>1) bar.scrollLeft=wrap.scrollLeft; });
  if(window.ResizeObserver){ ro=new ResizeObserver(later); ro.observe(wrap); }
  if(window.MutationObserver) new MutationObserver(later).observe(wrap,{childList:true,subtree:true,characterData:true});
  window.addEventListener('resize',later);
  window.addEventListener('load',later);
  later();
})();
</script>
