<style>
  :root{--paper:#F4F1EA;--card:#FFFFFF;--ink:#1C1B19;--muted:#6F6A60;--line:#E6E1D6;--income:#0F6E56;--income-bg:#E4F0EB;--expense:#B23A2E;--expense-bg:#F6E7E4;--brand:#143D34;--gold:#B8893B;--purple:#6B4FB0;--radius:12px;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;padding:24px}
  .wrap{max-width:1080px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:12px;background:var(--brand);color:#fff;padding:14px 18px;border-radius:var(--radius)}
  .topbar h1{margin:0;font-size:18px}.topbar .sub{font-size:12px;color:#cfe0d8}
  .portalBtn{color:#cfe0d8;font-size:12px;text-decoration:none;border:1px solid #2f5d50;padding:5px 10px;border-radius:7px;margin-left:auto}
  .who{font-size:13px;text-align:right;margin-left:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
  .card-h{font-size:14px;font-weight:800;color:var(--brand);margin-bottom:10px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
  input{padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:13px;background:#fff}
  .btn{padding:8px 14px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--brand)}.btn.sm{padding:5px 10px;font-size:12px}
  .msg{margin-top:10px;font-size:13px;border-radius:8px;padding:9px 12px;display:none}
  .msg.err{display:block;background:var(--expense-bg);color:var(--expense)}
  .api{margin-top:12px;font-size:11px;color:var(--muted)}.api input{font-size:12px;padding:6px 8px;margin-top:3px;width:100%}
  .hidden{display:none}.hint{font-size:11.5px;color:var(--muted);line-height:1.5}
  .mrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.mrow .ml{font-size:12px;font-weight:700;color:var(--muted);margin-right:4px}
  .mbtn{min-width:38px;padding:6px 9px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .mbtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .tab{padding:8px 14px;border:1px solid var(--line);border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;background:#fff;color:var(--muted)}
  .tab.on{color:#fff}
  .tab.quotes.on{background:var(--brand);border-color:var(--brand)}
  .tab.immediate.on{background:var(--income);border-color:var(--income)}
  .tab.shortage.on{background:var(--gold);border-color:var(--gold)}
  .tab.dev.on{background:var(--purple);border-color:var(--purple)}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
  th,td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  th{font-size:11px;color:var(--muted);background:#faf8f3;font-weight:700}
  td.r,th.r{text-align:right}
  tr.click{cursor:pointer}tr.click:hover{background:#faf8f3}
  tr.sub td{background:#faf8f3;font-size:11.5px}
  .clamp2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;max-height:2.6em;overflow:hidden;word-break:break-word;overflow-wrap:anywhere;line-height:1.3}
  .inv-scroll{max-height:300px;overflow:auto;border:1px solid var(--line,#e6e1d6);border-radius:8px;background:#fff}
  .inv-scroll thead th{position:sticky;top:0;background:#f4f1ea;z-index:1}
  .inv-scroll td,.inv-scroll th{word-break:break-word;overflow-wrap:anywhere;overflow:hidden}
  .inv-scroll .inv-code{display:block;word-break:break-all}
  .inv-totals{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--brand);padding:8px 6px;display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end;align-items:center;font-size:12.5px}
  .inv-code{font-weight:700;color:var(--brand)}
  .seg{display:inline-flex;height:14px;border-radius:3px;overflow:hidden;width:110px;vertical-align:middle;border:1px solid var(--line)}
  .seg i{display:block;height:100%}.si{background:var(--income)}.ss{background:var(--gold)}.sd{background:var(--purple)}
  .pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
  .pill.ok{background:var(--income-bg);color:var(--income)}.pill.low{background:#fdf3e3;color:#9a6512}.pill.nf{background:#f1ebf7;color:#6B4FB0}
  .pill.conv{background:var(--income-bg);color:var(--income)}.pill.draft{background:#eef0f2;color:#555}
  .st{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px}
  .st.received{background:#eef0f2;color:#555}.st.reviewed{background:#fdf3e3;color:#9a6512}.st.factory_requested{background:#e8eefb;color:#2f5db2}.st.developed{background:var(--income-bg);color:var(--income)}
  .grp{font-size:13px;font-weight:800;color:var(--brand);margin:14px 0 4px}
  .okv{color:var(--income);font-weight:700}.lowv{color:var(--gold);font-weight:700}.nfv{color:var(--purple);font-weight:700}
  /* 매출 확정 요약(고정 박스) */
  .sumcap{font-size:12px;font-weight:700;color:var(--brand);margin:2px 0 6px}
  .sumcap span{color:var(--muted);font-weight:600}
  .sumbox{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 0 16px}
  .sumcell{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;min-width:0}
  .sumcell .k{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sumcell .v{font-size:19px;font-weight:800;color:var(--brand);margin-top:3px;line-height:1.15;overflow-wrap:anywhere}
  .sumcell .d{font-size:10.5px;margin-top:5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sumcell .d.up{color:var(--income)} .sumcell .d.dn{color:var(--expense)} .sumcell .d.fl{color:var(--muted)}
  @media(max-width:900px){.sumbox{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.sumbox{grid-template-columns:repeat(2,1fr)}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="refatrix-tablesort.js?v=ts20260825"></script>
<script>
  // ── 시각 표시 — 서버는 UTC 로 저장한다. 화면은 멕시코 중부(UTC−6 고정)로 보여 준다. (2026-10-07)
  function mxHora(v){
    if(v==null||v==='') return '';
    var d=new Date(v);
    if(String(v).length<=10||isNaN(d.getTime())) return String(v).slice(0,16).replace('T',' ');
    return new Date(d.getTime()-360*60000).toISOString().slice(0,16).replace('T',' ');
  }
  function mxDia(v){ var s=mxHora(v); return s?s.slice(0,10):''; }
  function mxHoy(){ return new Date(Date.now()-360*60000).toISOString().slice(0,10); }

  let session={token:null,user:null,api:''};
  let cat='quotes', months=[], FYEAR=new Date().getFullYear();
  let openRows={};
  let invCache={};
  let invFilesCache={};   // 인보이스별 첨부파일 메타 캐시(재렌더 시 복원)
  let invCompany=null, stmtInvId=null;
  let immOwner='', immTeam='';
  // 0225 · 매출 확정 목록 한 칸 검색 — 견적번호 · 고객명 · 고객 PO번호 · SAT.
  //   검색어가 있으면 서버가 **전 기간**에서 찾는다(상단 요약 박스는 선택한 월 기준 그대로).
  let immSearch='';
  const $=(id)=>document.getElementById(id);
  const auth=()=>({'Authorization':'Bearer '+session.token});
  const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const nf=(n)=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:3});
  const money=(n)=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
  // 표 제목 클릭 정렬(refatrix-tablesort.js) — 본문을 그린 뒤 항상 여기로 통과시킨다.
  function setBody(h){ $('body').innerHTML=h; try{ if(window.RTSort) RTSort.apply($('body')); }catch(e){} }

  function portalSession(){
    try{ const raw=sessionStorage.getItem('refatrix_session'); if(raw){ const o=JSON.parse(raw); if(o&&o.token) return o; } }catch(e){}
    try{ const h=location.hash.slice(1); if(h){ const p=new URLSearchParams(h); const token=p.get('token'); if(token){ const o={token,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')}; try{sessionStorage.setItem('refatrix_session',JSON.stringify(o));}catch(e){} return o; } } }catch(e){}
    return null;
  }
  function parseHash(){
    try{ const p=new URLSearchParams(location.hash.slice(1));
      const c=p.get('cat'); if(c) cat=c;
      const m=p.get('months'); if(m) months=m.split(',').filter(x=>/^\d{4}-\d{2}$/.test(x));
    }catch(e){}
    if(!months.length) months=[new Date().toISOString().slice(0,7)];
  }
  async function login(){
    const api=$('api').value.replace(/\/+$/,'');const login_id=$('lid').value.trim(),pin=$('pin').value.trim();
    const m=$('loginMsg');m.className='msg';
    if(!login_id||!pin){m.className='msg err';m.textContent='아이디와 PIN을 입력하세요.';return;}
    $('go').disabled=true;$('go').textContent='확인 중…';
    try{
      let d,res={ok:true};const ps=portalSession();
      if(ps&&ps.token){d={token:ps.token,user:ps.user};}
      else{res=await fetch(api+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login_id,pin})});d=await res.json();}
      if(!res.ok||d.error){m.className='msg err';m.textContent='로그인 실패: '+(d.error||res.status);return;}
      session={token:d.token,user:d.user,api:(ps&&ps.api)||api};
      try{sessionStorage.setItem('refatrix_session',JSON.stringify({token:session.token,api:session.api,user:session.user||{}}));}catch(e){}
      $('who').innerHTML='<b>'+esc(d.user?.name||login_id)+'</b><br>'+esc(d.user?.role||'-');
      $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');
      parseHash(); renderMonths();
      var _ht='quotes'; try{ var _p=new URLSearchParams(location.hash.slice(1)); _ht=_p.get('tab')||'quotes'; }catch(e){}
      if(['quotes','immediate','shortage','dev'].indexOf(_ht)<0)_ht='quotes';
      setCat(_ht,true);
      window.addEventListener('hashchange',function(){ if(!$('app').classList.contains('hidden')){ var t='quotes'; try{var p=new URLSearchParams(location.hash.slice(1));t=p.get('tab')||'quotes';}catch(e){} if(['quotes','immediate','shortage','dev'].indexOf(t)>=0)setCat(t,true);} });
    }catch(e){m.className='msg err';m.textContent='서버에 연결할 수 없습니다.';}
    finally{$('go').disabled=false;$('go').textContent='로그인';}
  }

  function renderMonths(){
    const btns=Array.from({length:12},(_,i)=>{const mm=String(i+1).padStart(2,'0');const ym=FYEAR+'-'+mm;
      return '<button class="mbtn '+(months.includes(ym)?'on':'')+'" onclick="toggleMonth(\''+ym+'\')">'+(i+1)+'월</button>';}).join(' ');
    $('months').innerHTML='<span class="ml">조회 월 ('+FYEAR+')</span>'+btns;
  }
  function toggleMonth(ym){ const i=months.indexOf(ym); if(i>=0){ if(months.length>1) months.splice(i,1); } else months.push(ym); renderMonths(); load(); }
  function setCat(c,skipReset){ cat=c; ['quotes','immediate','shortage','dev'].forEach(k=>$('t-'+k).classList.toggle('on',k===c)); openRows={}; load(); if(window.__rnavRefresh)window.__rnavRefresh(); }
  const mq=()=>encodeURIComponent(months.join(','));

  async function load(){
    $('body').innerHTML='<div class="hint" style="margin-top:10px">불러오는 중…</div>';
    try{
      if(cat==='quotes') return loadQuotes();
      if(cat==='immediate') return loadImmediate();
      if(cat==='shortage') return loadShortage();
      if(cat==='dev') return loadDev();
    }catch(e){ $('body').innerHTML='<div class="hint">불러오지 못했습니다.</div>'; }
  }

  // ① 견적 요청 → 견적 목록, 클릭 시 SKU 라인
  async function loadQuotes(){
    const d=await fetch(session.api+'/api/dashboard/funnel/quotes?months='+mq(),{headers:auth()}).then(r=>r.json());
    const items=d.items||[];
    if(!items.length){ $('body').innerHTML='<div class="hint" style="margin-top:10px">해당 기간 견적이 없습니다.</div>'; return; }
    let h='<div class="hint" style="margin-top:8px">견적을 클릭하면 SKU별 세부 내역을 펼칩니다. 구성막대: <span class="okv">■</span>즉시 <span class="lowv">■</span>부족 <span class="nfv">■</span>개발 (수량 비중)</div>';
    h+='<table data-sort="funnel:quotes"><thead><tr><th>견적번호</th><th>견적일</th><th>고객</th><th class="r">SKU</th><th class="r">총수량</th><th data-nosort>구성</th><th class="r">즉시%</th><th>상태</th></tr></thead><tbody>';
    items.forEach(q=>{
      h+='<tr class="click" onclick="toggleQuote('+q.id+')">'
        +'<td><b>'+esc(q.quote_no||'')+'</b></td><td>'+esc(q.qdate||'')+'</td><td>'+esc(q.customer_name||'')+'</td>'
        +'<td class="r">'+q.req_sku+'</td><td class="r">'+nf(q.req_qty)+'</td>'
        +'<td><span class="seg"><i class="si" style="width:'+q.ok_qty_pct+'%"></i><i class="ss" style="width:'+q.short_qty_pct+'%"></i><i class="sd" style="width:'+q.dev_qty_pct+'%"></i></span></td>'
        +'<td class="r okv">'+q.ok_qty_pct+'%</td>'
        +'<td>'+(q.converted?'<span class="pill conv">전환됨</span>':'<span class="pill draft">미전환</span>')+'</td></tr>';
      if(openRows['q'+q.id]) h+='<tr class="sub" id="qsub'+q.id+'"><td colspan="8">'+(openRows['q'+q.id]==='loading'?'불러오는 중…':openRows['q'+q.id])+'</td></tr>';
    });
    h+='</tbody></table>';
    setBody(h);
  }
  async function toggleQuote(id){
    if(openRows['q'+id]){ delete openRows['q'+id]; return loadQuotes(); }
    openRows['q'+id]='loading'; await loadQuotes();
    try{ const d=await fetch(session.api+'/api/dashboard/funnel/quote-lines?quote_id='+id,{headers:auth()}).then(r=>r.json());
      const lines=d.items||[];
      let t='<table style="margin:0" data-sort="funnel:quotelines"><thead><tr><th>코드</th><th>품명</th><th class="r">수량</th><th class="r">가용재고</th><th>분류</th><th class="r">라인금액</th></tr></thead><tbody>';
      lines.forEach(l=>{ t+='<tr><td>'+esc(l.ctr_code||l.input_code||'')+'</td><td>'+esc(l.product_name||'(미등록)')+'</td><td class="r">'+nf(l.qty)+'</td><td class="r">'+(l.avail_stock==null?'-':nf(l.avail_stock))+'</td><td>'+flagPill(l.stock_flag)+'</td><td class="r">'+money(l.line_total)+'</td></tr>'; });
      t+='</tbody></table>';
      openRows['q'+id]=t; loadQuotes();
    }catch(e){ openRows['q'+id]='불러오지 못했습니다.'; loadQuotes(); }
  }
  function flagPill(f){ return f==='ok'?'<span class="pill ok">즉시</span>':f==='low_stock'?'<span class="pill low">부족</span>':'<span class="pill nf">개발</span>'; }

  // ② 즉시 매출 → 발행가능 / 이미발행
  // 매출 확정 요약 박스: 영역은 고정, 숫자만 변함 + 전월(직전 동기간) 대비 작은 글씨
  function summaryBox(s){
    if(!s||!s.cur) return '';
    const c=s.cur, dl=s.delta||{}, pc=s.pct||{};
    const cell=(label,curv,key,isMoney)=>{
      const delta=Number(dl[key]||0), pct=pc[key];
      const cls=delta>0?'up':(delta<0?'dn':'fl');
      const arrow=delta>0?'▲':(delta<0?'▼':'–');
      const dabs=isMoney?('MX$'+money(Math.abs(delta))):nf(Math.abs(delta));
      const sign=delta>0?'+':(delta<0?'−':'');
      const pctTxt=(pct==null)?(delta>0?'신규':'—'):(sign+Math.abs(pct)+'%');
      return '<div class="sumcell"><div class="k">'+label+'</div><div class="v">'+curv+'</div>'
        +'<div class="d '+cls+'" title="'+esc(s.label)+'">'+arrow+' '+sign+dabs+' · '+pctTxt+'</div></div>';
    };
    return '<div class="sumcap">매출 확정 요약 <span>· '+esc(s.label)+'</span></div>'
      +'<div class="sumbox">'
      + cell('SKU 수', nf(c.sku), 'sku', false)
      + cell('총 수량', nf(c.qty), 'qty', false)

  function paginateRows(rowHs, maxDomPx, fullHeaderH, repHeaderH, theadH, totalsH){
    const pages=[]; let cur=[], used=0;
    const budgetFor=first=>maxDomPx-(first?fullHeaderH:repHeaderH)-theadH;
    let budget=budgetFor(true);
    for(let i=0;i<rowHs.length;i++){
      const rh=rowHs[i]||24;
      if(cur.length && used+rh>budget){ pages.push(cur); cur=[]; used=0; budget=budgetFor(false); }
      cur.push(i); used+=rh;
    }
    if(cur.length) pages.push(cur);
    if(!pages.length) pages.push([]);
    const lastFirst=(pages.length===1);
    const lastBudget=maxDomPx-(lastFirst?fullHeaderH:repHeaderH)-theadH;
    const lastUsed=pages[pages.length-1].reduce((s,i)=>s+(rowHs[i]||24),0);
    return { pages, totalsOnNewPage: (lastUsed+totalsH>lastBudget) };
  }

  async function onInvoiceFilePicked(id, input){
    const files=Array.from(input.files||[]); if(!files.length) return;
    const msg=document.getElementById('invfile-msg-'+id);
    const MAX=8*1024*1024; let okN=0, errN=0, lastErr='';
    for(const f of files){
      if(f.size>MAX){ errN++; lastErr='“'+f.name+'” 8MB 초과'; continue; }
      if(msg){ msg.style.color=''; msg.textContent='“'+f.name+'” 업로드 중…'; }
      let data;
      try{ data=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error('read')); r.readAsDataURL(f); }); }
      catch(_){ errN++; lastErr='“'+f.name+'” 읽기 실패'; continue; }
      try{
        const res=await fetch(session.api+'/api/sales/'+id+'/files',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({file_name:f.name,mime_type:f.type||'',data})});
        const dd=await res.json().catch(()=>({}));
        if(!res.ok||dd.error){
          errN++;
          if(res.status===403) lastErr='업로드 권한이 없습니다';
          else if(dd.note==='too_large') lastErr='“'+f.name+'” 파일이 너무 큼';
          else if(dd.note==='bad_mime') lastErr='“'+f.name+'” 지원하지 않는 형식';
          else lastErr='“'+f.name+'” 업로드 실패';
          continue;
        }
        okN++;
      }catch(e){ errN++; lastErr='“'+f.name+'” 서버 연결 실패'; }
    }
    if(msg){
      if(errN===0){ msg.style.color='var(--income)'; msg.textContent='업로드 완료 ('+okN+'건)'; }
      else { msg.style.color='var(--expense)'; msg.textContent=(okN?okN+'건 완료 · ':'')+errN+'건 실패: '+lastErr; }
    }

      const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      const url=URL.createObjectURL(new Blob([arr],{type:mime}));
      const w=window.open(url,'_blank'); if(!w) alert('팝업이 차단되었습니다. 팝업을 허용하세요.');

  function adjLabel(basis,rate){

  }

  }

    const lab=adjLabel(a.basis,a.rate);

        +' <b style="color:'+(diff<0?'var(--expense)':'var(--income)')+'">('+(diff>0?'+':'')+money(diff)+')</b></span>'):'')
      +(a.pre_total_mxn!=null?('<span>총계(IVA 포함): <s style="color:var(--muted)">'+money(a.pre_total_mxn)+'</s> → <b>'+money(inv.total_mxn)+'</b></span>'):'')

  // ===== 2026-10-13 · 할인율로 매출액 수정 + 최종단가 엑셀 =====
  //   서버 repriceByDiscount(src/sales.js)와 같은 계산 — 미리보기 숫자 = 적용 후 숫자.
  //   정가 대비: 단가 = 정가×(1−r) (몇 번 적용해도 누적되지 않음) / 현재 매출액 대비: 단가 = 현재 실효단가×(1−r) (적용할 때마다 누적)
  const rpxR2=(n)=>Math.round((Number(n)+Number.EPSILON)*100)/100;
  function rpxCompute(items,basis,rate,ivaRate){
    const r=Number(rate);
    if(basis!=='list'&&basis!=='current') return {error:'기준을 선택하세요.'};
    if(rate===''||rate==null||!isFinite(r)||r<0||r>=100) return {error:'할인율은 0 이상 100 미만'};
    if(!items||!items.length) return {error:'라인 없음'};
    const out=[];
    for(const l of items){
      const qty=Number(l.qty)||0, list=Number(l.list_price)||0;
      let unit;
      if(basis==='list'){ if(!(list>0)) return {error:'정가 0인 품목: '+(l.ctr_code||'')}; unit=rpxR2(list*(1-r/100)); }
      else { if(!(qty>0)) return {error:'수량 0인 품목: '+(l.ctr_code||'')}; unit=rpxR2((Number(l.line_amount_mxn)/qty)*(1-r/100)); }
      out.push({unit, amt:rpxR2(unit*qty)});
    }
    const sub=rpxR2(out.reduce((s,x)=>s+x.amt,0)); const iva=rpxR2(sub*(ivaRate==null?16:Number(ivaRate))/100);
    return {lines:out, sub, iva, tot:rpxR2(sub+iva)};
  }
  function rpxEffPct(items){
    let list=0, amt=0; (items||[]).forEach(l=>{ list+=(Number(l.list_price)||0)*(Number(l.qty)||0); amt+=Number(l.line_amount_mxn)||0; });
    return list>0? rpxR2((1-amt/list)*100) : null;
  }

      +' · 정가 대비는 몇 번 적용해도 같은 결과이고, 「현재 매출액에서 추가 할인」은 적용할 때마다 누적됩니다. 단가는 소수 2자리로 맞춰 <b>수량 × 단가 = 금액</b>이 정확히 맞고, 입금예정(미수금)도 함께 수정됩니다.</div>'

    const out=document.getElementById('rpx-out-'+id); if(!out) return;

    const basis=(document.getElementById('rpx-basis-'+id)||{}).value;

  async function rpxApply(id){

    }catch(e){ if(msg){msg.style.color='var(--expense)';msg.textContent='서버 연결 실패';} }

  // 최종단가 엑셀 — 지금 인보이스에 확정된 최종 매출액(IVA 제외) 기준 품목별 최종단가.
  //   단가 = 라인금액 ÷ 수량. 2자리로 딱 떨어지면 2자리, 아니면(총액 직접 입력으로 비례 조정된 줄) 6자리까지(CFDI ValorUnitario 허용 범위).
  function pxlsUnit(l){
    const qty=Number(l.qty)||0, amt=Number(l.line_amount_mxn)||0;
    if(!(qty>0)) return 0;
    const u2=rpxR2(amt/qty);
    if(Math.abs(rpxR2(u2*qty)-amt)<0.005) return u2;
    return Math.round((amt/qty)*1e6)/1e6;
  }
  function pxlsBuildAoa(d){
    const inv=d.invoice||{}, items=d.items||[]; const ivaR=(inv.iva_rate==null?16:Number(inv.iva_rate))/100;
    const aoa=[];
    aoa.push(['Refatrix — Precios unitarios finales / 최종단가']);
    aoa.push(['Cliente', (inv.customer_code?inv.customer_code+' · ':'')+(inv.customer_name||''), '', 'RFC', inv.customer_rfc||'']);
    aoa.push(['SAT', inv.sat_no||'—', '', 'Folio', inv.folio_no||'']);
    aoa.push(['Fecha factura', inv.inv_date_str||String(inv.inv_date||'').slice(0,10), '', 'Descargado', mxHoy()]);
    const adj=inv.price_adj||null;
    if(adj){
      const r=adj.rate==null?'':(Number(adj.rate)+'%');
      const lab=adj.basis==='current'?('Descuento adicional '+r):(adj.basis==='list'?('Descuento sobre precio lista '+r):'Ajuste manual del total');
      aoa.push(['Ajuste aplicado', lab, '', 'Subtotal antes (sin IVA)', adj.pre_subtotal_mxn==null?'':Number(adj.pre_subtotal_mxn), 'Subtotal final (sin IVA)', Number(inv.subtotal_mxn)||0]);
    }
    aoa.push([]);
    const head=['#','Código CTR','SYD','Descripción','Cant.','Precio lista','Desc. %','Precio unit. final (sin IVA)','Importe (sin IVA)','IVA','Importe (con IVA)'].concat(adj?['Precio unit. antes del ajuste']:[]);
    aoa.push(head);
    let sumAmt=0, sumQty=0, exact=true;
    items.forEach((l,i)=>{
      const qty=Number(l.qty)||0, amt=rpxR2(Number(l.line_amount_mxn)||0), list=Number(l.list_price)||0;
      const u=pxlsUnit(l); if(rpxR2(u)!==u) exact=false;   // 6자리 단가를 쓴 줄이 있으면 표시
      const disc=list>0? rpxR2((1-(qty>0?amt/qty:0)/list)*100) : '';
      const iva=rpxR2(amt*ivaR);
      sumAmt=rpxR2(sumAmt+amt); sumQty+=qty;
      aoa.push([i+1, l.ctr_code||'', l.syd_codes||'', l.product_name||'', qty, list||'', disc, u, amt, iva, rpxR2(amt+iva)].concat(adj?[l.pre_adj_unit_price==null?'':Number(l.pre_adj_unit_price)]:[]));
    });
    aoa.push([]);
    aoa.push(['','','','Total', sumQty,'','', 'Subtotal (sin IVA)', Number(inv.subtotal_mxn)||0]);
    aoa.push(['','','','','','','', 'IVA '+Math.round(ivaR*100)+'%', Number(inv.iva_mxn)||0]);
    aoa.push(['','','','','','','', 'Total (con IVA)', Number(inv.total_mxn)||0]);
    const okSum=Math.abs(sumAmt-(Number(inv.subtotal_mxn)||0))<0.005;
    aoa.push([]);
    aoa.push(['Verificación', (okSum?'✔ Σ Importe = Subtotal de la factura':'✖ Σ Importe ('+sumAmt.toFixed(2)+') ≠ Subtotal ('+(Number(inv.subtotal_mxn)||0).toFixed(2)+')')
      +(exact?' · Cant. × Precio unit. = Importe en todas las líneas':' · Algunas líneas usan precio con 6 decimales para cuadrar el importe')]);
    return {aoa, headRow:aoa.findIndex(r=>r[0]==='#'), okSum, exact};
  }
  function downloadFinalPriceXls(id){
    const d=invCache[id];
    if(!d||!d.invoice){ alert('내역을 불러오지 못했습니다. 다시 펼쳐 주세요.'); return; }
    if(!window.XLSX){ alert('엑셀 라이브러리를 불러오지 못했습니다. 새로고침(Ctrl+Shift+R) 후 다시 시도하세요.'); return; }
    const inv=d.invoice;
    const b=pxlsBuildAoa(d);
    const ws=XLSX.utils.aoa_to_sheet(b.aoa);
    ws['!cols']=[{wch:4},{wch:14},{wch:18},{wch:34},{wch:7},{wch:12},{wch:8},{wch:16},{wch:16},{wch:12},{wch:16},{wch:16}];
    // 숫자 서식: 단가는 6자리까지 보이게, 금액은 2자리
    const rng=XLSX.utils.decode_range(ws['!ref']);
    for(let R=b.headRow+1;R<=rng.e.r;R++){
      for(const C of [5,7,8,9,10,11]){ const cell=ws[XLSX.utils.encode_cell({r:R,c:C})]; if(cell&&cell.t==='n') cell.z=(C===7?'#,##0.00####':'#,##0.00'); }
    }
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Precios finales');
    const safe=String(inv.sat_no&&!String(inv.sat_no).startsWith('TMP-')?inv.sat_no:('inv_'+id)).replace(/[^\w\-]+/g,'_').slice(0,40);
    XLSX.writeFile(wb,'precios_finales_'+safe+'_'+mxHoy()+'.xlsx');
  }
  // 이벤트 위임(addEventListener) — 펼침 영역은 문자열로 다시 그려지므로 document 에서 받는다.
  document.addEventListener('input',function(e){ const t=e.target; if(t&&t.getAttribute&&t.getAttribute('data-rpx-prev')) rpxPreview(Number(t.getAttribute('data-rpx-prev'))); });

    if(!confirm('이 인보이스의 매출액을 다음으로 수정합니다.\n\n총계(IVA 미포함): '+money(sub)+'\nIVA: '+money(iva)+'\n총계(IVA 포함): '+money(tot)+'\n\n모든 라인 단가가 비례 재계산되고 입금예정 금액도 함께 수정됩니다. 진행할까요?')) return;

        const m=dd.note||(dd.error==='not_current_month'?'당월 매출만 수정할 수 있습니다.':(dd.error==='cannot_scale'?'기존 매출액이 0이라 조정할 수 없습니다.':(dd.error==='iva_gt_total'?'IVA가 총액보다 큽니다.':'수정 실패')));
        if(msg){msg.style.color='var(--expense)';msg.textContent=m;} return;
      }
      if(msg){msg.style.color='var(--income)';msg.textContent='수정됨';}
      delete openRows['i'+id]; delete invCache[id]; await loadImmediate(); toggleInvoice(id);
    }catch(e){ if(msg){msg.style.color='var(--expense)';msg.textContent='서버 연결 실패';} }

    h+='<div style="overflow-x:auto"><table data-sort="funnel:dev"><thead><tr><th>경쟁사코드</th><th>개발결과 CTR</th><th>고객</th><th class="r">수량</th><th>상태</th><th>오퍼</th><th>차량(메이커/차종/연식)</th><th data-type="date">접수일</th><th data-type="date">완료일</th><th class="r">소요</th></tr></thead><tbody>';
    devItems.forEach(r=>{
      h+='<tr class="click" data-devrow="'+r.id+'"><td><b>'+esc(r.input_code||'')+'</b></td><td>'+devCtrCell(r)+'</td><td>'+esc(r.customer_name||'-')+'</td><td class="r">'+(r.requested_qty==null?'-':nf(r.requested_qty))+'</td><td><span class="st '+r.status+'">'+(stLbl[r.status]||r.status)+'</span></td><td>'+devOfferCell(r)+'</td><td>'+esc(devVeh(r)||'-')+'</td><td>'+esc(r.requested_at||'')+'</td><td>'+esc(r.developed_at||'-')+'</td><td class="r">'+(r.dur_total==null?'–':r.dur_total+'일')+'</td></tr>';
      if(openRows['d'+r.id]) h+='<tr class="sub"><td colspan="10">'+devStagesHtml(r)+'</td></tr>';
    });
    return h+'</tbody></table></div>';
  }
  function devStagesHtml(r){
    const dd=(n)=> n==null?'–':(n+'일');
    return '<table style="margin:0"><tbody>'
      +'<tr><td>① 오더 접수일</td><td><b>'+esc(r.requested_at||'-')+'</b></td><td></td></tr>'
      +'<tr><td>② 검토완료일</td><td><b>'+esc(r.reviewed_at||'-')+'</b>'+(r.review_syd_code?' <span class="hint">SYD '+esc(r.review_syd_code)+'</span>':'')+'</td><td class="hint">'+dd(r.dur_review)+'</td></tr>'
      +'<tr><td>③ 공장 개발요청일</td><td><b>'+esc(r.factory_requested_at||'-')+'</b></td><td class="hint">'+dd(r.dur_factory)+'</td></tr>'
      +'<tr><td>④ 개발완료일</td><td><b>'+esc(r.developed_at||'-')+'</b></td><td class="hint">'+dd(r.dur_develop)+'</td></tr>'
      +'<tr><td><b>전체</b></td><td>'+(r.result_ctr_code?(esc(r.input_code||'')+' → <b>'+esc(r.result_ctr_code)+'</b>'+(r.result_product_name?' · '+esc(r.result_product_name):'')+(r.result_stock_qty!=null?' · 재고 '+nf(r.result_stock_qty):'')):'')+'</td><td class="hint"><b>'+dd(r.dur_total)+'</b></td></tr>'
      +'</tbody></table>';
  }
  function devGroups(){
    const m=new Map();
    devItems.forEach(r=>{ const k=r.customer_id?String(r.customer_id):'none';
      if(!m.has(k)) m.set(k,{customer_id:r.customer_id||null,name:r.customer_name||'고객 미지정',code:r.customer_code||'',rows:[]});
      m.get(k).rows.push(r); });
    const g=[...m.values()];
    g.forEach(x=>{ x.dev=x.rows.filter(r=>r.status==='developed').length; x.open=x.rows.length-x.dev; x.offerable=x.rows.filter(r=>r.offer_state==='offerable').length; });
    g.sort((a,b)=> (b.offerable-a.offerable) || (b.dev-a.dev) || (b.rows.length-a.rows.length) || String(a.name).localeCompare(String(b.name)));
    return g;
  }
  // 고객별 보기 상단 고객 선택 (2026-10-12) — 고객이 많아 스크롤로 찾지 않도록
  function devCustKey(g){ return g.customer_id?String(g.customer_id):'none'; }
  function devCustPicker(gs){
    const byName=gs.slice().sort((a,b)=>String(a.name).localeCompare(String(b.name)));
    const opt=(g)=>'<option value="'+esc(devCustKey(g))+'"'+(devCust===devCustKey(g)?' selected':'')+'>'
      +esc(g.name)+' — 요청 '+g.rows.length+(g.dev?' · 완료 '+g.dev:'')+(g.offerable?' · 오퍼가능 '+g.offerable:'')+'</option>';
    const offer=byName.filter(g=>g.offerable);
    return '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;padding:9px 11px;background:#faf8f3;border:1px solid var(--line);border-radius:10px">'
      +'<b style="font-size:12.5px;color:var(--brand)">고객 선택</b>'
      +'<select id="devCustSel" style="padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;min-width:260px;max-width:100%;background:#fff">'
      +'<option value=""'+(devCust?'':' selected')+'>전체 고객 ('+gs.length+')</option>'
      +(offer.length?'<optgroup label="오퍼 가능 고객">'+offer.map(opt).join('')+'</optgroup>':'')
      +'<optgroup label="전체 (이름순)">'+byName.map(opt).join('')+'</optgroup>'
      +'</select>'
      +(devCust?'<button class="mbtn" type="button" id="devCustClear">✕ 전체 보기</button>':'')
      +'<span class="hint">'+(devCust?'선택한 고객만 표시 · 엑셀도 이 고객만':'고객을 고르면 그 고객 카드만 보입니다')+'</span>'
      +'</div>';
  }
  function devCustHtml(){
    const all=devGroups();
    if(devCust&&!all.some(g=>devCustKey(g)===devCust)) devCust='';   // 기간을 바꿔 그 고객이 사라졌으면 전체로
    const gs=devCust?all.filter(g=>devCustKey(g)===devCust):all;
    let h=devCustPicker(all)+'<div class="hint" style="margin-top:8px">고객별 개발요청. <b>오퍼시트 만들기</b>는 개발완료되고 재고가 있는 건으로 그 고객의 「개발완료 오퍼시트」를 만듭니다(부족 해소 판매오퍼와 같은 시트 — 부족분 화면에서 PDF·WhatsApp 발송). 재고가 0이면 입고 승인 때 자동으로 만들어집니다.</div>';
    gs.forEach(g=>{
      h+='<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff">'
        +'<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'
        +'<b style="font-size:13.5px;color:var(--brand)">'+esc(g.name)+'</b>'+(g.code?'<span class="hint">'+esc(g.code)+'</span>':'')
        +'<span class="hint">요청 <b>'+g.rows.length+'</b> · 진행중 <b>'+g.open+'</b> · 개발완료 <b style="color:var(--income)">'+g.dev+'</b>'+(g.offerable?' · 오퍼 가능 <b style="color:var(--purple)">'+g.offerable+'</b>':'')+'</span>'
        +(g.customer_id&&g.offerable&&devCanOffer?'<button class="btn sm" type="button" data-devoffer="'+g.customer_id+'" style="margin-left:auto;background:var(--purple)">📄 오퍼시트 만들기 ('+g.offerable+'건)</button>':'')
        +(g.customer_id&&g.offerable&&!devCanOffer?'<span class="hint" style="margin-left:auto">오퍼시트 생성은 부족분·매출 편집 권한 필요</span>':'')
        +'</div>'
        +'<div style="overflow-x:auto"><table style="margin-top:6px"><thead><tr><th>경쟁사코드</th><th>개발결과 CTR</th><th class="r">요청수량</th><th>상태</th><th class="r">현재고</th><th>오퍼</th><th>접수일</th><th>완료일</th></tr></thead><tbody>';
      g.rows.slice().sort((a,b)=>(a.status==='developed'?0:1)-(b.status==='developed'?0:1)||String(b.requested_at).localeCompare(String(a.requested_at))).forEach(r=>{
        h+='<tr><td><b>'+esc(r.input_code||'')+'</b></td><td>'+devCtrCell(r)+'</td><td class="r">'+(r.requested_qty==null?'-':nf(r.requested_qty))+'</td>'
          +'<td><span class="st '+r.status+'">'+(stLbl[r.status]||r.status)+'</span></td>'
          +'<td class="r">'+(r.result_stock_qty==null?'<span class="hint">—</span>':nf(r.result_stock_qty))+'</td>'
          +'<td>'+devOfferCell(r)+'</td><td>'+esc(r.requested_at||'')+'</td><td>'+esc(r.developed_at||'-')+'</td></tr>';
      });
      h+='</tbody></table></div></div>';
    });
    return h;
  }
  function bindDev(){
    const cs=$('devCustSel'); if(cs) cs.addEventListener('change',()=>{ devCust=cs.value; renderDev(); });
    const cc=$('devCustClear'); if(cc) cc.addEventListener('click',()=>{ devCust=''; renderDev(); });
    document.querySelectorAll('[data-devview]').forEach(b=>b.addEventListener('click',()=>{ devView=b.getAttribute('data-devview'); renderDev(); }));
    const chk=$('devAllChk'); if(chk) chk.addEventListener('change',()=>{ devAll=chk.checked; devMsg=''; load(); });
    const xb=$('devXlsBtn'); if(xb) xb.addEventListener('click',downloadDevXlsx);
    const sb=$('devSweepBtn'); if(sb) sb.addEventListener('click',devSweep);
    document.querySelectorAll('[data-devrow]').forEach(tr=>tr.addEventListener('click',e=>{
      if(e.target.closest('a')) return;
      const id=Number(tr.getAttribute('data-devrow')); if(openRows['d'+id]) delete openRows['d'+id]; else openRows['d'+id]=1; renderDev(); }));
    document.querySelectorAll('[data-devoffer]').forEach(b=>b.addEventListener('click',()=>devMakeOffer(Number(b.getAttribute('data-devoffer')),b)));
  }
  async function devSweep(){
    const b=$('devSweepBtn'); if(b){ b.disabled=true; b.textContent='🔄 대조 중…'; }
    try{
      const res=await fetch(session.api+'/api/dev-requests/match-sweep',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:'{}'});
      const d=await res.json();
      if(!res.ok||d.error) throw new Error(d.error||res.status);
      const amb=d.ambiguous||[];
      devMsg=(d.matched>0
          ? '✅ 카탈로그 대조 — <b>'+d.matched+'건 개발완료</b>: '+(d.items||[]).slice(0,10).map(it=>esc(it.input_code)+' → <b>'+esc(it.ctr_code)+'</b>'+(it.customer_name?' ('+esc(it.customer_name)+')':'')).join(' · ')+((d.items||[]).length>10?' 외 '+((d.items||[]).length-10)+'건':'')
          : '카탈로그 대조 완료 — 새로 매칭된 코드가 없습니다. (미완료 '+(d.checked||0)+'건 대조)')
        +(amb.length?'<div style="margin-top:4px;color:#9a6512">⚠ 후보가 여러 제품이라 자동 완료하지 않은 '+amb.length+'건: '+amb.slice(0,8).map(a=>esc(a.input_code||'')+' → '+(a.candidates||[]).map(esc).join(' / ')).join(' · ')+(amb.length>8?' 외 '+(amb.length-8)+'건':'')+' — 제품개발요청 화면에서 수동 개발완료</div>':'');
      await loadDev();
    }catch(e){ devMsg='<span style="color:var(--expense)">카탈로그 대조 실패: '+esc(e.message)+'</span>'; renderDev(); }
  }
  async function devMakeOffer(customerId,btn){
    const g=devGroups().find(x=>Number(x.customer_id)===customerId); if(!g) return;
    const rows=g.rows.filter(r=>r.offer_state==='offerable');
    if(!confirm((g.name||'')+' 고객에게 개발완료 오퍼시트를 만듭니다.\n\n'+rows.map(r=>'• '+(r.input_code||'')+' → '+(r.result_ctr_code||'')+'  (요청 '+(r.requested_qty==null?'-':r.requested_qty)+', 재고 '+(r.result_stock_qty==null?0:r.result_stock_qty)+')').join('\n')
      +'\n\n제안수량 = min(요청수량, 현재고) · 단가 = 정가 × (1 − 고객할인). 만든 뒤 부족분 화면에서 PDF·WhatsApp 으로 발송합니다.')) return;
    if(btn){ btn.disabled=true; btn.textContent='만드는 중…'; }
    try{
      const res=await fetch(session.api+'/api/dev-requests/offer-sheets',{method:'POST',headers:{'Content-Type':'application/json',...auth()},body:JSON.stringify({customer_id:customerId,dev_request_ids:rows.map(r=>r.id)})});
      const d=await res.json();
      if(!res.ok||d.error){ alert('오퍼시트 생성 실패: '+(d.note||d.error||res.status)); await loadDev(); return; }
      const c=(d.customers||[])[0];
      if(d.sheets>0&&c){
        if(confirm('✅ 오퍼시트 '+(c.offer_no||'')+' 생성 ('+c.items+'개 라인 · Total $'+money(c.total_mxn)+').\n\n지금 열어서 PDF·WhatsApp 으로 보낼까요?')){ location.href='refatrix-shortage.html#os='+c.offer_sheet_id; return; }
      } else {
        alert('새로 만들 오퍼가 없습니다.\n(재고가 0이 되었거나, 이미 살아있는 오퍼시트에 담겨 있습니다)');
      }
      await loadDev();
    }catch(e){ alert('서버에 연결할 수 없습니다.'); }
  }
  // 개발 필요 목록 엑셀 다운로드 (2026-10-12) — 화면을 볼 수 있는 사용자 누구나. 고객별 보기면 고객 순으로 정렬.
  function downloadDevXlsx(){
    if(!window.XLSX){ alert('엑셀 라이브러리를 불러오지 못했습니다. 새로고침(Ctrl+Shift+R) 후 다시 시도하세요.'); return; }
    if(!devItems.length){ alert('다운로드할 항목이 없습니다.'); return; }
    const num=(v)=> v==null||v===''?'':Number(v);
    const head=['접수월','고객','경쟁사코드','개발결과 CTR코드','CTR 제품명','현재고','오퍼 상태','오퍼시트','SYD코드','수량','상태','카테고리','메이커','차종','연식',
      '① 접수일','② 검토완료일','③ 공장요청일','④ 개발완료일','접수→검토(일)','검토→공장(일)','공장→완료(일)','전체 소요(일)','오더 메모','검토 메모'];
    let list=devItems.slice();
    if(devView==='cust'&&devCust) list=list.filter(r=>(r.customer_id?String(r.customer_id):'none')===devCust);
    if(devView==='cust') list.sort((a,b)=>String(a.customer_name||'~').localeCompare(String(b.customer_name||'~'))||String(b.requested_at).localeCompare(String(a.requested_at)));
    const aoa=[head];
    list.forEach(r=>{ const v=splitApp(r.review_app);
      aoa.push([ String(r.requested_at||'').slice(0,7), r.customer_name||'', r.input_code||'', r.result_ctr_code||'', r.result_product_name||'',
        num(r.result_stock_qty), r.offer_state?(OFFER_LBL[r.offer_state]||r.offer_state):'', r.offer_sheet?(r.offer_sheet.offer_no||''):'',
        r.review_syd_code||'', num(r.requested_qty), stLbl[r.status]||r.status||'', r.category||'',
        r.review_maker||v.maker, r.review_model||v.model, r.review_year||v.year,
        r.requested_at||'', r.reviewed_at||'', r.factory_requested_at||'', r.developed_at||'',
        num(r.dur_review), num(r.dur_factory), num(r.dur_develop), num(r.dur_total), r.order_memo||'', r.review_memo||'' ]);
    });
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=[8,26,16,16,30,8,20,18,14,7,9,12,12,14,12,11,11,11,11,9,9,9,9,30,30].map(w=>({wch:w}));
    ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:head.length-1}})};
    const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Desarrollo');
    const ms=months.slice().sort();
    const tag=devAll?'todo':(!ms.length?'':(ms.length===1?ms[0]:ms[0]+'_'+ms[ms.length-1]+'_'+ms.length+'m'));
    const ctag=(devView==='cust'&&devCust&&list.length)?('_'+String(list[0].customer_code||list[0].customer_name||'cliente').replace(/[^0-9A-Za-z_-]+/g,'_').slice(0,30)):'';
    XLSX.writeFile(wb,'desarrollo_'+tag.replace(/[^0-9A-Za-z_-]/g,'')+ctag+'_'+mxHoy()+'.xlsx');
  }

  $('go').addEventListener('click',login);
  $('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login();});
  (function(){ const ps=portalSession(); if(ps&&ps.token){ $('api').value=ps.api||$('api').value; $('lid').value='-';$('pin').value='-'; setTimeout(()=>login(),30); } })();
</script>
