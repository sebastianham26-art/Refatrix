<script>
(function(){
  function sess(){
    try{ var r=sessionStorage.getItem('refatrix_session'); if(r){ var o=JSON.parse(r); if(o&&o.token) return o; } }catch(e){}
    try{ var h=location.hash.slice(1); if(h){ var p=new URLSearchParams(h); var t=p.get('token'); if(t) return {token:t,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')}; } }catch(e){}
    return null;
  }
  var BUILD='20260817e';
  var S=sess(); var API=(S&&S.api)||''; var AUTH=S?{Authorization:'Bearer '+S.token}:{};
  try{ console.log('[refatrix-inbound] build '+BUILD+' user="'+((S&&S.user&&S.user.name)||'')+'" role='+((S&&S.user&&S.user.role)||'')); }catch(e){}
  var LANG=(function(){ try{ var l=localStorage.getItem('wh_lang'); if(l==='es'||l==='ko') return l; }catch(e){} return (S&&S.user&&S.user.role==='warehouse')?'es':'ko'; })();
  function L(ko,es){ return LANG==='es'?es:ko; }
  var isDir=(S&&S.user&&S.user.role==='director');
  var $=function(id){return document.getElementById(id);};
  var fmt=function(n){return Number(n||0).toLocaleString(LANG==='es'?'es-MX':'ko-KR');};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var toastT; function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},1900);}
  /* ===== 스캐너 입력 보정 =====
     스캐너는 US 자판 키코드를 흘려보내는데 현장 PC 자판은 스페인어(라틴아메리카)라
     바코드의 `-` 가 `'` 로 들어온다. 변종 따옴표(’ ‘ ´ ` ʼ)까지 모두 `-` 로 되돌린다.
     그래도 남는 자판 불일치(`/` → `-` 등)에 대비해, 최종 매칭은 구분자를 전부 무시하는
     bare() 비교를 폴백으로 둔다. A'01'03 = A-01-03 = A/01/03 = A0103 모두 같은 코드로 본다. */
  var QUOTE_RE=/['‘’´`ʼ]/g;
  function normScan(v){
    return String(v||'')
      .replace(/[\u0000-\u001f\u007f]/g,'')   // 스캐너 접미사(CR/LF/TAB) 잔여 제거
      .replace(QUOTE_RE,'-')                  // ' ’ ‘ ´ ` ʼ → -
      .replace(/\s+/g,'')                     // 공백 제거(코드에 공백 없음)
      .toUpperCase();
  }
  function bare(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }  // 구분자 무시 비교키
  function bareEq(a,b){ var x=bare(a); return !!x && x===bare(b); }
  // 코드에 해당하는 패킹리스트 "라인들" — 같은 SKU 가 여러 라인(카톤 묶음)일 수 있다(2026-08-17 라인별 저장).
  // 정확히 일치가 하나라도 있으면 그 집합, 없으면 구분자 무시 매칭 집합.
  function linesFor(items,code){
    if(!items||!items.length||!code) return [];
    var ex=items.filter(function(i){return i.code===code;});
    if(ex.length) return ex;
    var b=bare(code); if(!b) return [];
    return items.filter(function(i){return bare(i.code)===b;});
  }
  function findItem(items,code){ return linesFor(items,code)[0]||null; }
  // 스캔 1건을 배정할 라인 고르기 — ① 여유가 있는 라인 중 소입수량(qty÷cartons)이 라벨과 같은 라인
  //   ② 아니면 여유 있는 첫 라인(파일 순서) ③ 전부 찼으면 첫 라인(초과 경고용, full 표시)
  function pickLine(items,code,lblQty,roomFn){
    var ls=linesFor(items,code);
    if(!ls.length) return null;

  /* ===== 카톤 라벨 파서 =====
     현장 카톤 라벨(Code-128)은 `CTR-<제품번호>-<카톤 소입수량>` 형태다.

     라벨 변형(접두어 없음 / 수량 없음 / 제품번호에 하이픈)에 견디도록 후보를 순서대로 만들고,
     패킹리스트에 실제로 존재하는 제품번호를 고른다. 아무것도 안 맞으면 1순위 해석을 그대로
     돌려줘서 실패 메시지에 "무엇으로 읽었는지"가 보이게 한다. */
  var LABEL_PREFIX=/^(CTR|SYD)-?(.+)$/;        // 접두어(항상 CTR-, SYD 는 방어적)
  var LABEL_QTY=/^(.*[A-Z0-9])-(\d{1,6})$/;    // 뒤쪽 -숫자 = 소입수량
  function findAnyItem(code){
    if(!code||!DETAIL||!DETAIL.pallets) return null;
    for(var i=0;i<DETAIL.pallets.length;i++){ var it=findItem(DETAIL.pallets[i].items,code); if(it) return it; }

  function parseLabel(v){

    if(!norm) return {raw:'',norm:'',code:'',qty:0,prefix:'',matched:false};
    m=norm.match(LABEL_PREFIX); if(m){ pre=m[1]; body=m[2]; }
    m=body.match(LABEL_QTY); if(m) cands.push({code:m[1],qty:+m[2],prefix:pre});   // ① 접두어 제거 + 수량 분리
    cands.push({code:body,qty:0,prefix:pre});                                      // ② 접두어만 제거
    if(pre){
      m=norm.match(LABEL_QTY); if(m) cands.push({code:m[1],qty:+m[2],prefix:''});   // ③ 접두어를 코드로 취급

    }
    for(var i=0;i<cands.length;i++){

      if(it){ return {raw:String(v==null?'':v),norm:norm,code:it.code,qty:cands[i].qty,prefix:cands[i].prefix,matched:true}; }

  function parseWorkbook(wb){
    var name=wb.SheetNames.filter(function(n){return /packing/i.test(n)&&/detail/i.test(n);})[0]

    if(!name) throw new Error(L("'packing list_details' 시트를 찾지 못했습니다","No se encontró la hoja 'packing list_details'"));

    var hi=-1;
    for(var i=0;i<Math.min(rows.length,15);i++){ var t=(rows[i]||[]).map(function(c){return String(c==null?'':c).replace(/\s+/g,' ').toUpperCase();});

    var H=(rows[hi]||[]).map(function(c){return String(c==null?'':c).replace(/\s+/g,' ').trim().toUpperCase();});
    function col(){ var ns=[].slice.call(arguments); for(var k=0;k<ns.length;k++){var i=H.indexOf(ns[k]);if(i>=0)return i;} for(var k2=0;k2<ns.length;k2++){for(var j=0;j<H.length;j++)if(H[j].indexOf(ns[k2])>=0)return j;} return -1; }
    var cOrd=col('ORDER NO','ORDER'),cPl=col('PL NO'),cFr=col('FROM'),cTo=col('TO'),cSku=col('CTR NO'),cDesc=col('DESCRIPTION'),cQty=col('TOTAL QTY','QTY');
    if([cOrd,cPl,cFr,cTo,cSku,cQty].some(function(x){return x<0;})) throw new Error(L('필수 열이 없습니다(ORDER NO·PL NO·FROM·TO·CTR NO·QTY)','Faltan columnas requeridas'));
    // 인보이스 번호 추출(2026-07-31 강화): 같은 셀("INVOICE NO: X") · 오른쪽 셀 · 아랫줄 셀까지 인식.
    //   라벨 단어(NO/DATE 등)만 있는 셀은 값으로 안 봄. 못 찾으면 미리보기에서 직접 입력.
    var inv=null;
    var SEP=/^(?:NO|N[Oº°]\.?|NUM\w*|#|[-:.：]+)$/i;      // 라벨 뒤 구분어("NO" 등) — 건너뜀
    // 다른 라벨 문구 = 숫자가 없고 라벨 단어를 포함(순수 텍스트) — 숫자가 섞인 값(CTR-2607-88 등)은 라벨로 안 봄
    function isLbl(t){ return !/\d/.test(t)&&/(?:INVOICE|FACTURA|COMMERCIAL|PACKING|LIST|DATE|FECHA|ORDER|TOTAL|QTY|DESCRIPTION)/i.test(t); }
    function invVal(s){
      if(s==null) return null;
      var t=String(s).trim();

      if(/\s/.test(t)) return null;                       // 공백 포함 문구는 번호로 안 봄
      if(!/\d/.test(t)&&t.length<4) return null;          // 너무 짧은 비숫자

    }
    outer:
    for(var r0=0;r0<hi;r0++){ var rr=rows[r0]||[]; var rrN=(r0+1<hi)?(rows[r0+1]||[]):[];
      for(var j=0;j<rr.length;j++){
        var cell=String(rr[j]==null?'':rr[j]);
        if(!/INVOICE|FACTURA|REF(?:ERENCE|ERENCIA)?\b/i.test(cell)) continue;
        // ① 같은 셀 안: "INVOICE NO: ABC-123" / "COMMERCIAL INVOICE CI2026015" / "REF: D2607001"
        var same=invVal(cell.replace(/^[\s\S]*?(?:INVOICE|FACTURA|REF(?:ERENCE|ERENCIA)?)\s*(?:NO|N[Oº°]|NUM\w*|#)?\.?\s*[:：\-]?\s*/i,''));

        // ② 같은 행 오른쪽 셀들 — 구분어("NO")는 건너뛰고, 다른 라벨(DATE 등)을 만나면 중단
        for(var k=j+1;k<rr.length;k++){
          var c2=rr[k]; if(c2==null||String(c2).trim()==='') continue;
          var t2=String(c2).trim();
          if(SEP.test(t2)) continue;
          if(isLbl(t2)) break;                             // 다음 라벨 구역 — 그 뒤 값은 남의 값
          var v=invVal(t2); if(v){ inv=v; break outer; } break;
        }
        // ③ 아랫줄 같은 열·오른쪽 열 (헤더행 전까지만)
        var b1=invVal(rrN[j]), b2=invVal(rrN[j+1]);
        if(b1||b2){ inv=b1||b2; break outer; }
      }
    }
    // ④ 폴백: 라벨이 아예 없는 양식 — 헤더 위 영역에서 "문서번호처럼 생긴" 단독 토큰을 찾는다.
    //    영문 1~4자로 시작 + 숫자 총 4자리 이상 (예: D26-81319563 · D2607001 · CI2026015). D+숫자(디스패치 레퍼런스) 우선.
    if(!inv){
      var cand=[];
      for(var rf=0;rf<hi;rf++){ var rrF=rows[rf]||[];
        for(var jf=0;jf<rrF.length;jf++){
          var tf=rrF[jf]==null?'':String(rrF[jf]).trim();
          if(tf===''||/\s/.test(tf)||SEP.test(tf)||isLbl(tf)) continue;
          if(/^[A-Za-z]{1,4}\d[A-Za-z0-9\-._\/]{3,}$/.test(tf)&&(tf.match(/\d/g)||[]).length>=4) cand.push(tf.slice(0,60));
        }
      }
      inv=null;
      for(var ci=0;ci<cand.length;ci++){ if(/^D\d/i.test(cand[ci])){ inv=cand[ci]; break; } } // D26… 우선
      if(!inv&&cand.length===1) inv=cand[0];              // 후보가 하나뿐일 때만 채택(오인 방지)
    }
    // ▼ 수량 누락 방지(2026-07-31):
    //   ① ORDER NO·PL NO 병합셀(빈칸) → 직전 값으로 채움(단, CTR NO·수량이 있는 데이터 행만)
    //   ② FROM/TO(카톤번호) 없는 행(혼적 카톤 병합셀·낱개 등) → 제외하지 않고 카톤 0 으로 포함
    //   ③ 파일 수량 합계(fileQty)와 등재 합계를 함께 반환 → 미리보기에서 대사(對査) 표시
    var out=[]; var noCarton=0, noCartonQ=0, dropped=0, droppedQ=0, fileQty=0;
    var lastOrd=null, lastPl=null;
    for(var i2=hi+1;i2<rows.length;i2++){ var r=rows[i2]||[];
      var code=String(r[cSku]==null?'':r[cSku]).trim();
      var qty=Number(r[cQty]||0);
      var o=r[cOrd]; var oS=(o==null?'':String(o).trim());
      var isData=(code!==''&&qty>0);
      if(oS!==''){ lastOrd=oS; if(r[cPl]!=null&&String(r[cPl]).trim()!=='') lastPl=Number(r[cPl]); }
      else if(isData&&lastOrd!=null){ oS=lastOrd; } // 병합셀 이어받기
      if(!isData){ if(qty>0&&oS===''){ /* TOTAL 행 등 — 합계에 미포함 */ } continue; }
      fileQty+=qty;
      if(oS===''){ dropped++; droppedQ+=qty; continue; }   // ORDER NO 를 끝내 못 찾은 행
      var pl=(r[cPl]!=null&&String(r[cPl]).trim()!=='')?Number(r[cPl]):(lastPl||0);
      var fr=r[cFr],to=r[cTo];
      var cartons=(fr==null||to==null)?0:Math.max(0,Number(to)-Number(fr)+1);
      if(cartons===0){ noCarton++; noCartonQ+=qty; }       // 카톤번호 없음 — 수량은 포함, 스캔 대상 아님
      out.push({order_no:oS,pl_no:pl,code:code,cartons:cartons,qty:qty,desc:String(r[cDesc]||'').trim(),
        box_from:(fr==null?null:Number(fr)),box_to:(to==null?null:Number(to))});   // 라인별 저장(합산 안 함) — 카톤 범위 보존
    }
    return {rows:out,invoice_no:inv,skipped:noCarton,skipQ:noCartonQ,dropped:dropped,droppedQ:droppedQ,fileQty:fileQty};
  }
  function bufToB64(buf){ // ArrayBuffer → base64 (청크 처리로 대용량 안전)
    var u8=new Uint8Array(buf), s='', CH=32768;
    for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
    return btoa(s);
  }
  var FILE_MAX=8*1024*1024; // 원본 8MB 까지 첨부(base64 ≈10.7MB, 서버 한도 12MB)
  function readFile(f){
    var r=new FileReader();
    r.onload=function(e){ try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var res=parseWorkbook(wb);
      // 원본 파일 보존 → 선적 생성 시 함께 저장(ERP에서 재다운로드용)
      if(f.size<=FILE_MAX){
        var mime=f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        res._file={name:f.name,size:f.size,data:'data:'+mime+';base64,'+bufToB64(e.target.result)};
      } else { res._file=null; res._fileTooBig=true; }
      doPreview(res,f.name);
    }catch(err){ $('pout').innerHTML='<div class="note" style="border-left-color:var(--red);background:#FDF3F1;color:var(--red)"><b>'+L('읽지 못했습니다','No se pudo leer')+'</b> — '+esc(err.message)+'</div>'; } };
    r.readAsArrayBuffer(f);
  }

  function createShip(){
    var eta=$('eta').value;
    if(!eta){ toast(L('도착 예정일(ETA)을 입력하세요','Ingrese la fecha estimada (ETA)')); $('eta').focus(); return; }
    $('btnCreate').disabled=true;
    var invEl=$('invNo'); var invNo=(invEl&&invEl.value.trim())||parsed.invoice_no||null;
    var body={rows:parsed.rows,invoice_no:invNo,eta:eta};
    if(parsed._file){ body.file_name=parsed._file.name; body.file_data=parsed._file.data; }
    api('/api/inbound',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(o){
      if(!o.ok||o.body.error){ toast(L('생성 실패','Error')+': '+(o.body.error||o.status)); $('btnCreate').disabled=false; return; }
      toast(L('✔ 선적 생성 — 입고예정 재고가 판매팀에 반영됩니다','✔ Creado — stock entrante visible para ventas'));
      openShip(o.body.id);
    });
  }

      scanReset(); putReset(); WORK_PID=null; WORK_STEP=null;
      pollSig=sigDetail(o.body);
      renderDetail();

  /* ===== 라인 재분할(2026-08-17) — 합산 저장된 기존 선적을 원본 파일 기준 라인별로 교체 =====
     노출 조건: 마감 전 + box 범위가 전무(=라인별 저장 이전 등재) + 검수/적치 스캔 0. 서버도 같은 가드를 강제한다. */
  function needRelines(){
    if(!DETAIL||!DETAIL.pallets||!DETAIL.pallets.length) return false;
    if(DETAIL.shipment.status==='closed') return false;
    var hasItem=false, hasBox=false, touched=false;
    DETAIL.pallets.forEach(function(p){
      if(p.checked_at) touched=true;
      (p.items||[]).forEach(function(i){ hasItem=true;
        if(i.box_from!=null) hasBox=true;
        if((i.scanned_cartons||0)>0||(i.put_cartons||0)>0) touched=true; });
    });
    return hasItem && !hasBox && !touched;
  }
  function reSplitSend(rows){
    api('/api/inbound/'+SHIP+'/relines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:rows})}).then(function(o){
      if(!o.ok||o.body.error){
        var msg={already_scanned:L('검수·적치가 이미 진행되어 재분할할 수 없습니다','Ya hay escaneos — no se puede re-dividir'),
                 file_mismatch:L('파일이 이 선적과 다릅니다(팔렛·수량 불일치)','El archivo no coincide con este embarque'),
                 bad_state:L('마감/취소된 선적입니다','Embarque cerrado/cancelado')}[o.body.error]||o.body.error||o.status;
        toast('⚠ '+msg); return;
      }
      toast('✔ '+L('라인 재분할 완료','Líneas re-divididas')+' — '+o.body.before_lines+' → '+o.body.lines+L('라인',' líneas'));
      openShip(SHIP);
    });
  }
  function reSplitParse(buf){
    try{
      var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      var res=parseWorkbook(wb);
      if(!res.rows||!res.rows.length){ toast('⚠ '+L('파일에서 라인을 읽지 못했습니다','No se pudo leer el archivo')); return; }
      reSplitSend(res.rows);
    }catch(err){ toast('⚠ '+L('파일 읽기 실패','Error al leer')+': '+err.message); }
  }
  function reSplitLines(files){
    if(!confirm(L('원본 패킹리스트를 다시 읽어 같은 SKU 라인을 합산 없이 라인별로 다시 등재합니다.\n하차 상태·ETA·파일은 그대로 유지됩니다. 진행할까요?',
      'Se volverá a leer el packing list para registrar línea por línea. ¿Continuar?'))) return;
    var xf=(files||[]).filter(function(f){ return /\.xlsx?$/i.test(f.file_name||''); })[0];
    if(xf){   // 첨부된 원본 엑셀을 서버에서 받아 재파싱
      api('/api/inbound/files/'+xf.id).then(function(o){
        if(!o.ok||!o.body.file_data){ toast('⚠ '+L('원본 파일을 받지 못했습니다 — 파일을 직접 선택하세요','No se pudo descargar — elija el archivo')); reSplitPick(); return; }
        try{
          var b64=String(o.body.file_data).split(',')[1]||'';
          var bin=atob(b64), u8=new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
          reSplitParse(u8.buffer);
        }catch(e){ toast('⚠ '+L('파일 해석 실패','Error')); }
      });
    } else reSplitPick();   // 원본 미보관(8MB 초과 등) → 직접 선택
  }
  function reSplitPick(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
    inp.addEventListener('change',function(){
      var f=inp.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(e){ reSplitParse(e.target.result); };
      r.readAsArrayBuffer(f);
    });
    inp.click();
  }

  function dlShipFile(fid){

  function attachShipFile(){

      var f=inp.files[0]; if(!f) return;

      var r=new FileReader();

        });
      };
      r.readAsArrayBuffer(f);
    });
    inp.click();
  }
  function refreshDetail(cb){ api('/api/inbound/'+SHIP).then(function(o){

  function palStats(){

      checked:p.filter(function(x){return x.status==='checked'||x.status==='done';}).length,
      done:p.filter(function(x){return x.status==='done';}).length };
  }

      +(s.status!=='closed'?' <button class="btn ghost sm" id="btnInvEdit" title="'+L('인보이스 번호 입력·수정','Editar factura')+'">✎</button>':'')+'</h2>'

    $('app').innerHTML=html;

        openShip(SHIP);

    document.querySelectorAll('.step').forEach(function(b){ b.addEventListener('click',function(){
      var nx=b.dataset.s;
      if(STEP==='put'&&nx!=='put'&&putPending()){ putFlush(function(){ STEP=nx; clearWorking(); putReset(); renderStep(); }); return; }
      if(STEP!==nx) clearWorking();
      STEP=nx; if(STEP==='check')scanReset(); if(STEP==='put')putReset(); renderStep(); }); });
    renderStep();
  }
  function stepBtn(k,t,m){ return '<button class="step'+(STEP===k?' on':'')+'" data-s="'+k+'"><div class="t">'+t+'</div><div class="m">'+m+'</div></button>'; }
  function renderStep(){
    document.querySelectorAll('.step').forEach(function(b){ b.classList.toggle('on',b.dataset.s===STEP); });
    if(STEP==='unload') renderUnload();
    else if(STEP==='check') renderCheck();
    else if(STEP==='put') renderPut();
    else renderClose();
  }
  /* ===== 점유 표시(소프트 락) — 지금 누가 이 팔렛을 잡고 있는지 =====
     막지 않는다. 같은 팔렛을 굳이 잡아도 증분 저장으로 합산된다. */
  var WORK_STEP_LBL={unload:['하차','Descarga'],check:['검수','Verificación'],put:['적치','Acomodo']};
  function workChip(p,big){
    if(!p||!p.working||p.working_is_me) return '';
    var who=p.working_by_name||L('다른 작업자','otro operador');
    var st=WORK_STEP_LBL[p.working_step]; st=st?L(st[0],st[1]):'';
    if(big) return '<div class="bigwarn" style="background:#F7E9CD;border-color:var(--gold);color:#8A6420">🧑 <b>'
      +esc(who)+'</b> '+L('님이 이 팔렛을','está trabajando en este pallet')+(st?' '+st:'')+L(' 작업 중입니다 — 같이 하면 스캔은 합산됩니다.',' — los escaneos se suman.')+'</div>';
    return '<span class="wchip">🧑 '+esc(who)+(st?' '+st:'')+'</span>';
  }
  function pingWorking(pid,step){
    if(!pid) return;
    WORK_PID=pid; WORK_STEP=step||null;
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/working',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({step:step||null})});
  }
  function clearWorking(){
    var pid=WORK_PID; WORK_PID=null; WORK_STEP=null;
    if(pid) api('/api/inbound/'+SHIP+'/pallets/'+pid+'/working/clear',{method:'POST'});
  }

  var PAL_LBL={wait:['대기','En espera'],unloaded:['하차됨','Descargado'],checking:['적치중','Acomodando'],checked:['검수됨','Verificado'],done:['완료','Listo']};
  function palLbl(s){ var t=PAL_LBL[s]; return t?L(t[0],t[1]):s; }
  /* PO번호 표기 — 고정 접두(예 100RA)는 작게 붙이고, RA 뒤의 실제 PO번호를 크게·자간 넓게.
     예) 100RA1100 → [100RA]작게 + [1100]크게.  패턴이 안 맞으면 전체를 자간만 넓혀 표시. */
  function poParts(v){
    var t=String(v==null?'':v).trim();
    var m=t.match(/^(\d*[A-Za-z]{2,})[\s\-_.]*(\d[\dA-Za-z\-_.\/]*)$/);
    if(m&&m[2]) return {pfx:m[1],po:m[2]};
    return {pfx:'',po:t};
  }
  function poHtml(v){
    var p=poParts(v);
    if(!p.po) return '<span class="po plain">'+esc(L('번호 없음','Sin número'))+'</span>';
    return (p.pfx?'<span class="pfx">'+esc(p.pfx)+'</span>':'')
      +'<span class="po'+(p.pfx?'':' plain')+'">'+esc(p.po)+'</span>';
  }
  // 표 안(마감 탭)에서 쓰는 축소판 — 같은 규칙, 작은 크기
  function poHtmlSm(v){
    var p=poParts(v);
    if(!p.po) return '<span style="color:var(--muted)">—</span>';
    return (p.pfx?'<span style="color:var(--muted);font-size:11px">'+esc(p.pfx)+'</span> ':'')
      +'<b style="font-size:14px;letter-spacing:.1em">'+esc(p.po)+'</b>';
  }
  // 하차만 된 팔렛(스캔·적치 기록 없음)만 되돌릴 수 있다 — 서버 판정과 동일 기준
  function canUndo(p){
    if(p.status!=='unloaded') return false;
    return p.items.every(function(i){ return !(i.scanned_cartons||0) && !(i.put_cartons||0); });
  }
  // ORDER NO(인보이스 번호)로 팔렛을 묶는다 — 긴 번호는 머리글에 한 번만, 카드에는 팔렛 번호만
  function palGroups(){
    var map={}, keys=[];
    DETAIL.pallets.forEach(function(p){
      var k=String(p.order_no==null?'':p.order_no);
      if(!map[k]){ map[k]={key:k,pals:[]}; keys.push(k); }
      map[k].pals.push(p);
    });
    return keys.map(function(k){
      var G=map[k];
      G.pals.sort(function(a,b){ return (a.pl_no||0)-(b.pl_no||0); });
      G.N=G.pals.length;
      G.unloaded=G.pals.filter(function(p){return p.status!=='wait';}).length;
      G.cartons=G.pals.reduce(function(a,p){return a+(p.cartons_expected||0);},0);
      G.qty=G.pals.reduce(function(a,p){return a+(p.qty_expected||0);},0);
      G.wait=G.pals.filter(function(p){return p.status==='wait';});
      G.undoable=G.pals.filter(canUndo);
      return G;
    });
  }
  function palCard(p,withUndo){
    var done=p.items.reduce(function(a,i){return a+(i.scanned_cartons||0);},0);
    var u=(withUndo&&canUndo(p));
    return '<div class="pal st-'+p.status+((u&&undoSel[p.id])?' sel':'')+'" data-pid="'+p.id+'" role="button" tabindex="0">'
      +(withUndo?('<div class="ptop">'
        +(u?'<input type="checkbox" class="pck" data-ck="'+p.id+'"'+(undoSel[p.id]?' checked':'')+' title="'+L('취소할 팔렛 선택','Seleccionar para cancelar')+'">':'<span></span>')
        +(u?'<button class="undo" data-undo="'+p.id+'" title="'+L('이 팔렛만 하차 취소','Cancelar solo este pallet')+'">↩</button>':'<span></span>')
        +'</div>'):'')
      +'<div class="o">'+L('팔렛','Pallet')+'</div><div class="pn">'+p.pl_no+'</div>'
      +'<div class="d">'+palLbl(p.status)+' · '+L('카톤','Cajas')+' '+p.cartons_expected+' · SKU '+p.items.length+'</div>'
      +(workChip(p)||'')
      +'<div class="bar"><i style="width:'+(p.cartons_expected?Math.round(done/p.cartons_expected*100):0)+'%"></i></div></div>';
  }
  // 팔렛 목록에 POST 를 순차 호출(동시 호출 시 선적 상태 경합 방지)
  function runSeq(list,mk,done){
    var i=0, fail=0, lastErr=null;
    (function next(){
      if(i>=list.length){ done(fail,lastErr); return; }
      api(mk(list[i]),{method:'POST'}).then(function(o){
        if(!o.ok||o.body.error){ fail++; lastErr=o.body.error||o.status; }
        i++; next();
      });
    })();
  }

  /* ---- 하차 ---- */
  function selPallets(){ return DETAIL.pallets.filter(function(p){ return undoSel[p.id]&&canUndo(p); }); }
  function syncSel(){
    var n=selPallets().length;
    var b=$('btnUndoSel');
    if(b){ b.disabled=!n; b.textContent='↩ '+L('선택 취소','Cancelar selección')+' ('+n+')'; }
    document.querySelectorAll('#pg .pal').forEach(function(el){ el.classList.toggle('sel',!!undoSel[el.dataset.pid]); });
    document.querySelectorAll('#pg [data-gall]').forEach(function(cb){
      var G=CURGROUPS[+cb.dataset.gall]; if(!G) return;
      var t=G.undoable.length, s=G.undoable.filter(function(p){return undoSel[p.id];}).length;
      cb.checked=(t>0&&s===t); cb.indeterminate=(s>0&&s<t);
    });
  }
  function renderUnload(){
    var b=$('stepbody'), st=palStats(), groups=palGroups();
    CURGROUPS=groups;
    var locked=(DETAIL.shipment.status==='closed');
    var anyWait=DETAIL.pallets.some(function(p){return p.status==='wait';});
    var anyUndo=DETAIL.pallets.some(canUndo);
    // 더 이상 되돌릴 수 없게 된 선택은 정리(검수 시작·이미 취소됨 등)
    Object.keys(undoSel).forEach(function(k){
      var p=DETAIL.pallets.filter(function(x){return String(x.id)===String(k);})[0];
      if(!p||!canUndo(p)) delete undoSel[k];
    });
    b.innerHTML='<p class="hint">'+L('컨테이너에서 팔렛만 빠르게 내립니다. 번호·라벨 확인 불필요. 잘못 눌렀으면 ↩ 로 취소하거나, 체크해서 골라 취소하세요.','Solo baje los pallets. Si se equivocó, use ↩ o marque los pallets y cancele los seleccionados.')+'</p>'
      +'<div class="row" style="margin-bottom:10px">'
      +((!locked&&anyWait)?'<button class="btn o" id="btnUnAll">'+L('전체 하차','Descargar todo')+'</button>':'')
      +((!locked&&anyUndo)?'<button class="btn r" id="btnUndoSel" disabled>↩ '+L('선택 취소','Cancelar selección')+' (0)</button>':'')
      +((!locked&&anyUndo)?'<button class="btn ghost" id="btnUnAllCancel">↩ '+L('전체 하차 취소','Cancelar toda la descarga')+'</button>':'')
      +'<span class="hint" style="margin:0">'+L('인보이스','Factura')+' '+groups.length+' · '+L('팔렛','Pallets')+' '+st.unloaded+'/'+st.N+' '+L('하차','descargados')+'</span></div>'
      +'<div id="pg"></div>';
    $('pg').innerHTML=groups.map(function(G,gi){
      return '<div class="pgrp">'
        +'<div class="gh"><div style="min-width:0">'
        +'<div class="gn">'+poHtml(G.key)+'</div>'
        +'<div class="gd">'+L('팔렛','Pallets')+' '+G.unloaded+'/'+G.N+' · '+L('카톤','Cajas')+' '+fmt(G.cartons)+' · '+fmt(G.qty)+' EA</div></div>'
        +'<div class="ga">'
        +((!locked&&G.undoable.length)?'<label class="gsel"><input type="checkbox" data-gall="'+gi+'">'+L('선택','Sel.')+'</label>':'')
        +((!locked&&G.wait.length)?'<button class="btn o sm" data-gun="'+gi+'">'+L('하차','Descargar')+' '+G.wait.length+'</button>':'')
        +((!locked&&G.undoable.length)?'<button class="btn ghost sm" data-gundo="'+gi+'">↩ '+L('취소','Cancelar')+' '+G.undoable.length+'</button>':'')
        +'</div></div>'
        +'<div class="gb"><div class="pgrid">'+G.pals.map(function(p){ return palCard(p,!locked); }).join('')+'</div></div></div>';
    }).join('');
    document.querySelectorAll('#pg .pal').forEach(function(el){
      el.addEventListener('click',function(ev){
        if(ev.target&&ev.target.closest&&(ev.target.closest('.undo')||ev.target.closest('.pck'))) return;
        unloadOne(+el.dataset.pid);
      });
      el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); unloadOne(+el.dataset.pid); } });
    });
    document.querySelectorAll('#pg [data-undo]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); undoOne(+el.dataset.undo); });
    });
    document.querySelectorAll('#pg [data-ck]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.stopPropagation(); });
      el.addEventListener('change',function(){ var id=el.dataset.ck; if(el.checked) undoSel[id]=true; else delete undoSel[id]; syncSel(); });
    });
    document.querySelectorAll('#pg [data-gall]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.stopPropagation(); });
      el.addEventListener('change',function(){
        var G=CURGROUPS[+el.dataset.gall]; if(!G) return;
        G.undoable.forEach(function(p){ if(el.checked) undoSel[p.id]=true; else delete undoSel[p.id]; });
        document.querySelectorAll('#pg [data-ck]').forEach(function(cb){ cb.checked=!!undoSel[cb.dataset.ck]; });
        syncSel();
      });
    });
    document.querySelectorAll('#pg [data-gun]').forEach(function(el){
      el.addEventListener('click',function(){ unloadMany(groups[+el.dataset.gun].wait, groups[+el.dataset.gun].key); });
    });
    document.querySelectorAll('#pg [data-gundo]').forEach(function(el){
      el.addEventListener('click',function(){ undoMany(groups[+el.dataset.gundo].undoable, groups[+el.dataset.gundo].key); });
    });
    var ba=$('btnUnAll');
    if(ba) ba.addEventListener('click',function(){ unloadMany(DETAIL.pallets.filter(function(p){return p.status==='wait';}),null); });
    var bs=$('btnUndoSel');
    if(bs) bs.addEventListener('click',function(){ undoMany(selPallets(),L('선택한 팔렛','Pallets seleccionados')); });
    var bc=$('btnUnAllCancel');
    if(bc) bc.addEventListener('click',function(){ undoMany(DETAIL.pallets.filter(canUndo),null); });
    syncSel();
  }
  function unloadOne(pid){
    var p=DETAIL.pallets.filter(function(x){return x.id===pid;})[0];
    if(p&&p.status!=='wait'){ STEP='check'; scanReset(); renderDetail(); return; }
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/unload',{method:'POST'}).then(function(o){ if(o.ok){ toast(L('하차','Descargado')); refreshDetail(); } });
  }
  function unloadMany(list,label){
    if(!list||!list.length){ toast(L('전부 하차됨','Todo descargado')); return; }
    runSeq(list,function(p){ return '/api/inbound/'+SHIP+'/pallets/'+p.id+'/unload'; },function(fail){
      refreshDetail();
      toast(fail?L('하차 '+(list.length-fail)+'/'+list.length,'Descargados '+(list.length-fail)+'/'+list.length)
                :L('하차 완료','Descarga completa')+(label?' · '+label:''));
    });
  }
  /* ---- 하차 취소 ---- */
  function undoErr(e){
    return e==='has_scan'?L('이미 스캔된 팔렛은 취소할 수 없습니다','Ya tiene escaneos — no se puede cancelar')
      :e==='bad_state'?L('검수·적치가 시작된 팔렛은 취소할 수 없습니다','Ya está en verificación/acomodo — no se puede cancelar')
      :e==='closed'?L('마감된 선적입니다','El embarque está cerrado')
      :L('하차 취소 실패','Error al cancelar')+': '+(e||'');
  }
  function undoOne(pid){
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/unload-cancel',{method:'POST'}).then(function(o){
      delete undoSel[pid];
      if(!o.ok||o.body.error){ toast(undoErr(o.body.error)); refreshDetail(); return; }
      toast('↩ '+L('하차 취소됨 — 대기로 되돌림','Descarga cancelada — en espera')); refreshDetail();
    });
  }
  function undoMany(list,label){
    if(!list||!list.length){ toast(L('취소할 하차가 없습니다','No hay descargas por cancelar')); return; }
    if(!confirm(L(list.length+'개 팔렛의 하차를 취소하고 대기로 되돌립니다.','Se cancelará la descarga de '+list.length+' pallets.')+(label?'\n'+label:''))) return;
    runSeq(list,function(p){ return '/api/inbound/'+SHIP+'/pallets/'+p.id+'/unload-cancel'; },function(fail,err){
      list.forEach(function(p){ delete undoSel[p.id]; });
      refreshDetail();
      toast(fail?undoErr(err)+' ('+(list.length-fail)+'/'+list.length+')'
                :'↩ '+L('하차 취소 완료','Descarga cancelada')+' '+list.length+(label?' · '+label:''));
    });
  }

  /* ---- 검수(스캔) ---- */
  function scanReset(){ scanPending=[]; scanLock=null; scanCounts={}; scanQty={}; scanLbl=null; }
  function candidatePallets(entries){
    var need={}; entries.forEach(function(e){need[e.code]=(need[e.code]||0)+1;});
    return DETAIL.pallets.filter(function(p){
      if(p.status==='wait'||p.status==='done')return false;
      return Object.keys(need).every(function(c){
        var cap=linesFor(p.items,c).reduce(function(a,i){return a+(i.cartons||0);},0);   // 같은 SKU 라인 합
        return cap>=need[c];
      });
    });
  }
  function renderCheck(){
    var b=$('stepbody');
    var avail=DETAIL.pallets.filter(function(p){return p.status==='unloaded'||p.status==='checking';});
    b.innerHTML='<p class="hint">'+L('카톤 라벨(Code-128 · CTR-제품번호-소입수량)을 스캔하면 제품번호·수량을 읽고 <b>이 박스를 옮길 존</b>을 알려줍니다. 스캔한 박스는 그 존의 <b>이동용 임시 팔렛</b>에 올리세요. 카톤을 열지 않습니다.','Escanee la etiqueta (Code-128 · CTR-clave-cantidad): lee la clave y la cantidad, e indica <b>la zona destino</b>. Coloque la caja en el pallet de traslado de esa zona. No abra la caja.')+'</p>'
      +'<div id="lockbox"></div>'
      +'<div class="scanbox" id="scanres"><div class="idle">'+L('카톤을 스캔하세요','Escanee una caja')+'</div></div>'
      +'<div class="scaninput"><input type="text" id="scanIn" placeholder="'+L('카톤 라벨 스캔 (예: CTR-CE0796-16)','Escanee la etiqueta (ej. CTR-CE0796-16)')+'" autocomplete="off"><button class="btn g" id="btnScanGo">'+L('스캔','Escanear')+'</button></div>'
      +'<div class="pbar"><i id="cbar"></i></div><div class="hint" id="ctxt"></div>'
      +'<div class="row" style="margin:8px 0"><button class="btn" id="btnCheckDone" disabled>✔ '+L('이 팔렛 검수 완료','Verificación del pallet lista')+'</button>'
      +'<button class="btn ghost sm" id="btnScanReset">↺ '+L('초기화','Reiniciar')+'</button></div>'
      +'<div class="skulist" id="sklist"></div>';
    var inp=$('scanIn');
    liveNorm(inp);
    inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); doScan(takeScan(inp)); inp.value=''; inp.focus(); } });
    $('btnScanGo').addEventListener('click',function(){ doScan(takeScan(inp)); inp.value=''; inp.focus(); });
    $('btnScanReset').addEventListener('click',function(){ clearWorking(); scanReset(); renderCheck(); });
    $('btnCheckDone').addEventListener('click',checkDone);
    if(!avail.length && !scanLock){ $('scanres').innerHTML='<div class="idle">'+L('하차된 팔렛이 없습니다 — 먼저 하차하세요','Sin pallets descargados — descargue primero')+'</div>'; }
    inp.focus();
    renderScanState();
  }
  // 라인 여유 = 예상 카톤 − 남이 이미 검수한 카톤 − 이번에 내가 센 카톤
  function checkRoom(i){ return Math.max(0,(i.cartons||0)-(i.scanned_cartons||0)-(scanCounts[i.id]||0)); }
  // 스캔 1건을 라인에 기록. 성공 시 그 라인, 초과면 {full:true}
  function allocScan(code,lblQty){
    var pk=pickLine(scanLock.items,code,lblQty,checkRoom);
    if(!pk) return null;
    if(pk.full) return pk;
    var it=pk.it;
    scanCounts[it.id]=(scanCounts[it.id]||0)+1;
    scanQty[it.id]=(scanQty[it.id]||0)+(lblQty||perCarton(it));   // 라벨에 수량이 없으면 그 라인의 소입수로 보충
    return pk;
  }
  function doScan(input){
    if(!input) return;
    var lbl=parseLabel(input);                 // CTR-CE0796-16 → {code:'CE0796', qty:16}
    scanLbl=lbl;
    var code=lbl.code;
    if(!code) return;
    if(!scanLock){
      scanPending.push({code:code,qty:lbl.qty||0});
      var cands=candidatePallets(scanPending);
      if(cands.length===1){ scanLock=cands[0]; scanCounts={}; scanQty={};
        var pend=scanPending; scanPending=[];
        var lastPk=null;
        pend.forEach(function(e){ lastPk=allocScan(e.code,e.qty)||lastPk; });   // 보류 스캔을 라인에 순서대로 배정
        pingWorking(scanLock.id,'check');
        toast(L('팔렛 자동 확정','Pallet identificado')+': '+scanLock.order_no+' · '+L('팔렛','Pallet')+' '+scanLock.pl_no);
        showScan(code,'ok',null,null,lastPk&&lastPk.it); renderScanState(); return; }
      else if(cands.length===0){ scanPending.pop();
        showScan(code,'warn',L('패킹리스트에 없는 카톤','Caja no está en la lista')); return; }
      else { showScan(code,'',null,cands.length); return; }
    } else {
      if(!linesFor(scanLock.items,code).length){ showScan(code,'warn',L('이 팔렛에 없는 품목','No pertenece a este pallet')); return; }
      var pk=allocScan(code,lbl.qty||0);
      if(pk&&pk.full){
        showScan(code,'warn',L('초과 스캔 — 이 품목의 카톤을 모두 스캔했습니다','Escaneo de más — todas las cajas ya escaneadas'),null,pk.it); return; }
      showScan(code,'ok',null,null,pk&&pk.it); renderScanState(); return;
    }
  }
  // 라벨 소입수량 ↔ 패킹리스트 카톤당 수량 대사
  function qtyMismatch(it,lblQty){
    var exp=perCarton(it);
    if(!lblQty||!exp||lblQty===exp) return null;
    return {exp:exp,got:lblQty};
  }
  function showScan(code,cls,warn,candN,line){
    var box=$('scanres'); box.className='scanbox '+(cls||'');
    var p=scanLock, it=line||(p?findItem(p.items,code):null), nm=it?(it.name||''):'';
    if(warn){ box.innerHTML='<div class="sku" style="color:var(--red)">⚠ '+esc(code)+'</div><div class="nm">'+esc(nm)+'</div><div class="z"><b style="color:var(--red)">'+esc(warn)+'</b></div>'+labelHint(); return; }
    if(!scanLock){ box.innerHTML='<div class="sku">'+esc(code)+'</div><div class="z"><span class="tag s">'+L('후보 팔렛','Candidatos')+' '+candN+'</span> <b>'+L('한 번 더 스캔','Escanee otra vez')+'</b></div>'+labelHint(); return; }
    var rack=it.rack, z=zoneOf(rack), isNew=(z==='NEW'), cnt=scanCounts[it.id]||0, q=scanQty[it.id]||0;
    var mm=qtyMismatch(it,scanLbl&&scanLbl.qty);
    var multi=linesFor(p.items,it.code).length>1, tag=lineTag(it);
    box.innerHTML='<div class="sku">'+esc(it.code)+(scanLbl&&scanLbl.qty?' <span style="font-size:15px;color:var(--muted)">× '+fmt(scanLbl.qty)+' EA</span>':'')
      +((multi&&tag)?' <span class="tag s mono" title="'+L('패킹리스트 라인(카톤 번호)','Línea de la lista (cajas)')+'">'+esc(tag)+'</span>':'')
      +'</div><div class="nm">'+esc(nm)+'</div>'
      +zoneBigHtml(it)
      +'<div class="z"><span class="zone '+(isNew?'new':'')+'">'+(isNew?'🆕 '+L('랙 미지정','Sin ubic.'):z+L('존','')) +'</span>'
      +'<span class="mono" style="color:var(--muted);font-size:12px">'+(isNew?L('적치 때 지정','asignar en acomodo'):esc(rack))+'</span>'
      +'<span style="margin-left:auto;font-weight:700;color:'+(cnt>=it.cartons?'var(--green)':'var(--ink)')+'">'+L('카톤','Cajas')+' '+cnt+'/'+it.cartons+' · '+fmt(q)+'/'+fmt(it.qty)+' EA'+(cnt>=it.cartons?' ✓':'')+'</span></div>'
      +(mm?'<div class="z"><b style="color:#C0533B">⚠ '+L('소입수 불일치','Cant./caja distinta')+' — '+L('라벨','etiqueta')+' '+fmt(mm.got)+' EA · '+L('패킹리스트','lista')+' '+fmt(mm.exp)+' EA'+(multi?' · '+L('다른 라인 없음','sin otra línea'):'')+'</b></div>':'')
      +labelHint();
  }
  function renderScanState(){
    var lb=$('lockbox');
    if(scanLock){
      var done=Object.keys(scanCounts).reduce(function(a,c){return a+scanCounts[c];},0);
      var lp=DETAIL.pallets.filter(function(x){return x.id===scanLock.id;})[0]||scanLock;
      lb.innerHTML=(workChip(lp,true)||'')
        +'<div class="locked"><div class="a">'+L('팔렛 자동 확정','Pallet identificado')+'</div>'
        +'<div class="b">'+esc(scanLock.order_no)+' · '+L('팔렛','Pallet')+' '+scanLock.pl_no+'</div>'
        +'<div class="c">'+L('카톤','Cajas')+' '+scanLock.cartons_expected+' · SKU '+scanLock.items.length+' · '+fmt(scanLock.qty_expected)+' EA</div></div>';
      $('cbar').style.width=(done/scanLock.cartons_expected*100)+'%';
      var okskus=scanLock.items.filter(function(i){return ((scanCounts[i.id]||0)+(i.scanned_cartons||0))>=i.cartons;}).length;
      var qdone=Object.keys(scanQty).reduce(function(a,c){return a+(scanQty[c]||0);},0);
      var qexp=scanLock.qty_expected||scanLock.items.reduce(function(a,i){return a+(i.qty||0);},0);
      var qfull=(done>=scanLock.cartons_expected);   // 카톤을 다 스캔했을 때만 수량 합계를 판정
      $('ctxt').innerHTML=L('카톤','Cajas')+' <b>'+done+'/'+scanLock.cartons_expected+'</b> · '+L('라인','Líneas')+' '+okskus+'/'+scanLock.items.length
        +' · '+L('수량','Cant.')+' <b'+(qfull&&qdone!==qexp?' style="color:#C0533B"':'')+'>'+fmt(qdone)+'/'+fmt(qexp)+' EA</b>'
        +(qfull&&qdone!==qexp?' <span style="color:#C0533B">⚠ '+L('차이','dif.')+' '+fmt(qdone-qexp)+'</span>':'');
      $('btnCheckDone').disabled=false;
      // 라인별 목록 — 같은 SKU 가 여러 라인이면 카톤 번호(#f–t)와 소입수(×n)로 구분해 보여준다
      $('sklist').innerHTML=scanLock.items.slice().sort(function(a,b){ var da=(scanCounts[a.id]||0)>0?0:1,db=(scanCounts[b.id]||0)>0?0:1; return da-db||a.code.localeCompare(b.code)||(a.id-b.id); }).map(function(i){
        var c=scanCounts[i.id]||0, pre=(i.scanned_cartons||0), ok=(c+pre)>=i.cartons, q=scanQty[i.id]||0;
        var multi=linesFor(scanLock.items,i.code).length>1, tag=lineTag(i);
        return '<div class="skurow '+(ok?'done':'')+'"><span class="s">'+esc(i.code)
          +(multi?' <span class="mono" style="font-size:10.5px;color:var(--muted)">'+(tag?esc(tag)+' · ':'')+'×'+fmt(perCarton(i))+'</span>':'')+'</span>'
          +'<span class="z2">'+(zoneOf(i.rack)==='NEW'?'🆕':zoneOf(i.rack))+zoneChip(i)+'</span>'
          +(pre?'<span class="tag s" title="'+L('다른 작업자가 이미 검수','ya verificado por otro')+'">+'+pre+'</span>':'')
          +'<span class="c '+(ok?'ok':'')+'">'+(c+pre)+'/'+i.cartons+' · '+fmt(q)+'/'+fmt(i.qty)+(ok&&q!==i.qty?' ⚠':'')+'</span></div>';
      }).join('');
    } else { lb.innerHTML=''; $('cbar').style.width='0%'; $('ctxt').textContent=''; $('btnCheckDone').disabled=true; $('sklist').innerHTML=''; }
  }
  function checkDone(){
    if(!scanLock) return;
    // 카톤을 다 스캔했는데 라벨 수량 합계가 패킹리스트와 다르면 한 번 확인받는다
    var cdone=Object.keys(scanCounts).reduce(function(a,c){return a+scanCounts[c];},0);
    var qdone=Object.keys(scanQty).reduce(function(a,c){return a+(scanQty[c]||0);},0);
    var qexp=scanLock.qty_expected||scanLock.items.reduce(function(a,i){return a+(i.qty||0);},0);
    if(cdone>=scanLock.cartons_expected && qdone && qexp && qdone!==qexp){
      if(!confirm(L('라벨 수량 합계가 패킹리스트와 다릅니다.','La cantidad de las etiquetas no coincide con la lista.')
        +'\n'+L('스캔','Escaneado')+' '+fmt(qdone)+' EA  ≠  '+L('패킹리스트','Lista')+' '+fmt(qexp)+' EA'
        +'\n\n'+L('그래도 검수 완료로 저장할까요?','¿Guardar la verificación de todos modos?'))) return;
    }
    // 증분(delta) 전송 — 같은 팔렛을 둘이 나눠 스캔해도 서버에서 합산된다(절대값은 서로를 덮어씀)
    var items=scanLock.items.map(function(i){ return {item_id:i.id, scanned_delta:(scanCounts[i.id]||0)}; })
      .filter(function(r){ return r.scanned_delta>0; });
    api('/api/inbound/'+SHIP+'/pallets/'+scanLock.id+'/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:items})}).then(function(o){
      if(!o.ok||o.body.error){ toast(L('저장 실패','Error')+': '+(o.body.error||o.status)); return; }
      toast(L('✔ 팔렛 검수 완료','✔ Pallet verificado'));
      clearWorking(); scanReset(); refreshDetail(renderDetail);
    });
  }

  /* ---- 적치 — 팔렛 목록 → 박스 스캔(위치 안내) → 랙 스캔 잠금 → 박스 1개당 1스캔 ---- */
  //  적치 목표 카톤 = 검수된 카톤(scanned_cartons). 서버 putaway 와 같은 기준.
  var CHECKED_ST={checking:1,checked:1,done:1};
  function palChecked(p){ return !!p.checked_at || !!CHECKED_ST[p.status]; }
  function itemCap(p,i){ return palChecked(p)?(i.scanned_cartons||0):(i.cartons||0); }
  function itemPut(i){ return (i.put_cartons||0)+(putAdd[i.id]||0); }
  function itemLeft(p,i){ return Math.max(0,itemCap(p,i)-itemPut(i)); }
  function itemRack(i){ return putSaveRack[i.id]||i.rack||null; }   // 이번에 지정/변경한 랙이 우선
  function palPutStat(p){
    var cap=0,put=0,left=0,zs={},skus=0;
    p.items.forEach(function(i){
      var c=itemCap(p,i); if(c<=0) return;
      skus++; cap+=c; put+=Math.min(itemPut(i),c); left+=itemLeft(p,i);
      zs[zoneOf(itemRack(i))]=1;
    });
    return {p:p,cap:cap,put:put,left:left,skus:skus,zones:Object.keys(zs).sort()};
  }
  function putQueue(){
    return DETAIL.pallets.filter(palChecked).map(palPutStat).sort(function(a,b){
      return (a.left?0:1)-(b.left?0:1)
        || String(a.p.order_no).localeCompare(String(b.p.order_no)) || a.p.pl_no-b.p.pl_no; });
  }
  function curPutPal(){ return DETAIL.pallets.filter(function(p){return p.id===putPal;})[0]||null; }
  function putReset(){ putPal=null; putRack=null; putAdd={}; putSaveRack={}; putLast=null; putWarn=null; }
  function putPending(){ var n=0; Object.keys(putAdd).forEach(function(k){ n+=putAdd[k]||0; }); return n; }

  function renderPut(){ if(putPal==null) renderPutList(); else renderPutWork(); }

  function renderPutList(){
    var b=$('stepbody'), q=putQueue();
    var waitP=q.filter(function(s){return s.left>0;});
    var cap=0,put=0,noRack=0;
    q.forEach(function(s){ cap+=s.cap; put+=s.put;
      s.p.items.forEach(function(i){ if(!itemRack(i)) noRack+=itemLeft(s.p,i); }); });
    b.innerHTML='<div class="kpis" style="margin-bottom:12px">'
      +'<div class="kpi"><div class="l">'+L('적치 대기 팔렛','Pallets por acomodar')+'</div><div class="v">'+waitP.length+' <small>/ '+DETAIL.pallets.length+'</small></div></div>'
      +'<div class="kpi"><div class="l">'+L('적치 대기 카톤','Cajas por acomodar')+'</div><div class="v">'+fmt(cap-put)+'</div></div>'
      +'<div class="kpi"><div class="l">'+L('랙 미지정','Sin ubicación')+'</div><div class="v" style="color:'+(noRack?'var(--gold)':'var(--muted)')+'">'+fmt(noRack)+' <small>'+L('카톤','cajas')+'</small></div></div>'
      +'<div class="kpi"><div class="l">'+L('적치 완료','Acomodado')+'</div><div class="v" style="color:var(--green)">'+fmt(put)+'<small>/'+fmt(cap)+'</small></div></div></div>'
      +'<p class="hint">'+L('검수가 끝난 팔렛만 나옵니다. 팔렛을 누르거나, 그 팔렛의 카톤을 그냥 스캔해도 열립니다.','Solo pallets verificados. Toque el pallet o escanee una caja suya.')+'</p>'

  function openPutPal(pid){ putPal=pid; putRack=null; putLast=null; putWarn=null; pingWorking(pid,'put'); renderPutWork(); }
  // 목록에서 카톤을 스캔 → 그 카톤이 있는 적치 대기 팔렛을 자동 확정(검수와 같은 방식)

        +'<div class="z"><span class="rackbig" style="background:var(--red)">'+esc(wr)+'</span>'

        +'<button class="btn ghost" id="btnRackSkip">'+esc(wr)+L(' 로 가져가기','Llevar allá')+'</button></div>'
        +'<div class="hint" style="margin:8px 0 0">'+L('변경하면 제품 기본 위치도 함께 갱신되고 감사로그에 남습니다.','Al cambiar se actualiza la ubicación maestra del producto y se registra en auditoría.')+'</div></div>';
      $('btnRackMove').addEventListener('click',function(){ var it=putWarn.item; putWarn=null;
        putSaveRack[it.id]=putRack; putAdd[it.id]=(putAdd[it.id]||0)+1;
        putLast={item:it,ok:true,moved:true}; schedFlush(); renderPutWork(); });

  // 스캔 1건 처리 — 팔렛에 있는 코드면 카톤, 아니면 랙으로 본다
  function putScan(input){
    if(!input) return;
    var p=curPutPal(); if(!p) return;
    var lbl=parseLabel(input), code=lbl.matched?lbl.code:normScan(input);       // 카톤 라벨이면 제품번호로, 아니면 랙 코드로
    // 같은 SKU 여러 라인이면: 남은 카톤이 있는 라인 중 소입수량이 라벨과 같은 라인 우선(라인별 저장 2026-08-17)
    var pk=pickLine(p.items,code,(lbl.matched&&lbl.qty)||0,function(i){ return itemLeft(p,i); });
    var it=pk?pk.it:null;
    if(!it){ setPutRack(code); return; }
    if(itemCap(p,it)<=0){ putLast={item:it,warn:L('검수된 카톤이 없는 품목','Sin cajas verificadas'),code:code}; renderPutRes(); return; }
    if(itemLeft(p,it)<=0){ putLast={item:it,warn:L('이미 다 적치했습니다','Ya está acomodado'),code:code}; renderPutRes(); renderPutSku(); return; }
    var r=itemRack(it);
    if(!r){                                    // 랙 미지정
      if(!putRack){ putLast={item:it,need:true}; renderPutRes(); return; }
      putSaveRack[it.id]=putRack;              // 작업 랙을 이 SKU 기본 위치로 저장
      putAdd[it.id]=(putAdd[it.id]||0)+1; putLast={item:it,assigned:true};
      schedFlush(); renderPutRes(); renderPutSku(); putSaveSync(); return;
    }
    if(!putRack){ putLast={item:it,guide:true}; renderPutRes(); return; }   // 위치만 안내
    if(!bareEq(putRack,r)){ putWarn={item:it}; renderPutRes(); return; }
    putAdd[it.id]=(putAdd[it.id]||0)+1; putLast={item:it};
    schedFlush(); renderPutRes(); renderPutSku(); putSaveSync();
  }
  function setPutRack(rack){
    if(!rack) return;
    if(putRack&&bareEq(putRack,rack)){ toast(L('이미 이 랙입니다','Ya es esta ubicación')+' '+rack); return; }
    putFlush(function(){ putRack=rack; putLast=null; putWarn=null; toast('📍 '+L('작업 랙','Ubicación')+' '+rack); renderPutWork(); });
  }
  /* 저장 — 스캔 흐름을 끊지 않도록 유휴 2.5초 뒤 자동 저장 + 버튼/랙변경/이탈 시 즉시 */
  function schedFlush(){ clearTimeout(putFlushT); putFlushT=setTimeout(function(){ putFlush(); },2500); }
  function putPayload(){
    var p=curPutPal(); if(!p) return [];
    return p.items.filter(function(i){ return (putAdd[i.id]||0)>0 || putSaveRack[i.id]; }).map(function(i){
      // 증분(delta) 전송 — 같은 팔렛을 둘이 동시에 적치해도 서버에서 합산된다
      return { item_id:i.id, put_delta:(putAdd[i.id]||0), rack:itemRack(i), save_rack:!!putSaveRack[i.id] };
    });
  }
  function putFlush(cb){
    clearTimeout(putFlushT);
    var p=curPutPal(), items=putPayload();
    if(!p||!items.length||putSaving){ if(cb)cb(); return; }
    putSaving=true; putSaveSync();
    api('/api/inbound/'+SHIP+'/pallets/'+p.id+'/putaway',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:items})}).then(function(o){
      putSaving=false;
      if(!o.ok||o.body.error){ toast(L('적치 저장 실패','Error al guardar')+': '+(o.body.error||o.status)); putSaveSync(); if(cb)cb(); return; }
      putAdd={}; putSaveRack={};
      var wasDone=o.body.done;
      refreshDetail(function(){
        if(wasDone) toast('✔ '+L('팔렛 적치 완료','Pallet acomodado'));
        if(cb) cb(); else { if(putPal!=null&&curPutPal()) renderPutWork(); else { putReset(); renderPut(); } }
      });
    });
  }

        api('/api/inbound/'+SHIP+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})}).then(function(o){
          if(!o.ok||o.body.error){ toast(o.body.error==='bad_pin'?L('PIN이 올바르지 않습니다','PIN incorrecto'):L('마감 실패','Error')+': '+(o.body.error||o.status)); $('btnClose').disabled=false; return; }
          toast(L('✔ 마감 — 구매 '+o.body.po_lines_updated+'개 라인 입고 반영','✔ Cerrado — '+o.body.po_lines_updated+' líneas de compra actualizadas'));
          refreshDetail(renderDetail);
        });
      });
    }
  }

  /* ============ 자동 갱신(25초) ============
     · 스캔 중(검수 잠금)·적치 미저장·저장 중·탭 비활성·PIN 입력 중이면 건너뛴다.
     · 데이터 서명이 바뀔 때만 다시 그린다(깜빡임·포커스 유실 방지).
     · 팔렛을 잡고 있으면 같은 주기로 점유 하트비트를 보낸다. */
  function sigList(items){
    try{ return JSON.stringify((items||[]).map(function(s){
      return [s.id,s.status,s.pallets,s.pallets_checked,s.cartons,s.qty,s.eta,s.invoice_no]; })); }catch(e){ return ''; }
  }
  function sigDetail(b){
    try{ return JSON.stringify([b.shipment,(b.pallets||[]).map(function(p){
      return [p.id,p.status,p.checked_at?1:0,p.working?1:0,p.working_by||0,p.working_step||'',
        (p.items||[]).map(function(i){ return [i.id,i.scanned_cartons,i.put_cartons,i.rack||'']; })]; })]); }catch(e){ return ''; }
  }
  function pollBlocked(){
    if(pollBusy) return true;
    try{ if(document.hidden) return true; }catch(e){}
    if(document.querySelector('.delrow')) return true;      // 삭제 PIN 입력 중
    if(VIEW==='upload') return true;                        // 업로드/미리보기 중
    if(VIEW==='detail'){
      if(scanLock) return true;                             // 검수 진행 중
      if(putSaving||putPending()) return true;              // 적치 미저장분 있음
      var el=document.activeElement;
      if(el&&el.tagName==='INPUT'&&el.value) return true;    // 입력 중
    }
    return false;
  }
  function pollTick(){
    if(WORK_PID&&VIEW==='detail'&&SHIP) pingWorking(WORK_PID,WORK_STEP);   // 하트비트는 항상
    if(pollBlocked()) return;
    pollBusy=true;
    if(VIEW==='list'){
      api('/api/inbound').then(function(o){
        pollBusy=false;
        if(!o.ok||!o.body.items) return;
        var sg=sigList(o.body.items);
        if(sg===pollSig) return;
        pollSig=sg; if(VIEW==='list'&&!pollBlocked()) loadList();
      });
      return;
    }
    if(VIEW==='detail'&&SHIP){
      api('/api/inbound/'+SHIP).then(function(o){
        pollBusy=false;
        if(!o.ok||o.body.error) return;
        var sg=sigDetail(o.body);
        if(sg===pollSig) return;
        if(pollBlocked()) return;                            // 그 사이 스캔이 시작됐으면 다음 주기로
        pollSig=sg; DETAIL=o.body;
        var keepFocus=(document.activeElement&&document.activeElement.tagName==='INPUT');
        renderDetail();               // 헤더 단계 카운터까지 반영. STEP·putPal·putRack 은 모듈 변수라 유지된다
        if(keepFocus){ var f=$('putIn')||$('scanIn')||$('putListIn'); if(f) f.focus(); }
      });
      return;
    }
    pollBusy=false;
  }
  function startPoll(){ if(pollT) clearInterval(pollT); pollT=setInterval(pollTick,POLL_MS); }

  /* ============ 시작 ============ */
  loadList();
  startPoll();
  try{ window.addEventListener('beforeunload',function(){ clearWorking(); }); }catch(e){}
})();
</script>
</body>
</html>
