  /* ---- 적치 — 팔렛 목록 → 박스 스캔(위치 안내) → 랙 스캔 잠금 → 박스 1개당 1스캔 ---- */
  //  적치 목표 카톤 = 검수된 카톤(scanned_cartons). 서버 putaway 와 같은 기준.
  var CHECKED_ST={checking:1,checked:1,done:1};
  function palChecked(p){ return !!p.checked_at || !!CHECKED_ST[p.status]; }
  function itemCap(p,i){ return palChecked(p)?(i.scanned_cartons||0):(i.cartons||0); }
  function itemPut(i){ return (i.put_cartons||0)+(putAdd[i.id]||0); }
  function itemLeft(p,i){ return Math.max(0,itemCap(p,i)-itemPut(i)); }
  function itemRack(i){ return putSaveRack[i.id]||i.rack||null; }   // 이번에 지정/변경한 랙이 우선
  function palPutStat(p){
    var cap=0,put=0,left=0,zs={},skus=0;
    p.items.forEach(function(i){
      var c=itemCap(p,i); if(c<=0) return;
      skus++; cap+=c; put+=Math.min(itemPut(i),c); left+=itemLeft(p,i);
      zs[zoneOf(itemRack(i))]=1;
    });
    return {p:p,cap:cap,put:put,left:left,skus:skus,zones:Object.keys(zs).sort()};
  }
  function putQueue(){
    return DETAIL.pallets.filter(palChecked).map(palPutStat).sort(function(a,b){
      return (a.left?0:1)-(b.left?0:1)
        || String(a.p.order_no).localeCompare(String(b.p.order_no)) || a.p.pl_no-b.p.pl_no; });
  }
  function curPutPal(){ return DETAIL.pallets.filter(function(p){return p.id===putPal;})[0]||null; }
  function putReset(){ putPal=null; putRack=null; putAdd={}; putSaveRack={}; putLast=null; putWarn=null; putNoMaster={}; putEdit=null; }
  // 미저장 변경 수 — 빼기(음수)도 저장할 변경이므로 절대값으로 센다(적치 수정 2026-08-17)
  function putPending(){ var n=0; Object.keys(putAdd).forEach(function(k){ n+=Math.abs(putAdd[k]||0); }); return n+Object.keys(putSaveRack).length; }

  function renderPut(){ if(putPal==null) renderPutList(); else renderPutWork(); }

  function renderPutList(){
    var b=$('stepbody'), q=putQueue();
    var waitP=q.filter(function(s){return s.left>0;});
    var cap=0,put=0,noRack=0;
    q.forEach(function(s){ cap+=s.cap; put+=s.put;
      s.p.items.forEach(function(i){ if(!itemRack(i)) noRack+=itemLeft(s.p,i); }); });
    b.innerHTML='<div class="kpis" style="margin-bottom:12px">'
      +'<div class="kpi"><div class="l">'+L('적치 대기 팔렛','Pallets por acomodar')+'</div><div class="v">'+waitP.length+' <small>/ '+DETAIL.pallets.length+'</small></div></div>'
      +'<div class="kpi"><div class="l">'+L('적치 대기 카톤','Cajas por acomodar')+'</div><div class="v">'+fmt(cap-put)+'</div></div>'
      +'<div class="kpi"><div class="l">'+L('랙 미지정','Sin ubicación')+'</div><div class="v" style="color:'+(noRack?'var(--gold)':'var(--muted)')+'">'+fmt(noRack)+' <small>'+L('카톤','cajas')+'</small></div></div>'
      +'<div class="kpi"><div class="l">'+L('적치 완료','Acomodado')+'</div><div class="v" style="color:var(--green)">'+fmt(put)+'<small>/'+fmt(cap)+'</small></div></div></div>'
      +'<p class="hint">'+L('검수가 끝난 팔렛만 나옵니다. 팔렛을 누르거나, 그 팔렛의 카톤을 그냥 스캔해도 열립니다.','Solo pallets verificados. Toque el pallet o escanee una caja suya.')+'</p>'
      +'<div class="scaninput" style="margin-bottom:10px"><input type="text" id="putListIn" placeholder="'+L('팔렛 라벨 또는 카톤 스캔 → 팔렛 바로 열기','Escanee pallet o caja → abre el pallet')+'" autocomplete="off"><button class="btn g" id="btnPutListGo">'+L('스캔','Escanear')+'</button></div>'
      +'<div id="pql"></div>';
    if(!q.length){ $('pql').innerHTML='<div class="idle" style="padding:22px">'+L('적치할 팔렛이 없습니다 — 검수를 먼저 하세요','Nada por acomodar — verifique primero')+'</div>'; }
    else $('pql').innerHTML=q.map(function(s){
      var pct=s.cap?Math.round(s.put/s.cap*100):0, done=(s.left<=0);
      return '<div class="ppal'+(done?' done':'')+'" data-pp="'+s.p.id+'" role="button" tabindex="0">'
        +'<div class="who"><div class="po">PO '+poHtmlSm(s.p.order_no)+'</div><div class="pl">'+L('팔렛','Pallet')+' '+s.p.pl_no+'</div></div>'
        +'<div class="zs">'+(s.zones.map(function(z){ return z==='NEW'
              ?'<span class="zchip n">🆕 '+L('미지정','Sin ubic.')+'</span>'
              :'<span class="zchip">'+esc(z)+'</span>'; }).join('')||'')+'</div>'
        +'<div class="num2">'+L('카톤','Cajas')+' <b>'+fmt(s.left)+'</b> '+L('남음','rest.')+' · SKU '+s.skus+'</div>'
        +(workChip(s.p)||'')
        +'<div class="rt">'+(done?'<span class="tag g">'+L('적치 완료','Acomodado')+'</span>'
             :'<div class="pb"><i style="width:'+pct+'%"></i></div><span class="num2">'+s.put+'/'+s.cap+'</span>')+'</div></div>';
    }).join('');
    document.querySelectorAll('#pql .ppal').forEach(function(el){
      el.addEventListener('click',function(){ openPutPal(+el.dataset.pp); });
      el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); openPutPal(+el.dataset.pp); } });
    });
    var li=$('putListIn');
    var fireL=wireScanInput(li,putListScan);
    $('btnPutListGo').addEventListener('click',fireL);
    li.focus();
  }
  function openPutPal(pid){ putPal=pid; putRack=null; putLast=null; putWarn=null; pingWorking(pid,'put'); renderPutWork(); }
  // 목록에서 카톤을 스캔 → 그 카톤이 있는 적치 대기 팔렛을 자동 확정(검수와 같은 방식)
  /* 팔렛 라벨 스캔 매칭(2026-08-18) — 팔렛이 많고 번호가 비슷해 목록에서 찾기 어렵다는
     현장 요청. "ORDER NO + PL 번호" 형태의 팔렛 바코드를 스캔하면 그 팔렛으로 바로 들어간다.
     허용 형태: 26B2C-4 · 26B2C/4 · 26B2C 4 · 26B2C4 (구분자·대소문자 무시) · PL 번호 단독(선적 내 유일할 때) */
  function palByScan(code){
    var b=bare(code); if(!b) return null;
    var hits=DETAIL.pallets.filter(function(p){
      return b===bare(String(p.order_no||'')+String(p.pl_no)); });
    if(hits.length===1) return hits[0];
    if(!hits.length&&/^\d{1,4}$/.test(b)){            // 짧은 숫자만 = 팔렛 번호 단독
      var byNo=DETAIL.pallets.filter(function(p){ return String(p.pl_no)===String(Number(b)); });
      if(byNo.length===1) return byNo[0];
    }
    return null;
  }
  function putListScan(input){
    if(!input) return;
    var lbl=parseLabel(input); var code=lbl.matched?lbl.code:normScan(input);   // 매칭 안 되면 랙 라벨일 수 있으니 원문 유지
    if(dupScan(lbl.norm)) return;
    if(!lbl.matched && looksCompanion(code)) return;   // 부속 바코드 — 무시
    // ① 팔렛 라벨이면 그 팔렛으로 드릴다운(카톤보다 우선 — 팔렛 특정이 목적)
    var sw=(!lbl.matched)?palByScan(code):null;
    if(sw){
      if(!palChecked(sw)){ sndWarn(); toast('⚠ '+L('아직 검수 전 팔렛입니다','Pallet sin verificar')+' — '+esc(String(sw.order_no))+'/'+sw.pl_no); return; }
      sndInfo(); toast('📦 '+L('팔렛','Pallet')+' '+esc(String(sw.order_no))+'/'+sw.pl_no);
      openPutPal(sw.id); return;
    }
    // ② 카톤 라벨이면 그 카톤이 실린 팔렛 자동 열기(기존)
    var cands=putQueue().filter(function(s){
      return s.left>0 && linesFor(s.p.items,code).some(function(m){ return itemLeft(s.p,m)>0; }); });
    if(!cands.length){ sndErr(); toast(L('적치 대상 카톤/팔렛이 아닙니다','No es una caja ni un pallet por acomodar')+': '+code); return; }
    if(cands.length>1){ sndWarn(); toast(L('여러 팔렛에 있는 품목입니다 — 팔렛 라벨을 스캔하거나 목록에서 고르세요','Está en varios pallets — escanee la etiqueta del pallet')+' ('+cands.length+')'); return; }
    putPal=cands[0].p.id; putRack=null; putLast=null; putWarn=null; pingWorking(putPal,'put');
    renderPutWork(); putScan(code);
  }

          putSaveRack[it.id]=nr;

  // 스캔 1건 처리 — 팔렛에 있는 코드면 카톤, 아니면 랙으로 본다
  function putScan(input){
    if(!input) return;
    var p=curPutPal(); if(!p) return;
    var lbl=parseLabel(input), code=lbl.matched?lbl.code:normScan(input);       // 카톤 라벨이면 제품번호로, 아니면 랙 코드로
    if(dupScan(lbl.norm)) return;                                               // 이중 리딩 무시
    // 같은 SKU 여러 라인이면: 남은 카톤이 있는 라인 중 소입수량이 라벨과 같은 라인 우선(라인별 저장 2026-08-17)
    var pk=pickLine(p.items,code,(lbl.matched&&lbl.qty)||0,function(i){ return itemLeft(p,i); });
    var it=pk?pk.it:null;
    if(!it){
      if(looksCompanion(code)) return;         // 상품 EAN 등 부속 바코드 — 랙으로 오인하지 않음
      // 팔렛 라벨이면 팔렛 전환(2026-08-18) — 미저장분 먼저 저장 후 이동. 랙으로 오인하지 않게 랙 판정보다 먼저.
      var sw=palByScan(code);
      if(sw){
        if(sw.id===p.id){ sndInfo(); toast(L('이미 이 팔렛입니다','Ya está en este pallet')); return; }
        if(!palChecked(sw)){ sndWarn(); toast('⚠ '+L('아직 검수 전 팔렛입니다','Pallet sin verificar')+' — '+esc(String(sw.order_no))+'/'+sw.pl_no); return; }
        putFlush(function(){ sndInfo(); toast('📦 '+L('팔렛 전환','Cambio de pallet')+' → '+esc(String(sw.order_no))+'/'+sw.pl_no); openPutPal(sw.id); });
        return;
      }
      setPutRack(code); return;
    }
    if(itemCap(p,it)<=0){ sndErr(); putLast={item:it,warn:L('검수된 카톤이 없는 품목','Sin cajas verificadas'),code:code}; renderPutRes(); return; }
    if(itemLeft(p,it)<=0){ sndErr(); putLast={item:it,warn:L('이미 다 적치했습니다','Ya está acomodado'),code:code}; renderPutRes(); renderPutSku(); return; }
    var r=itemRack(it);
    if(!r){                                    // 랙 미지정
      if(!putRack){ sndWarn(); putLast={item:it,need:true}; renderPutRes(); return; }
      putSaveRack[it.id]=putRack;              // 작업 랙을 이 SKU 기본 위치로 저장
      putAdd[it.id]=(putAdd[it.id]||0)+1; putLast={item:it,assigned:true};
      goodScanMark(); sndOk(); schedFlush(); renderPutRes(); renderPutSku(); putSaveSync(); return;
    }
    if(!putRack){ sndInfo(); putLast={item:it,guide:true}; renderPutRes(); return; }   // 위치만 안내
    if(!bareEq(putRack,r)){ sndErr(); putWarn={item:it}; renderPutRes(); return; }
    putAdd[it.id]=(putAdd[it.id]||0)+1; putLast={item:it};
    goodScanMark(); sndOk(); schedFlush(); renderPutRes(); renderPutSku(); putSaveSync();
  }
  function setPutRack(rack){
    if(!rack) return;
    if(putRack&&bareEq(putRack,rack)){ sndWarn(); toast(L('이미 이 랙입니다','Ya es esta ubicación')+' '+rack); return; }
    putFlush(function(){ putRack=rack; putLast=null; putWarn=null; sndInfo(); toast('📍 '+L('작업 랙','Ubicación')+' '+rack); renderPutWork(); });
  }
  /* 저장 — 스캔 흐름을 끊지 않도록 유휴 2.5초 뒤 자동 저장 + 버튼/랙변경/이탈 시 즉시 */
  function schedFlush(){ clearTimeout(putFlushT); putFlushT=setTimeout(function(){ putFlush(); },2500); }
  function putPayload(){
    var p=curPutPal(); if(!p) return [];
    return p.items.filter(function(i){ return (putAdd[i.id]||0)!==0 || putSaveRack[i.id]; }).map(function(i){
      // 증분(delta) 전송 — 같은 팔렛을 둘이 동시에 적치해도 서버에서 합산된다. 음수 = 적치 빼기(수정).
      // save_rack: 제품 마스터 위치까지 갱신할지 — 수정 편집기에서 체크 해제하면 이 선적만 바뀐다.
      return { item_id:i.id, put_delta:(putAdd[i.id]||0), rack:itemRack(i), save_rack:!!putSaveRack[i.id]&&!putNoMaster[i.id] };
    });
  }
  function putFlush(cb){
    clearTimeout(putFlushT);
    var p=curPutPal(), items=putPayload();
    if(!p||!items.length||putSaving){ if(cb)cb(); return; }
    putSaving=true; putSaveSync();
    api('/api/inbound/'+SHIP+'/pallets/'+p.id+'/putaway',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({items:items})}).catch(function(){
        return {ok:false,status:0,body:{error:L('네트워크 없음','sin red')}};   // 네트워크 단절 — putSaving 이 잠기지 않게 정상 실패로 변환
      }).then(function(o){
      putSaving=false;
      if(!o.ok||o.body.error){ sndErr(); toast(L('적치 저장 실패','Error al guardar')+': '+(o.body.error||o.status)); putSaveSync(); if(cb)cb(); return; }
      sndSaved();
      putAdd={}; putSaveRack={}; putNoMaster={};
      var wasDone=o.body.done;
      refreshDetail(function(){
        if(wasDone) toast('✔ '+L('팔렛 적치 완료','Pallet acomodado'));
        if(cb) cb(); else { if(putPal!=null&&curPutPal()) renderPutWork(); else { putReset(); renderPut(); } }
      });
    });
  }

  /* ---- 마감(입고) — 검수만 끝나면 적치 전에 입고 가능(2026-08-17) ----
     "검수 완료 후 이상 없으면 바로 입고" — 마감은 실측 스캔 수량으로 구매 received_qty 를
     갱신하고, 적치는 마감 후에도 계속 진행할 수 있다(판매 대응을 적치보다 앞당김). */
  function lineQtyMeasured(i){ return (i.cartons>0)?Math.round((i.qty||0)/i.cartons)*(i.scanned_cartons||0):(i.qty||0); }
  function palQtyMeasured(p){ return p.items.reduce(function(a,i){return a+lineQtyMeasured(i);},0); }
  var lastCloseRes=null;   // 마지막 마감 결과(경고 표시용) — 미반영 SKU 가 조용히 사라지지 않게
  function renderClose(){

      +'<div class="kpi"><div class="l">'+L('입고 수량 (실측)','Cantidad real')+'</div><div class="v">'+fmt(qty)+' <small>EA</small></div></div>'
      +'<div class="kpi"><div class="l">'+L('패킹리스트 대비','vs Lista')+'</div><div class="v" style="color:'+(qty===qtyExp?'var(--green)':'var(--gold)')+'">'+(qty===qtyExp?'✓':(qty>qtyExp?'+':'')+fmt(qty-qtyExp))+'</div></div>'
      +'<div class="kpi"><div class="l">'+L('입고 대기 팔렛','Por recibir')+'</div><div class="v" style="color:'+(pend.length?'var(--gold)':'var(--green)')+'">'+pend.length+'</div></div></div>'
      +'<div style="max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:11px;margin-top:11px">'
      +'<table><thead><tr><th>ORDER NO</th><th class="num">PL</th><th class="num">'+L('예상','Esp.')+'</th><th class="num">'+L('검수','Verif.')+'</th><th class="num">'+L('실측 EA','EA real')+'</th><th>'+L('상태','Estado')+'</th></tr></thead><tbody>'
      +DETAIL.pallets.map(function(p){ var ok=palConfirmed(p);
        var sc=p.items.reduce(function(a,i){return a+(i.scanned_cartons||0);},0);
        var tag;   // 확정 + 적치 진행 = '적치중'(검수는 유효) · received_at = 입고 반영됨
        if(ok&&p.received_at) tag='<span class="tag g">✔ '+L('입고됨','Recibido')+'</span>';
        else if(ok&&(p.status==='checking'||p.status==='done')) tag='<span class="tag g">'+L('검수완료·적치중','Verif. · acomodando')+'</span>';
        else if(ok) tag='<span class="tag g">'+L('검수 완료','Verificado')+'</span>';
        else if(sc) tag='<span class="tag o">'+L('검수중','En proc.')+'</span>';
        else tag='<span class="tag r">'+L('미검수','Sin verif.')+'</span>';
        return '<tr><td>'+poHtmlSm(p.order_no)+'</td><td class="num">'+p.pl_no+'</td><td class="num">'+p.cartons_expected+'</td><td class="num">'+sc+'</td>'
          +'<td class="num">'+(ok?fmt(palQtyMeasured(p)):'—')+'</td><td>'+tag+'</td></tr>'; }).join('')
      +'</tbody></table></div>';
    // 직전 마감의 경고(구매 미매칭·미등록 SKU·실측 0) — 문제가 조용히 넘어가지 않게 화면에 남긴다
    if(lastCloseRes&&((lastCloseRes.unmatched||[]).length||(lastCloseRes.unregistered||[]).length)){

        return '· <b class="mono">'+esc(u.code||'')+'</b> ('+esc(u.order_no||'')+') — '

           :u.reason==='other_po'?L('다른 발주로 반영','otra OC')+': '+esc(u.po_ref||'')
           :L('실측 스캔 0 — 검수 기록 확인','0 escaneado')); });
      if(unm.length>15) rowsW.push('… '+L('외','y')+' '+(unm.length-15)+L('건',''));
      (lastCloseRes.unregistered||[]).forEach(function(c){ rowsW.push('· <b class="mono">'+esc(c)+'</b> — '+L('미등록 SKU(제품 마스터에 없음) — 재고·구매 미반영','SKU no registrado')); });
      b.innerHTML+='<div class="note" style="margin-top:10px;border-color:var(--red)"><b style="color:var(--red)">⚠ '+L('구매 연동에서 빠진 항목','No aplicado a compras')+' ('+unm.length+L('건','')+')</b>'
        +' — <span style="color:var(--muted)">'+L('재고는 정상 반영됨. 발주번호 표기 차이/발주 라인 제품 미매칭이 원인일 수 있음','el stock sí se aplicó')+'</span><br>'+rowsW.join('<br>')
        +(isDir&&nPo?'<div class="row" style="margin-top:8px"><button class="btn o sm" id="btnRematch">🔧 '+L('구매 재매칭 (부족분만 안전 반영)','Reconciliar compras')+'</button></div>':'')+'</div>';
      var brm=$('btnRematch'); if(brm) brm.addEventListener('click',doPoRematch);
    } else if(isDir&&DETAIL.pallets.some(function(p){return p.received_at;})){
      // 마감 이력이 있으면 언제든 재매칭 가능(새로고침으로 경고를 잃어도)
      b.innerHTML+='<div class="row" style="margin-top:10px"><button class="btn ghost sm" id="btnRematch">🔧 '+L('구매 재매칭 (마감분 구매 연동 점검·복구)','Reconciliar compras')+'</button></div>';
      var brm2=$('btnRematch'); if(brm2) brm2.addEventListener('click',doPoRematch);
    }
    var noteChain='<div class="note">'+L('입고(마감)하면: ① 실재고(stock)가 <b>실측 스캔 수량</b>만큼 즉시 늘어나 판매 대응 가능 ② 구매 received_qty 갱신(Back Order 감소) ③ 원가는 이후 수입원가 승인에서 반영(수량은 이중 반영되지 않음). 적치는 마감과 무관하게 계속 가능합니다.','Al cerrar: stock sube de inmediato con lo escaneado; compras se actualiza; el costo se aprueba después (sin duplicar cantidades).')+'</div>';
    /* 구매 재매칭(0177) — 마감 때 구매 연동에서 빠진 수량을 부족분만 안전하게 추가 반영 */
    function doPoRematch(){
      api('/api/inbound/'+SHIP+'/po-rematch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(function(o){
        if(!o.ok||o.body.error){ sndErr(); toast('⚠ '+L('재매칭 실패','Error')+': '+(o.body.error==='director_only'?L('디렉터만 가능합니다','Solo director'):(o.body.error||o.status))); return; }
        var f=o.body.fixed||[], st2=o.body.still_unmatched||[];
        var q2=f.reduce(function(a,x){return a+(x.qty||0);},0);
        sndSaved();
        toast('🔧 '+L('구매 재매칭 완료 — '+f.length+'개 라인 · +'+fmt(q2)+'EA 반영'+(st2.length?' · 미해결 '+st2.length+'건':''),'Reconciliado: '+f.length+' líneas'+(st2.length?' · pendientes '+st2.length:'')));
        if(st2.length){ sndWarn(); toast('⚠ '+L('미해결 '+st2.length+'건 — 구매 모듈에 해당 발주가 없습니다(발주 업로드 확인)','Sin OC en compras: '+st2.length)); }
        if(lastCloseRes){ lastCloseRes.unmatched=st2.map(function(u){return {order_no:u.order_no,code:u.code,reason:'no_po_line'};}); }
        refreshDetail(renderDetail);
      }).catch(function(){ sndErr(); toast(L('재매칭 실패 — 네트워크를 확인하세요','Error de red')); });
    }
    function wireCloseBtn(label){
      b.innerHTML+=noteChain
        +'<div class="row"><input type="password" id="pin" placeholder="'+L('디렉터 PIN','PIN director')+'" style="width:130px"><button class="btn o" id="btnClose">'+label+'</button></div>';
      $('btnClose').addEventListener('click',function(){
        if(!$('pin').value){ toast(L('디렉터 PIN을 입력하세요','Ingrese el PIN del director')); return; }
        $('btnClose').disabled=true;
        api('/api/inbound/'+SHIP+'/close',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})}).then(function(o){
          if(!o.ok||o.body.error){
            var em={bad_pin:L('PIN이 올바르지 않습니다','PIN incorrecto'),no_checked:L('검수 확정된 팔렛이 없습니다','Sin pallets verificados'),nothing_new:L('새로 반영할 팔렛이 없습니다','Nada nuevo')}[o.body.error];
            toast('⚠ '+(em||L('마감 실패','Error')+': '+(o.body.error||o.status))); $('btnClose').disabled=false; return;
          }
          lastCloseRes=o.body; sndSaved();
          toast('✔ '+L('입고 반영 — 팔렛 '+o.body.pallets_received+' · 재고 +'+fmt(o.body.stock_applied)+'EA · 구매 '+o.body.po_lines_updated+'라인','Recibido — stock +'+fmt(o.body.stock_applied)));
          if((o.body.unmatched||[]).length||(o.body.unregistered||[]).length){ sndWarn(); toast('⚠ '+L('일부 SKU 미반영 — 마감 탭의 경고를 확인하세요','Algunos SKU no aplicados — vea el aviso')); }
          refreshDetail(renderDetail);
        }).catch(function(){ sndErr(); toast(L('마감 실패 — 네트워크를 확인하세요','Error de red')); var bc=$('btnClose'); if(bc) bc.disabled=false; });
      });
    }
    if(closed){
      b.innerHTML+='<div class="note green" style="margin-top:12px">✔ '+L('입고 완료 — 실재고·구매 반영됨. 원가는 수입원가 승인에서(수량 이중 반영 없음). <b>적치는 계속 진행할 수 있습니다</b>.','Cerrado — stock y compras aplicados. <b>El acomodo puede continuar</b>.')+'</div>';
      if(pend.length) wireCloseBtn('➕ '+L('추가 입고 반영','Recibir adicionales')+' ('+pend.length+L('팔렛',' pallets')+')');
    } else {
      b.innerHTML+=(allChecked
          ?'<div class="note green" style="margin-top:12px">✔ '+L('<b>모든 팔렛 검수 완료 — 지금 바로 입고할 수 있습니다.</b> 적치를 기다릴 필요 없습니다: 입고하면 실재고가 바로 늘어나 판매 대응이 가능하고, 적치는 그대로 계속하면 됩니다.','<b>Todo verificado — puede cerrar ahora.</b> El acomodo continúa después.')+'</div>'
          :'<div class="note" style="margin-top:12px">⚠ '+L('미검수 팔렛 '+(st.N-ck.length)+'개는 이번 입고에서 <b>제외</b>됩니다. 나중에 검수를 마치면 [추가 입고 반영]으로 이어서 반영할 수 있습니다.','Los pallets sin verificar quedan <b>fuera</b>; podrá recibirlos después.')+'</div>');
      wireCloseBtn('🔒 '+L('입고 확정 (마감)','Cerrar recepción'));
    }
  }

  /* ============ 자동 갱신(25초) ============
     · 스캔 중(검수 잠금)·적치 미저장·저장 중·탭 비활성·PIN 입력 중이면 건너뛴다.
     · 데이터 서명이 바뀔 때만 다시 그린다(깜빡임·포커스 유실 방지).
     · 팔렛을 잡고 있으면 같은 주기로 점유 하트비트를 보낸다. */
  function sigList(items){
    try{ return JSON.stringify((items||[]).map(function(s){
      return [s.id,s.status,s.pallets,s.pallets_checked,s.cartons,s.qty,s.eta,s.invoice_no]; })); }catch(e){ return ''; }
  }
  function sigDetail(b){
    try{ return JSON.stringify([b.shipment,(b.pallets||[]).map(function(p){
      return [p.id,p.status,p.checked_at?1:0,p.working?1:0,p.working_by||0,p.working_step||'',
        (p.items||[]).map(function(i){ return [i.id,i.scanned_cartons,i.put_cartons,i.rack||'']; })]; })]); }catch(e){ return ''; }
  }
  function pollBlocked(){
    if(pollBusy) return true;
    try{ if(document.hidden) return true; }catch(e){}
    if(document.querySelector('.delrow')) return true;      // 삭제 PIN 입력 중
    if(VIEW==='upload') return true;                        // 업로드/미리보기 중
    if(VIEW==='detail'){
      if(selPal!=null) return true;                         // 검수 진행 중(팔렛 잡고 스캔)
      if(putSaving||putPending()) return true;              // 적치 미저장분 있음
      var el=document.activeElement;
      if(el&&el.tagName==='INPUT'&&el.value) return true;    // 입력 중
    }
    return false;
  }
  function pollTick(){
    if(WORK_PID&&VIEW==='detail'&&SHIP) pingWorking(WORK_PID,WORK_STEP);   // 하트비트는 항상
    if(pollBlocked()) return;
    pollBusy=true;
    if(VIEW==='list'){
      api('/api/inbound').then(function(o){
        pollBusy=false;
        if(!o.ok||!o.body.items) return;
        var sg=sigList(o.body.items);
        if(sg===pollSig) return;
        pollSig=sg; if(VIEW==='list'&&!pollBlocked()) loadList();
      });
      return;
    }
    if(VIEW==='detail'&&SHIP){
      api('/api/inbound/'+SHIP).then(function(o){
        pollBusy=false;
        if(!o.ok||o.body.error) return;
        var sg=sigDetail(o.body);
        if(sg===pollSig) return;
        if(pollBlocked()) return;                            // 그 사이 스캔이 시작됐으면 다음 주기로
        pollSig=sg; DETAIL=o.body;
        var keepFocus=(document.activeElement&&document.activeElement.tagName==='INPUT');
        renderDetail();               // 헤더 단계 카운터까지 반영. STEP·putPal·putRack 은 모듈 변수라 유지된다
        if(keepFocus){ var f=$('putIn')||$('scanIn')||$('putListIn'); if(f) f.focus(); }
      });
      return;
    }
    pollBusy=false;
  }
  function startPoll(){ if(pollT) clearInterval(pollT); pollT=setInterval(pollTick,POLL_MS); }

  /* ===== PDA 컴팩트 모드(2026-08-26) — 현장 스캐너 화면에서 리딩 결과가 안 보이던 문제 =====
     상단 고정 헤더(#rnav)가 좁은 폭에서 여러 줄로 접히며 본문을 크게 밀어내, 스캔 결과 박스가 화면 밖으로 나갔다.
     · 켜짐: 화면 폭 <=640px 자동, 또는 우하단 토글 버튼(선택은 localStorage 'wh_pda' 에 기억 — 자동보다 우선)
     · 동작: 상단 고정 영역을 한 줄로 축소 + 페이지/선적 헤더 압축 + .scanstick(스캔결과·입력칸) 을 헤더 아래 고정
     · --navh: 고정 헤더의 실제 높이. .scanstick 의 sticky top 이 이 값을 쓴다(헤더가 접히면 함께 줄어든다). */
  var PDA=(function(){ try{ var v=localStorage.getItem('wh_pda'); if(v==='1'||v==='0') return v; }catch(e){} return null; })();
  var pdaLast=null;
  function pdaAuto(){ try{ return window.innerWidth<=640; }catch(e){ return false; } }
  function pdaOn(){ return (PDA==null)?pdaAuto():(PDA==='1'); }
  function syncNavH(){
    var el=document.getElementById('rnav');
    var h=(el&&el.offsetHeight)||40;
    try{ document.documentElement.style.setProperty('--navh',h+'px'); }catch(e){}
  }
  function pdaApply(){
    var on=pdaOn(), changed=(pdaLast!==on); pdaLast=on;
    document.body.classList.toggle('pda',on);
    // 헤더 높이가 바뀌었으므로 nav.js 의 syncOffset(본문 padding-top)을 다시 돌린다.
    // (changed 일 때만 → 우리 resize 리스너와 무한 루프가 생기지 않는다)
    if(changed){ try{ window.dispatchEvent(new Event('resize')); }catch(e){} }
    syncNavH(); setTimeout(syncNavH,60); setTimeout(syncNavH,340);   // nav 비동기 재렌더 후 재보정
    var b=$('pdaBtn');
    if(b){
      b.textContent=on?('⤢ '+L('전체보기','Vista completa')):('📱 '+L('스캔모드','Modo escáner'));
      b.title=on?L('일반 화면으로 — 상단 메뉴를 모두 보이게','Vista normal — mostrar todo el menú')
                :L('PDA 화면 — 상단을 접고 스캔 결과를 고정','Modo PDA — menú compacto y lectura fija');
    }
  }
  function pdaInit(){
    var b=document.createElement('button');
    b.id='pdaBtn'; b.type='button'; b.className='pdabtn';
    b.addEventListener('click',function(){
      PDA=pdaOn()?'0':'1';
      try{ localStorage.setItem('wh_pda',PDA); }catch(e){}
      pdaApply();
      var f=$('scanIn')||$('putIn'); if(f) f.focus();   // 스캔 중이면 포커스를 잃지 않는다
    });
    var hd=document.querySelector('header');
    if(hd) hd.appendChild(b); else document.body.appendChild(b);
    pdaApply();
    window.addEventListener('resize',pdaApply);
    window.addEventListener('hashchange',function(){ setTimeout(syncNavH,80); });
    // 헤더는 로그인·권한 조회 후 비동기로 그려진다 → 실제 높이를 추적
    try{
      if(window.ResizeObserver){
        var t=setInterval(function(){
          var el=document.getElementById('rnav'); if(!el) return;
          clearInterval(t); new ResizeObserver(syncNavH).observe(el);
        },200);
        setTimeout(function(){ clearInterval(t); },10000);
      }
    }catch(e){}
  }

  /* ============ 시작 ============ */
  pdaInit();
  loadList();
  startPoll();
  try{ window.addEventListener('beforeunload',function(){ clearWorking(); }); }catch(e){}
})();
</script>
</body>
</html>
