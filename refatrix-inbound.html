<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refatrix · 수입 입고 Recepción · build 20260827reg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{--paper:#F4F1EA;--card:#FFFFFF;--ink:#1C1B19;--muted:#6F6A60;--line:#E2DCCF;--steel:#52708A;--steel-d:#33495C;--gold:#B8893B;--red:#C0533B;--green:#3E7D5A;--radius:16px;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:15px;line-height:1.5}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  .wrap{max-width:1080px;margin:0 auto;padding:0 14px 60px}
  header{padding:16px 0 6px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .sub{color:var(--muted);font-size:12.5px}
  .langbtn{margin-left:auto;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:5px 11px;font-size:12.5px;cursor:pointer;font-family:inherit}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px;margin-bottom:13px}
  .card h2{font-size:15px;margin:0 0 10px}
  .hint{color:var(--muted);font-size:12.5px;margin:0 0 9px}
  .btn{background:var(--steel);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.g{background:var(--green)} .btn.o{background:var(--gold)} .btn.r{background:var(--red)}
  .btn.ghost{background:var(--card);color:var(--steel-d);border:1.5px solid var(--line)}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--line);color:var(--steel-d)}
  .tag.g{background:#DCEDE4;color:var(--green)} .tag.o{background:#F7E9CD;color:#8A6420}
  .tag.r{background:#F7DED8;color:var(--red)} .tag.s{background:#E1E9F0;color:var(--steel-d)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:9px 11px}
  .kpi .l{font-size:11px;color:var(--muted)} .kpi .v{font-size:19px;font-weight:700;letter-spacing:-.5px}
  .kpi .v small{font-size:11px;color:var(--muted);font-weight:500}
  /* 선적 목록 */
  .ship{border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;cursor:pointer;transition:.12s;margin-bottom:8px}
  .ship:hover{border-color:var(--steel)}
  .ship .t{font-weight:700;font-size:15px} .ship .d{color:var(--muted);font-size:12px;margin-top:1px}
  .ship .pr{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
  .ship .pr i{display:block;height:100%;background:var(--green);width:0}
  /* 업로드 */
  .drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;background:var(--paper);cursor:pointer}
  .drop:hover,.drop.over{border-color:var(--steel);background:#EFF3F7}
  .drop .ic{font-size:30px} .drop .t{font-weight:700;margin-top:5px}
  .field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .field label{font-size:12.5px;font-weight:700;color:var(--steel-d)}
  input[type=date],input[type=text],input[type=password]{font-family:inherit;padding:9px 11px;border:2px solid var(--gold);border-radius:10px;font-size:14px;background:#fff}
  .vrow{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
  .vrow:last-child{border-bottom:0}
  .vbox{border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-top:10px}
  /* 단계 탭 */
  .steps{display:flex;gap:5px;margin:12px 0 14px;flex-wrap:wrap}
  .step{flex:1;min-width:96px;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:8px 10px;cursor:pointer;text-align:center;font-family:inherit;color:var(--ink)}
  .step.on{background:var(--steel);border-color:var(--steel);color:#fff}
  .step .t{font-weight:700;font-size:13px} .step .m{font-size:10.5px;opacity:.75}
  /* 팔렛 그리드 */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:7px}
  .pal{border:1.5px solid var(--line);border-radius:11px;padding:8px 9px;background:var(--card);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
  .pal:hover{border-color:var(--steel)}
  .pal .o{font-size:11px;color:var(--muted);font-weight:700} .pal .p{font-weight:700;font-size:14px}
  .pal .d{font-size:10.5px;color:var(--muted);line-height:1.35}
  .pal .bar{height:4px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
  .pal .bar i{display:block;height:100%;background:var(--green);width:0}
  .pal.st-wait{opacity:.6} .pal.st-unloaded{border-color:var(--gold);background:#FDF8EE}
  .pal.st-checking{border-color:var(--steel);background:#EFF3F7} .pal.st-checked{border-color:var(--green);background:#F0F7F3}
  .pal.st-done{border-color:var(--green);background:var(--green);color:#fff}
  .pal.st-done .o,.pal.st-done .d{color:rgba(255,255,255,.82)}
  /* 인보이스(ORDER NO)별 묶음 — 번호는 머리글에 한 번만, 카드에는 팔렛 번호만 */
  .pgrp{border:1.5px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--card)}
  .pgrp>.gh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 11px;background:var(--paper);border-bottom:1px solid var(--line)}
  .pgrp>.gh .gn{font-weight:700;font-size:14px;letter-spacing:-.2px;word-break:break-all;display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
  /* PO번호 — 고정 접두(100RA)는 작게 붙이고, 그 뒤 실제 PO번호는 크게·자간 넓게 */
  .gn .pfx{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:0}
  .gn .po{font-size:29px;font-weight:700;letter-spacing:.16em;line-height:1.05;color:var(--ink);margin-right:-.16em}
  .gn .po.plain{letter-spacing:.08em;font-size:22px}
  .pgrp>.gh .gd{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pgrp>.gh .ga{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .pgrp>.gb{padding:9px}
  .gsel{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--steel-d);font-weight:700;cursor:pointer;white-space:nowrap}
  .pal{position:relative}
  .pal .ptop{display:flex;align-items:center;justify-content:space-between;min-height:20px;margin:-2px -1px 1px}
  .pal .pn{font-size:23px;font-weight:700;letter-spacing:-1px;line-height:1.1}
  .pal .pn small{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:0;vertical-align:2px}
  .pal.st-done .pn small{color:rgba(255,255,255,.8)}
  .pal .undo{border:1px solid var(--line);background:var(--card);color:var(--steel-d);
    border-radius:8px;font-size:12px;font-family:inherit;line-height:1;padding:4px 7px;cursor:pointer}
  .pal .undo:hover{border-color:var(--red);color:var(--red)}
  .pal .pck{width:17px;height:17px;accent-color:var(--red);cursor:pointer;margin:0}
  .pal.sel{border-color:var(--red);background:#FDF3F1;box-shadow:0 0 0 2px rgba(192,83,59,.14)}
  /* 패킹리스트 보기 창 링크 */
  .flnk{color:var(--steel-d);text-decoration:none;border-bottom:1px dotted var(--line)}
  .flnk:hover{color:var(--steel)}
  /* 점유 표시(다른 작업자가 잡고 있는 팔렛) */
  .wchip{display:inline-block;margin-top:4px;font-size:10.5px;font-weight:700;background:#F7E9CD;color:#8A6420;
    border-radius:7px;padding:2px 6px;white-space:nowrap}
  /* 적치 — 대기 팔렛 줄 / 작업 랙 배너 */
  .ppal{border:1.5px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;margin-bottom:8px;
    display:flex;gap:12px;align-items:center;flex-wrap:wrap;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
  .ppal:hover{border-color:var(--steel)}
  .ppal.done{opacity:.6;border-color:var(--green);background:#F4FAF6;cursor:default}
  .ppal .who{min-width:140px}
  .ppal .po{font-size:11px;color:var(--muted);font-weight:700}
  .ppal .pl{font-size:15px;font-weight:700}
  .ppal .zs{display:flex;gap:5px;flex-wrap:wrap}
  .zchip{font-size:12px;font-weight:700;border-radius:8px;padding:3px 9px;background:#E1E9F0;color:var(--steel-d)}
  .zchip.n{background:#F7E9CD;color:#8A6420}
  .ppal .num2{font-size:12px;color:var(--muted)} .ppal .num2 b{color:var(--ink);font-size:14px}
  .ppal .rt{margin-left:auto;display:flex;gap:8px;align-items:center}
  .ppal .pb{width:96px;height:6px;background:var(--line);border-radius:4px;overflow:hidden}
  .ppal .pb i{display:block;height:100%;background:var(--green)}
  .racklock{background:var(--steel);color:#fff;border-radius:12px;padding:10px 13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .racklock .k{font-size:11px;opacity:.85;font-weight:700}
  .racklock .v{font-size:26px;font-weight:700;letter-spacing:.08em;line-height:1}
  .racklock .r2{margin-left:auto;font-size:12.5px;opacity:.95}
  .rackbig{background:var(--steel);color:#fff;border-radius:11px;padding:7px 15px;font-weight:700;font-size:26px;letter-spacing:.06em}
  .rackbig.n{background:var(--gold)}
  .cnt{font-size:30px;font-weight:700;letter-spacing:-1px}
  .cnt small{font-size:13px;color:var(--muted);font-weight:500}
  .step2{background:#EFF3F7;border-left:3px solid var(--steel);padding:7px 11px;border-radius:0 9px 9px 0;font-size:12px;color:var(--steel-d);margin:0 0 10px}
  .bigwarn{background:#FDF3F1;border:1.5px solid var(--red);color:var(--red);border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:13px}
  .bigwarn b{font-size:14.5px}
  /* 스캔 */
  .scanbox{border:2px solid var(--line);border-radius:14px;padding:14px;min-height:120px;display:flex;flex-direction:column;justify-content:center;background:var(--card)}
  .scanbox.ok{border-color:var(--green);background:#F3F9F5} .scanbox.warn{border-color:var(--red);background:#FDF3F1}
  .scanbox .sku{font-size:25px;font-weight:700;letter-spacing:-.8px} .scanbox .nm{color:var(--muted);font-size:12px}
  .scanbox .z{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .zone{background:var(--steel);color:#fff;border-radius:10px;padding:6px 13px;font-weight:700;font-size:17px}
  .zone.new{background:var(--gold)}
  /* 목적지 존(존 이동용 임시 팔렛) — 작업자가 이 숫자만 보고 박스를 옮긴다 */
  .zbig{display:flex;align-items:center;gap:12px;margin-top:10px;padding:11px 13px;border-radius:12px;
        background:#EAF0F6;border:2px solid var(--steel)}
  .zbig .n{display:flex;align-items:center;justify-content:center;min-width:58px;height:52px;border-radius:11px;
           background:var(--steel);color:#fff;font-size:30px;font-weight:800;letter-spacing:-1px}
  .zbig .t{font-size:12px;color:var(--muted);font-weight:700}
  .zbig .v{font-size:19px;font-weight:800;line-height:1.2}
  .zbig.z1{background:#EAF1F7;border-color:#2E6F9E} .zbig.z1 .n{background:#2E6F9E}
  .zbig.z2{background:#E7F1EC;border-color:#0F6E56} .zbig.z2 .n{background:#0F6E56}
  .zbig.z3{background:#F8F1E3;border-color:#9A6512} .zbig.z3 .n{background:#9A6512}
  .zbig.z4{background:#F0EBF8;border-color:#6B4FB0} .zbig.z4 .n{background:#6B4FB0}
  .zbig.none{background:#FDF3F1;border-color:var(--red)} .zbig.none .n{background:var(--red);font-size:22px}
  .zchip2{display:inline-block;min-width:17px;text-align:center;border-radius:5px;color:#fff;font-size:10.5px;
          font-weight:800;padding:1px 5px;margin-left:4px}
  .zchip2.z1{background:#2E6F9E}.zchip2.z2{background:#0F6E56}.zchip2.z3{background:#9A6512}.zchip2.z4{background:#6B4FB0}
  .zchip2.none{background:#C0533B}
  .idle{color:var(--muted);text-align:center;font-size:13px}
  /* 검수 팔렛 선택 칩 — 스캔 대기 없이 탭으로 바로 시작 */
  .palpick{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 2px}
  .palpick .pchip{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:10px;
    padding:7px 12px;background:var(--card);cursor:pointer;font-size:13px;font-weight:700}
  .palpick .pchip:hover{border-color:var(--steel)}
  .palpick .pchip .n{background:var(--steel);color:#fff;border-radius:7px;padding:2px 8px;font-size:14px}
  .palpick .pchip small{color:var(--muted);font-weight:500}
  .palpick .pchip.cand{border-color:#8A6300;background:#FDF8EE}
  .locked{background:var(--green);color:#fff;border-radius:11px;padding:10px 12px;margin-bottom:10px}
  .locked .a{font-size:11px;opacity:.85;font-weight:700} .locked .b{font-size:16px;font-weight:700}
  .locked .c{font-size:11.5px;opacity:.9}
  .scaninput{display:flex;gap:8px;margin-top:10px}
  .scaninput input{flex:1;border-color:var(--steel)}
  .pbar{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:9px 0 5px}
  .pbar i{display:block;height:100%;background:var(--green);width:0}
  .skulist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:11px}
  .skurow{display:flex;gap:8px;padding:6px 9px;border-bottom:1px solid var(--line);font-size:12px;align-items:center}
  .skurow:last-child{border-bottom:0} .skurow.done{background:#F2F8F4}
  .skurow .s{font-weight:700;min-width:60px} .skurow .z2{font-size:10px;font-weight:700;color:var(--steel-d);background:var(--line);border-radius:6px;padding:1px 5px}
  .skurow .c{margin-left:auto;font-weight:700;white-space:nowrap}.skurow .c.ok{color:var(--green)}
  .carts{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
  .cart{border:1.5px solid var(--line);border-radius:11px;padding:10px;background:var(--card);cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
  .cart:hover{border-color:var(--steel)} .cart.on{border-color:var(--steel);background:#EFF3F7} .cart.empty{opacity:.4;cursor:default}
  .cart .zn{font-size:21px;font-weight:700} .cart .cd{font-size:11.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)} th{font-size:11px;color:var(--muted);background:var(--paper);position:sticky;top:0}
  td.num,th.num{text-align:right}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:11px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60}
  .toast.on{opacity:1}
  .hidden{display:none}
  .note{background:#EFF3F7;border-left:3px solid var(--steel);padding:8px 11px;border-radius:0 9px 9px 0;font-size:12px;color:var(--steel-d);margin:9px 0}
  .note.green{background:#F0F7F3;border-left-color:var(--green);color:#2C5C42}

  /* ===== PDA 컴팩트 모드(2026-08-26) — 현장 스캐너 화면(작은 폭)에서 "리딩 결과"를 항상 보이게 =====
     문제: 상단 고정 헤더(#rnav 바+하위메뉴, 좁은 폭에서 여러 줄로 접힘)가 body padding-top 을 크게 잡고,
           그 아래 페이지 헤더·선적 헤더·단계 버튼까지 쌓여서 스캔 결과 박스(#scanres/#putres)가 화면 밖으로 밀림.
     해결: ① 상단 고정 영역을 한 줄(약 40px)로 축소 ② 페이지/선적 헤더를 압축
           ③ 스캔 결과 + 입력칸 + 진행줄을 .scanstick 으로 묶어 헤더 바로 아래에 sticky 고정.
     켜짐 조건: 화면 폭 <=640px 자동, 또는 우하단 토글 버튼(localStorage wh_pda 로 기억). */
  .scanstick{}                                   /* 일반 모드에서는 아무 효과 없음 */
  /* 토글은 페이지 헤더 안(🌐 옆) — 화면 위에 떠서 [적치 저장] 같은 버튼을 가리지 않게 한다 */
  .pdabtn{background:var(--steel);color:#fff;border:0;border-radius:9px;padding:5px 11px;
    font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;line-height:1.15;white-space:nowrap}
  .pdabtn:active{filter:brightness(1.12)}
  body.pda .pdabtn{padding:3px 9px;font-size:11px}
  /* — 상단 고정 영역 축소 (nav.js 가 주입하는 #rnav 를 덮어쓴다. nav 뒤에 로드되므로 !important 로 확정) — */
  body.pda #rnav .rsub{display:none!important}
  body.pda #rnav .rbar{height:40px!important;padding:0 6px!important}
  body.pda #rnav .rlogo,body.pda #rnav .rwho,body.pda #rnav .rpres{display:none!important}
  body.pda #rnav .rhome{width:26px!important;height:26px!important;margin-right:3px!important;font-size:13px!important}
  body.pda #rnav .rg{padding:12px 8px!important;font-size:11.5px!important}
  body.pda #rnav .rlogout{margin-left:6px!important;padding:4px 9px!important;font-size:10px!important}
  /* — 페이지·선적 헤더 압축 — */
  body.pda .wrap{padding:0 8px 44px}
  body.pda header{padding:4px 0 0}
  body.pda header h1{font-size:13px}
  body.pda header .sub{display:none}
  body.pda .langbtn{padding:3px 8px;font-size:11px}
  body.pda .card{padding:8px;border-radius:11px;margin-bottom:8px}
  body.pda .card h2{font-size:13px;margin:0 0 4px}
  body.pda .dhint{display:none}                  /* 선적 ETA·첨부 줄 — 스캔 중에는 불필요 */
  body.pda .steps{margin:6px 0 7px;gap:4px}
  body.pda .step{min-width:0;padding:5px 3px}
  body.pda .step .t{font-size:11.5px} body.pda .step .m{font-size:9.5px}
  /* — 스캔 결과·입력칸을 헤더 바로 아래에 고정 — */
  body.pda .scanstick{position:sticky;top:var(--navh,40px);z-index:40;background:var(--card);
    margin:0 -8px 7px;padding:6px 8px 8px;border-bottom:1.5px solid var(--line);
    box-shadow:0 9px 13px -11px rgba(0,0,0,.6);max-height:70vh;overflow:auto}

<script>
(function(){
  function sess(){

    try{ var h=location.hash.slice(1); if(h){ var p=new URLSearchParams(h); var t=p.get('token'); if(t) return {token:t,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')}; } }catch(e){}

  try{ console.log('[refatrix-inbound] build '+BUILD+' user="'+((S&&S.user&&S.user.name)||'')+'" role='+((S&&S.user&&S.user.role)||'')); }catch(e){}
  var LANG=(function(){ try{ var l=localStorage.getItem('wh_lang'); if(l==='es'||l==='ko') return l; }catch(e){} return (S&&S.user&&S.user.role==='warehouse')?'es':'ko'; })();

  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var toastT; function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},1900);}
  /* ===== 스캔 소리 알림(2026-08-17) — 스캐너 자체 삑소리와 별개로, 시스템이 "결과"를 소리로 알린다.
     ✔ 등록음(2음 상승)  = 스캔이 정상 집계됨 → 바로 다음 박스 스캔 가능
     ✔ 저장음(3음 상승)  = 서버 저장 완료(검수완료·적치저장)
     ⚠ 주의음(하강 1음)  = 집계는 됐지만 확인 필요(소입수 불일치·존/랙 미지정·후보 대기)
     ✖ 오류음(저음 2회)  = 차단됨 — 집계 안 됨(미등록·초과·불일치·저장 실패)
     · 안내음(단음)      = 위치 안내·랙 잠금 등 정보성 확인 */
  var AC=null;
  function tone(freq,dur,delay,type,vol){
    try{
      var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx) return;
      if(!AC) AC=new Ctx();
      if(AC.state==='suspended'&&AC.resume) AC.resume();
      var t0=AC.currentTime+(delay||0)/1000;
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.value=freq;
      g.gain.setValueAtTime(vol||0.28,t0);
      g.gain.exponentialRampToValueAtTime(0.001,t0+dur/1000);
      o.connect(g); g.connect(AC.destination);
      o.start(t0); o.stop(t0+dur/1000+0.02);
    }catch(e){}
  }
  function sndOk(){ tone(1175,70,0); tone(1568,90,85); }                       // 삐빅↑ 등록됨
  function sndSaved(){ tone(784,90,0); tone(988,90,100); tone(1319,140,200); } // 따라란↑ 저장됨
  function sndWarn(){ tone(660,110,0,'triangle'); tone(440,220,110,'triangle'); } // 뚜-웅↓ 확인 필요
  function sndErr(){ tone(196,160,0,'square',0.2); tone(196,200,220,'square',0.2); } // 뻑뻑 차단
  function sndInfo(){ tone(880,80,0); }                                        // 안내

  /* ===== 스캔 위생(2026-08-17) — 스캐너가 한 번에 코드를 2개 이상 읽는 현장 대응 =====
     · 같은 코드가 DUP_MS 안에 또 들어오면 이중 리딩 → 조용히 무시(카운트 중복 방지)
     · 정상 집계 직후 GRACE_MS(0.4초) 안에 들어온 "모르는 코드"는 카톤에 같이 붙은 부속 바코드(EAN 등) → 조용히 무시
     · 그 외 모르는 코드도 GRACE_MS 만큼 기다렸다가 오류 표시 — 그 사이 정상 코드가 오면 취소(순서 뒤바뀜 대응) */
  var DUP_MS=450, GRACE_MS=400;   // 한 트리거의 다중/재전송 리딩은 보통 50~300ms 간격 — 정상 연속 스캔(다음 박스 조준까지 0.7초+)은 걸리지 않는 선
  var dupCode='', dupAt=0, lastGoodAt=0;
  var dupWarned=false;
  function dupScan(norm){
    var now=Date.now();
    if(norm && norm===dupCode && (now-dupAt)<DUP_MS){
      dupAt=now;                                   // ★ 연쇄 차단: 같은 라벨이 계속 보이는 동안(자동 모드·트리거 유지)
      if(!dupWarned){ dupWarned=true;              //    몇 번을 다시 읽어도 1회만 집계. 경고는 연쇄당 1번만.
        sndWarn(); toast('⚠ '+L('중복 리딩 — 집계하지 않았습니다','Lectura duplicada — no contada')); }
      logScan(norm,L('중복 무시','duplicado'));
      return true;
    }
    dupCode=norm; dupAt=now; dupWarned=false; return false;
  }
  /* 스캔 이력(최근 50건) — "수량이 안 맞는" 원인을 현장에서 바로 확인하는 용도 */
  var scanLog=[];
  function logScan(code,res){
    scanLog.unshift({at:new Date(),code:String(code||''),res:res});
    if(scanLog.length>50) scanLog.pop();
    var el=$('slogbox'); if(el&&el.style.display!=='none') renderScanLog();
  }
  function renderScanLog(){
    var el=$('slogbox'); if(!el) return;
    if(!scanLog.length){ el.innerHTML='<div class="idle" style="padding:8px">'+L('아직 스캔 이력이 없습니다','Sin lecturas aún')+'</div>'; return; }
    el.innerHTML='<table style="width:100%;border-collapse:collapse;font-size:11.5px">'
      +scanLog.map(function(e){
        var t=e.at, hh=('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)+':'+('0'+t.getSeconds()).slice(-2);
        var red=/중복|초과|오류|없|duplicado|más|no /.test(e.res);
        return '<tr><td style="padding:2px 6px;color:var(--muted);white-space:nowrap">'+hh+'</td>'
          +'<td class="mono" style="padding:2px 6px">'+esc(e.code)+'</td>'
          +'<td style="padding:2px 6px;font-weight:700;color:'+(red?'var(--red)':'var(--green)')+'">'+esc(e.res)+'</td></tr>';
      }).join('')+'</table>';
  }
  function goodScanMark(){ lastGoodAt=Date.now(); }
  // 숫자만 8자리 이상 = 상품 EAN 등 부속 바코드로 간주(랙 번호에는 글자가 있음)
  function looksCompanion(code){ return !/[A-Za-z]/.test(String(code||'')) && /^\d{8,}$/.test(bare(code)); }
  /* ===== 스캐너 입력 보정 =====
     스캐너는 US 자판 키코드를 흘려보내는데 현장 PC 자판은 스페인어(라틴아메리카)라
     바코드의 `-` 가 `'` 로 들어온다. 변종 따옴표(’ ‘ ´ ` ʼ)까지 모두 `-` 로 되돌린다.
     그래도 남는 자판 불일치(`/` → `-` 등)에 대비해, 최종 매칭은 구분자를 전부 무시하는
     bare() 비교를 폴백으로 둔다. A'01'03 = A-01-03 = A/01/03 = A0103 모두 같은 코드로 본다. */
  var QUOTE_RE=/['‘’´`ʼ]/g;
  function normScan(v){
    return String(v||'')
      .replace(/[\u0000-\u001f\u007f]/g,'')   // 스캐너 접미사(CR/LF/TAB) 잔여 제거
      .replace(QUOTE_RE,'-')                  // ' ’ ‘ ´ ` ʼ → -
      .replace(/\s+/g,'')                     // 공백 제거(코드에 공백 없음)
      .toUpperCase();
  }
  function bare(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }  // 구분자 무시 비교키
  function bareEq(a,b){ var x=bare(a); return !!x && x===bare(b); }
  // 코드에 해당하는 패킹리스트 "라인들" — 같은 SKU 가 여러 라인(카톤 묶음)일 수 있다(2026-08-17 라인별 저장).
  // 정확히 일치가 하나라도 있으면 그 집합, 없으면 구분자 무시 매칭 집합.
  function linesFor(items,code){
    if(!items||!items.length||!code) return [];
    var ex=items.filter(function(i){return i.code===code;});
    if(ex.length) return ex;
    var b=bare(code); if(!b) return [];
    return items.filter(function(i){return bare(i.code)===b;});
  }
  function findItem(items,code){ return linesFor(items,code)[0]||null; }
  // 스캔 1건을 배정할 라인 고르기 — ① 여유가 있는 라인 중 소입수량(qty÷cartons)이 라벨과 같은 라인
  //   ② 아니면 여유 있는 첫 라인(파일 순서) ③ 전부 찼으면 첫 라인(초과 경고용, full 표시)
  function pickLine(items,code,lblQty,roomFn){
    var ls=linesFor(items,code);
    if(!ls.length) return null;
    var open=ls.filter(function(i){return roomFn(i)>0;});
    if(!open.length) return {it:ls[0],full:true};
    if(lblQty){ var m=open.filter(function(i){return perCarton(i)===lblQty;})[0]; if(m) return {it:m,full:false}; }
    return {it:open[0],full:false};
  }
  // 라인 표식: 패킹리스트의 카톤 번호 범위(#12–31). 같은 SKU 라인 구분에 쓴다.
  function lineTag(i){
    if(i&&i.box_from!=null&&i.box_to!=null) return '#'+i.box_from+(i.box_to!==i.box_from?'–'+i.box_to:'');
    return '';
  }
  /* ===== 카톤 라벨 파서 =====
     현장 카톤 라벨(Code-128)은 `CTR-<제품번호>-<카톤 소입수량>` 형태다.
       CTR-CE0796-16  →  제품번호 CE0796 · 소입수량 16 EA
     라벨 변형(접두어 없음 / 수량 없음 / 제품번호에 하이픈)에 견디도록 후보를 순서대로 만들고,
     패킹리스트에 실제로 존재하는 제품번호를 고른다. 아무것도 안 맞으면 1순위 해석을 그대로
     돌려줘서 실패 메시지에 "무엇으로 읽었는지"가 보이게 한다. */
  var LABEL_PREFIX=/^(CTR|SYD)-?(.+)$/;        // 접두어(항상 CTR-, SYD 는 방어적)
  var LABEL_QTY=/^(.*[A-Z0-9])-(\d{1,6})$/;    // 뒤쪽 -숫자 = 소입수량
  function findAnyItem(code){
    if(!code||!DETAIL||!DETAIL.pallets) return null;
    for(var i=0;i<DETAIL.pallets.length;i++){ var it=findItem(DETAIL.pallets[i].items,code); if(it) return it; }
    return null;
  }
  function parseLabel(v){
    var norm=normScan(v), cands=[], m, body=norm, pre='';
    if(!norm) return {raw:'',norm:'',code:'',qty:0,prefix:'',matched:false};
    m=norm.match(LABEL_PREFIX); if(m){ pre=m[1]; body=m[2]; }
    m=body.match(LABEL_QTY); if(m) cands.push({code:m[1],qty:+m[2],prefix:pre});   // ① 접두어 제거 + 수량 분리
    cands.push({code:body,qty:0,prefix:pre});                                      // ② 접두어만 제거
    if(pre){
      m=norm.match(LABEL_QTY); if(m) cands.push({code:m[1],qty:+m[2],prefix:''});   // ③ 접두어를 코드로 취급
      cands.push({code:norm,qty:0,prefix:''});                                      // ④ 원문 그대로
    }
    for(var i=0;i<cands.length;i++){
      var it=findAnyItem(cands[i].code);
      if(it){ return {raw:String(v==null?'':v),norm:norm,code:it.code,qty:cands[i].qty,prefix:cands[i].prefix,matched:true}; }
    }
    /* 아무것도 안 맞았을 때 무엇으로 읽었다고 보고할지 —
       CTR- 접두어가 있으면 라벨 포맷을 신뢰해 제품번호/수량으로 분해한 값을,
       접두어가 없으면(랙 라벨 등) 뒤쪽 숫자를 수량으로 단정하지 않고 원문을 그대로 돌려준다. */
    var f=pre?(cands[0]||{code:body,qty:0,prefix:pre}):{code:norm,qty:0,prefix:''};
    return {raw:String(v==null?'':v),norm:norm,code:f.code,qty:f.qty,prefix:f.prefix,matched:false};
  }
  function perCarton(i){ return (i&&i.cartons)?Math.round((i.qty||0)/i.cartons):0; }   // 패킹리스트 기준 카톤당 수량
  // 라벨 소입수량 ↔ 패킹리스트 카톤당 수량 대사(표시용)
  function qtyMismatch(it,lblQty){
    var exp=perCarton(it);
    if(!lblQty||!exp||lblQty===exp) return null;
    return {exp:exp,got:lblQty};
  }
  // 입력칸 실시간 보정 — 스캔/타이핑 중에도 화면에 바로 `-` 로 보이게 한다
  function liveNorm(el){
    if(!el) return el;
    el.addEventListener('input',function(){
      var v=el.value, n=v.replace(QUOTE_RE,'-').toUpperCase();
      if(n!==v){ var p=el.selectionStart; el.value=n; try{ el.setSelectionRange(p,p); }catch(e){} }
    });
    return el;
  }
  var scanRaw='';                              // 직전 스캔의 수신 원문(진단 표시용)
  /* ===== 스캔 입력 배선(2026-08-17) — Enter 에 의존하지 않는다 =====
     문제: 입력칸 비우기가 Enter 키 처리에만 걸려 있어, 스캐너 전송 타이밍/IME 간섭으로
     Enter 가 어긋나면 값이 남아 다음 스캔과 섞였다.
     해결: ① 처리 직전에 무조건 입력칸을 비운다(처리 중 오류가 나도 잔여값 없음)
           ② 스캐너는 문자를 기관총처럼(간격<80ms) 쏟으므로, 전송이 140ms 멎으면
              Enter 없이도 자동 처리 — 접미사 설정·키 이벤트와 무관하게 항상 동작
           ③ 사람이 손으로 치는 속도(간격>80ms)가 감지되면 자동 처리를 끄고
              Enter/[스캔] 버튼을 기다린다(타이핑 도중 잘려나가는 사고 방지) */
  function wireScanInput(inp,fn){
    liveNorm(inp);
    var t=null, lastEvt=0, manual=false;
    function clearT(){ if(t){ clearTimeout(t); t=null; } }
    function fire(){
      clearT(); manual=false; lastEvt=0;
      var v=inp.value; inp.value='';           // ★ 처리보다 먼저 비운다
      try{ inp.focus(); }catch(e){}
      if(!v) return;
      scanRaw=v; fn(v);
    }
    inp.addEventListener('input',function(){
      var now=Date.now();
      if(inp.value===''){ manual=false; lastEvt=0; clearT(); return; }
      if(lastEvt && (now-lastEvt)>80) manual=true;     // 손 타이핑 감지
      lastEvt=now; clearT();
      if(!manual) t=setTimeout(fire,140);              // 스캐너 전송 종료 → 자동 처리
    });
    function onEnter(e){ if(e.key==='Enter'||e.keyCode===13){ e.preventDefault(); fire(); } }
    inp.addEventListener('keydown',onEnter);
    inp.addEventListener('keypress',onEnter);          // IME/브라우저별 keydown 누락 대비
    return fire;                                       // [스캔] 버튼용
  }
  /* 라벨을 어떻게 분해했는지 항상 보여준다 — 실패 시 원인이 화면에서 바로 읽힌다 */
  function labelHint(){
    var l=scanLbl; if(!l||!l.norm) return '';
    var bits=[];
    if(l.norm!==l.code||l.qty) bits.push(L('라벨','Etiqueta')+' <span class="mono">'+esc(l.norm)+'</span>');
    bits.push(L('제품번호','Clave')+' <b class="mono">'+esc(l.code)+'</b>');
    if(l.qty) bits.push(L('소입수량','Cant./caja')+' <b>'+fmt(l.qty)+' EA</b>');
    if(String(scanRaw||'')&&normScan(scanRaw)!==String(scanRaw||'')) bits.push(L('자판 보정됨','Teclado corregido'));
    return '<div class="z" style="font-size:11px;color:var(--muted);flex-wrap:wrap;gap:6px">'+bits.join(' · ')+'</div>';

  function parseWorkbook(wb){
    var name=wb.SheetNames.filter(function(n){return /packing/i.test(n)&&/detail/i.test(n);})[0]
          || wb.SheetNames.filter(function(n){return /packing/i.test(n);})[0];
    if(!name) throw new Error(L("'packing list_details' 시트를 찾지 못했습니다","No se encontró la hoja 'packing list_details'"));
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:null,raw:true});
    var hi=-1;
    for(var i=0;i<Math.min(rows.length,15);i++){ var t=(rows[i]||[]).map(function(c){return String(c==null?'':c).replace(/\s+/g,' ').toUpperCase();});
      if(t.some(function(x){return x.indexOf('ORDER')>=0;})&&t.some(function(x){return x.indexOf('CTR NO')>=0;})){hi=i;break;} }
    if(hi<0) throw new Error(L('헤더행(ORDER NO / CTR NO)을 찾지 못했습니다','No se encontró el encabezado'));
    var H=(rows[hi]||[]).map(function(c){return String(c==null?'':c).replace(/\s+/g,' ').trim().toUpperCase();});
    function col(){ var ns=[].slice.call(arguments); for(var k=0;k<ns.length;k++){var i=H.indexOf(ns[k]);if(i>=0)return i;} for(var k2=0;k2<ns.length;k2++){for(var j=0;j<H.length;j++)if(H[j].indexOf(ns[k2])>=0)return j;} return -1; }
    var cOrd=col('ORDER NO','ORDER'),cPl=col('PL NO'),cFr=col('FROM'),cTo=col('TO'),cSku=col('CTR NO'),cDesc=col('DESCRIPTION'),cQty=col('TOTAL QTY','QTY');
    // 카톤 수·소입수 열(2026-08-17 디렉터 확인): CARTON UNIT = 카톤 수, QTY PER C/T = 박스당 수량.
    //   예) CARTON UNIT 2 · QTY PER C/T 12 → 12개들이 2박스 = 24개. FROM/TO 는 번호 범위일 뿐
    //   카톤 수와 다를 수 있다(혼적·병합) — CARTON UNIT 이 있으면 그걸 우선한다.
    var cCU=col('CARTON UNIT','CTN UNIT','CARTON QTY','C/T UNIT','CTNS');
    var cQPC=col('QTY PER C/T',"Q'TY PER C/T",'QTY PER CTN','QTY/C/T','QTY/CTN','PCS/CTN','PER C/T');
    if([cOrd,cPl,cFr,cTo,cSku,cQty].some(function(x){return x<0;})) throw new Error(L('필수 열이 없습니다(ORDER NO·PL NO·FROM·TO·CTR NO·QTY)','Faltan columnas requeridas'));
    // 인보이스 번호 추출(2026-07-31 강화): 같은 셀("INVOICE NO: X") · 오른쪽 셀 · 아랫줄 셀까지 인식.
    //   라벨 단어(NO/DATE 등)만 있는 셀은 값으로 안 봄. 못 찾으면 미리보기에서 직접 입력.
    var inv=null;
    var SEP=/^(?:NO|N[Oº°]\.?|NUM\w*|#|[-:.：]+)$/i;      // 라벨 뒤 구분어("NO" 등) — 건너뜀
    // 다른 라벨 문구 = 숫자가 없고 라벨 단어를 포함(순수 텍스트) — 숫자가 섞인 값(CTR-2607-88 등)은 라벨로 안 봄
    function isLbl(t){ return !/\d/.test(t)&&/(?:INVOICE|FACTURA|COMMERCIAL|PACKING|LIST|DATE|FECHA|ORDER|TOTAL|QTY|DESCRIPTION)/i.test(t); }
    function invVal(s){
      if(s==null) return null;
      var t=String(s).trim();
      if(t===''||SEP.test(t)||isLbl(t)) return null;
      if(/\s/.test(t)) return null;                       // 공백 포함 문구는 번호로 안 봄
      if(!/\d/.test(t)&&t.length<4) return null;          // 너무 짧은 비숫자
      return t.slice(0,60);
    }
    outer:
    for(var r0=0;r0<hi;r0++){ var rr=rows[r0]||[]; var rrN=(r0+1<hi)?(rows[r0+1]||[]):[];
      for(var j=0;j<rr.length;j++){
        var cell=String(rr[j]==null?'':rr[j]);
        if(!/INVOICE|FACTURA|REF(?:ERENCE|ERENCIA)?\b/i.test(cell)) continue;
        // ① 같은 셀 안: "INVOICE NO: ABC-123" / "COMMERCIAL INVOICE CI2026015" / "REF: D2607001"
        var same=invVal(cell.replace(/^[\s\S]*?(?:INVOICE|FACTURA|REF(?:ERENCE|ERENCIA)?)\s*(?:NO|N[Oº°]|NUM\w*|#)?\.?\s*[:：\-]?\s*/i,''));
        if(same){ inv=same; break outer; }
        // ② 같은 행 오른쪽 셀들 — 구분어("NO")는 건너뛰고, 다른 라벨(DATE 등)을 만나면 중단
        for(var k=j+1;k<rr.length;k++){
          var c2=rr[k]; if(c2==null||String(c2).trim()==='') continue;
          var t2=String(c2).trim();
          if(SEP.test(t2)) continue;

          var v=invVal(t2); if(v){ inv=v; break outer; } break;
        }
        // ③ 아랫줄 같은 열·오른쪽 열 (헤더행 전까지만)
        var b1=invVal(rrN[j]), b2=invVal(rrN[j+1]);
        if(b1||b2){ inv=b1||b2; break outer; }
      }
    }
    // ④ 폴백: 라벨이 아예 없는 양식 — 헤더 위 영역에서 "문서번호처럼 생긴" 단독 토큰을 찾는다.
    //    영문 1~4자로 시작 + 숫자 총 4자리 이상 (예: D26-81319563 · D2607001 · CI2026015). D+숫자(디스패치 레퍼런스) 우선.
    if(!inv){
      var cand=[];
      for(var rf=0;rf<hi;rf++){ var rrF=rows[rf]||[];
        for(var jf=0;jf<rrF.length;jf++){
          var tf=rrF[jf]==null?'':String(rrF[jf]).trim();
          if(tf===''||/\s/.test(tf)||SEP.test(tf)||isLbl(tf)) continue;
          if(/^[A-Za-z]{1,4}\d[A-Za-z0-9\-._\/]{3,}$/.test(tf)&&(tf.match(/\d/g)||[]).length>=4) cand.push(tf.slice(0,60));
        }
      }
      inv=null;
      for(var ci=0;ci<cand.length;ci++){ if(/^D\d/i.test(cand[ci])){ inv=cand[ci]; break; } } // D26… 우선
      if(!inv&&cand.length===1) inv=cand[0];              // 후보가 하나뿐일 때만 채택(오인 방지)
    }
    // ▼ 수량 누락 방지(2026-07-31):
    //   ① ORDER NO·PL NO 병합셀(빈칸) → 직전 값으로 채움(단, CTR NO·수량이 있는 데이터 행만)
    //   ② FROM/TO(카톤번호) 없는 행(혼적 카톤 병합셀·낱개 등) → 제외하지 않고 카톤 0 으로 포함
    //   ③ 파일 수량 합계(fileQty)와 등재 합계를 함께 반환 → 미리보기에서 대사(對査) 표시
    var out=[]; var noCarton=0, noCartonQ=0, dropped=0, droppedQ=0, fileQty=0, cuMismatch=[];
    var lastOrd=null, lastPl=null;
    for(var i2=hi+1;i2<rows.length;i2++){ var r=rows[i2]||[];
      var code=String(r[cSku]==null?'':r[cSku]).trim();
      var qty=Number(r[cQty]||0);
      // 카톤 수·소입수는 TOTAL 판정보다 먼저 읽는다 — TOTAL 열이 빈 양식은 CU×QPC 로 수량을 채워야 하므로
      var cu=(cCU>=0&&r[cCU]!=null&&String(r[cCU]).trim()!=='')?Math.max(0,Number(r[cCU])||0):null;
      var qpc=(cQPC>=0&&r[cQPC]!=null&&String(r[cQPC]).trim()!=='')?Math.max(0,Number(r[cQPC])||0):null;
      if(qty<=0&&cu&&qpc) qty=cu*qpc;                      // TOTAL 빈 양식 — 카톤수×소입수
      var o=r[cOrd]; var oS=(o==null?'':String(o).trim());
      var isData=(code!==''&&qty>0);
      if(oS!==''){ lastOrd=oS; if(r[cPl]!=null&&String(r[cPl]).trim()!=='') lastPl=Number(r[cPl]); }
      else if(isData&&lastOrd!=null){ oS=lastOrd; } // 병합셀 이어받기
      if(!isData){ if(qty>0&&oS===''){ /* TOTAL 행 등 — 합계에 미포함 */ } continue; }
      fileQty+=qty;
      if(oS===''){ dropped++; droppedQ+=qty; continue; }   // ORDER NO 를 끝내 못 찾은 행
      var pl=(r[cPl]!=null&&String(r[cPl]).trim()!=='')?Number(r[cPl]):(lastPl||0);
      var fr=r[cFr],to=r[cTo];
      // 카톤 수: ① CARTON UNIT 열 → ② FROM/TO 범위 → ③ 0(낱개·병합)
      var cartons=(cu!=null)?cu:((fr==null||to==null)?0:Math.max(0,Number(to)-Number(fr)+1));
      if(cartons===0){ noCarton++; noCartonQ+=qty; }       // 카톤 없음 — 수량은 포함, 스캔 대상 아님
      // 대사: CARTON UNIT×QTY PER C/T 가 TOTAL 과 다르면 그 행을 경고 목록에 (파일 오류 조기 발견)
      if(cu&&qpc&&qty>0&&Math.abs(cu*qpc-qty)>0.001) cuMismatch.push(code+': '+cu+'×'+qpc+'≠'+qty);
      out.push({order_no:oS,pl_no:pl,code:code,cartons:cartons,qty:qty,desc:String(r[cDesc]||'').trim(),
        box_from:(fr==null?null:Number(fr)),box_to:(to==null?null:Number(to))});   // 라인별 저장(합산 안 함) — 카톤 범위 보존
    }
    return {rows:out,invoice_no:inv,skipped:noCarton,skipQ:noCartonQ,dropped:dropped,droppedQ:droppedQ,fileQty:fileQty,
      cartonBasis:(cCU>=0?'CARTON UNIT':'FROM/TO'),cuMismatch:cuMismatch};   // 미리보기 표시용
  }
  function bufToB64(buf){ // ArrayBuffer → base64 (청크 처리로 대용량 안전)
    var u8=new Uint8Array(buf), s='', CH=32768;
    for(var i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH));
    return btoa(s);
  }
  var FILE_MAX=8*1024*1024; // 원본 8MB 까지 첨부(base64 ≈10.7MB, 서버 한도 12MB)
  function readFile(f){
    var r=new FileReader();
    r.onload=function(e){ try{
      var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
      var res=parseWorkbook(wb);
      // 원본 파일 보존 → 선적 생성 시 함께 저장(ERP에서 재다운로드용)
      if(f.size<=FILE_MAX){
        var mime=f.type||'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
        res._file={name:f.name,size:f.size,data:'data:'+mime+';base64,'+bufToB64(e.target.result)};
      } else { res._file=null; res._fileTooBig=true; }
      doPreview(res,f.name);
    }catch(err){ $('pout').innerHTML='<div class="note" style="border-left-color:var(--red);background:#FDF3F1;color:var(--red)"><b>'+L('읽지 못했습니다','No se pudo leer')+'</b> — '+esc(err.message)+'</div>'; } };
    r.readAsArrayBuffer(f);
  }

        +(s.unmatched.length?'<div class="vrow">⚠️ <b style="color:var(--red)">'+L('미등록 SKU','SKU no registrado')+' '+s.unmatched.length+'</b> <span class="mono" style="color:var(--muted);font-size:11px">'+esc(s.unmatched.slice(0,5).join(' · '))+(s.unmatched.length>5?' …':'')+'</span></div>':'')
        +(s.norack.length?'<div class="vrow">🆕 <b>'+L('랙 미지정','Sin ubicación')+' '+s.norack.length+'</b> <span style="color:var(--muted)">'+L('도착 전에 자리를 정해두면 적치가 빨라집니다','defina ubicación antes de llegar')+'</span></div>':'')
        +'</div>'

  function createShip(){

    $('btnCreate').disabled=true;
    var invEl=$('invNo'); var invNo=(invEl&&invEl.value.trim())||parsed.invoice_no||null;

  /* ===== 라인 재분할(2026-08-17) — 합산 저장된 기존 선적을 원본 파일 기준 라인별로 교체 =====
     노출 조건: 마감 전 + box 범위가 전무(=라인별 저장 이전 등재) + 검수/적치 스캔 0. 서버도 같은 가드를 강제한다. */
  function needRelines(){
    // 스캔이 안 된 팔렛이 하나라도 있으면 재분할 가능(파서 교정 재적용 대비).
    // 서버가 팔렛별로 검수·적치 진행분은 보호하고 건너뛴다.
    if(!DETAIL||!DETAIL.pallets||!DETAIL.pallets.length) return false;
    if(DETAIL.shipment.status==='closed') return false;
    return DETAIL.pallets.some(function(p){
      if(p.checked_at) return false;
      var hasItem=(p.items||[]).length>0, touched=false;
      (p.items||[]).forEach(function(i){ if((i.scanned_cartons||0)>0||(i.put_cartons||0)>0) touched=true; });
      return hasItem && !touched;
    });
  }
  function reSplitSend(rows){
    api('/api/inbound/'+SHIP+'/relines',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows:rows})}).then(function(o){
      if(!o.ok||o.body.error){
        var msg={already_scanned:L('검수·적치가 이미 진행되어 재분할할 수 없습니다','Ya hay escaneos — no se puede re-dividir'),
                 file_mismatch:L('파일이 이 선적과 다릅니다(팔렛·수량 불일치)','El archivo no coincide con este embarque'),
                 bad_state:L('마감/취소된 선적입니다','Embarque cerrado/cancelado')}[o.body.error]||o.body.error||o.status;
        toast('⚠ '+msg); return;
      }
      var skip=(o.body.skipped&&o.body.skipped.length)?(' · '+L('건너뜀(검수 진행)','omitidos')+' '+o.body.skipped.length):'';
      toast('✔ '+L('라인 재분할 완료','Líneas re-divididas')+' — '+o.body.before_lines+' → '+o.body.lines+L('라인',' líneas')+skip);
      openShip(SHIP);
    });
  }
  /* ===== 검수 리셋(디렉터, 0174) — 잘못 저장된 검수·적치·스캔을 초기화하고 처음부터 =====
     서버는 스캔 행을 지우지 않고 voided 처리(감사 추적). 리셋 후 [라인 재분할]이 다시 가능해져
     구파서(FROM/TO)로 등재된 카톤 수를 CARTON UNIT 기준으로 교정할 수 있다. */
  function resetCheck(){
    if(!isDir){ toast(L('디렉터만 가능합니다','Solo director')); return; }
    if(!confirm(L('이 선적의 검수·적치·스캔 기록을 전부 초기화합니다.\n팔렛은 "하차됨" 상태로 돌아가고, 처음부터 다시 스캔합니다.\n(기록은 삭제되지 않고 감사용으로 보존됩니다)\n\n계속할까요?','¿Reiniciar toda la verificación de este embarque?\nLos pallets vuelven a "descargado" y se escanea de nuevo.'))) return;
    api('/api/inbound/'+SHIP+'/reset-check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}).then(function(o){
      if(!o.ok||o.body.error){
        sndErr();
        toast('⚠ '+L('리셋 실패','Error')+': '+(o.body.error==='director_only'?L('디렉터만 가능합니다','Solo director'):(o.body.error||o.status)));
        return;
      }
      // 이 선적의 미전송 스캔 큐도 비운다 — 리셋 후 옛 스캔이 되살아나지 않게
      try{ Object.keys(localStorage).forEach(function(k){ if(k.indexOf('inb_scanq_'+SHIP+'_')===0) localStorage.removeItem(k); }); }catch(e){}
      var n=(o.body.reset||[]).length;
      sndSaved(); toast('🧹 '+L('검수 리셋 완료','Reiniciado')+' — '+n+L('팔렛',' pallets')+' · '+L('이제 [🔀 라인 재분할]을 실행하세요','ahora re-divida las líneas'));
      scanReset(); openShip(SHIP);
    });
  }
  function reSplitParse(buf){
    try{
      var wb=XLSX.read(new Uint8Array(buf),{type:'array'});
      var res=parseWorkbook(wb);
      if(!res.rows||!res.rows.length){ toast('⚠ '+L('파일에서 라인을 읽지 못했습니다','No se pudo leer el archivo')); return; }
      reSplitSend(res.rows);
    }catch(err){ toast('⚠ '+L('파일 읽기 실패','Error al leer')+': '+err.message); }
  }
  function reSplitLines(files){
    if(!confirm(L('원본 패킹리스트를 다시 읽어 같은 SKU 라인을 합산 없이 라인별로 다시 등재합니다.\n하차 상태·ETA·파일은 그대로 유지됩니다. 진행할까요?',
      'Se volverá a leer el packing list para registrar línea por línea. ¿Continuar?'))) return;
    var xf=(files||[]).filter(function(f){ return /\.xlsx?$/i.test(f.file_name||''); })[0];
    if(xf){   // 첨부된 원본 엑셀을 서버에서 받아 재파싱
      api('/api/inbound/files/'+xf.id).then(function(o){
        if(!o.ok||!o.body.file_data){ toast('⚠ '+L('원본 파일을 받지 못했습니다 — 파일을 직접 선택하세요','No se pudo descargar — elija el archivo')); reSplitPick(); return; }
        try{
          var b64=String(o.body.file_data).split(',')[1]||'';
          var bin=atob(b64), u8=new Uint8Array(bin.length);
          for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
          reSplitParse(u8.buffer);
        }catch(e){ toast('⚠ '+L('파일 해석 실패','Error')); }
      });
    } else reSplitPick();   // 원본 미보관(8MB 초과 등) → 직접 선택
  }
  function reSplitPick(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls';
    inp.addEventListener('change',function(){
      var f=inp.files[0]; if(!f) return;
      var r=new FileReader();
      r.onload=function(e){ reSplitParse(e.target.result); };
      r.readAsArrayBuffer(f);
    });
    inp.click();
  }

  // 파일이 없어도 볼 수 있는 ERP 등재 내역(팔렛·SKU) — DB에 실제로 들어간 값
  //  · 🌐 버튼 = 이 창만 한국어 ↔ Español 전환. 본문 화면 언어(LANG)는 건드리지 않는다
  //    (한국인 관리자가 창만 스페인어로 바꿔 현장 작업자에게 보여주는 경우가 많다).
  //    선택은 localStorage 'wh_viewlang' 에 기억 — 다음에 열면 그 언어로 뜬다.
  //  · ⤓ 엑셀 = 화면과 같은 표를 .xlsx 로 저장. XLSX 라이브러리는 이 부모 창에만 있으므로
  //    시트 생성·저장은 부모에서 하고, 자식 창에는 스크립트를 심지 않는다(핸들러도 부모에서 부착).
  function viewRegistered(){
    var w=winOpen(L('등재 내역','Registro ERP'));
    if(!w) return;
    var s=DETAIL.shipment, groups=palGroups();
    var VL=(function(){ try{ var v=localStorage.getItem('wh_viewlang'); if(v==='es'||v==='ko') return v; }catch(e){} return LANG; })();
    function T(ko,es){ return VL==='es'?es:ko; }
    function nf(n){ return Number(n||0).toLocaleString(VL==='es'?'es-MX':'ko-KR'); }
    function stLbl(st){ var t=PAL_LBL[st]; return t?T(t[0],t[1]):st; }
    function poH(v){                                  // poHtml 과 같은 표기, 언어만 이 창 기준
      var p=poParts(v);
      if(!p.po) return '<span class="po plain">'+esc(T('번호 없음','Sin número'))+'</span>';
      return (p.pfx?'<span class="pfx">'+esc(p.pfx)+'</span>':'')
        +'<span class="po'+(p.pfx?'':' plain')+'">'+esc(p.po)+'</span>';
    }
    // 합계는 언어와 무관 — 한 번만 계산해 재렌더 때 다시 세지 않는다
    var cart=0, qty=0, pal=0, sku={};
    groups.forEach(function(G){
      pal+=G.N;
      G.pals.forEach(function(p){ p.items.forEach(function(i){
        cart+=(i.cartons||0); qty+=(i.qty||0); sku[i.code]=1; }); });
    });

    function render(){
      var body='';
      groups.forEach(function(G){
        var rows='';
        G.pals.forEach(function(p){
          p.items.forEach(function(i,ix){
            rows+='<tr><td>'+(ix===0?p.pl_no:'')+'</td><td>'+esc(i.code)+(i.registered?'':' ⚠')+'</td><td>'+esc(i.name||'—')+'</td>'
              +'<td class="num">'+(i.cartons||0)+'</td><td class="num">'+nf(i.qty||0)+'</td>'
              +'<td>'+esc(i.rack||'—')+'</td><td>'+stLbl(p.status)+'</td></tr>';
          });
        });
        body+='<div class="grp">'+poH(G.key)+' <span style="font-size:12px;color:#6F6A60">— '+T('팔렛','Pallets')+' '+G.N+' · '+T('카톤','Cajas')+' '+nf(G.cartons)+' · '+nf(G.qty)+' EA</span></div>'
          +'<table><thead><tr><th>PL</th><th>CTR NO</th><th>'+T('품명','Descripción')+'</th>'
          +'<th class="num">'+T('카톤','Cajas')+'</th><th class="num">'+T('수량','Cant.')+'</th>'
          +'<th>'+T('랙','Ubic.')+'</th><th>'+T('상태','Estado')+'</th></tr></thead><tbody>'+rows+'</tbody></table>';
      });
      w.document.body.innerHTML='<div class="vw"><h1>'+T('ERP 등재 내역','Registro en ERP')+'</h1>'
        +'<div class="sub">'+T('선적','Embarque')+' '+esc(s.invoice_no||('#'+SHIP))+' · ETA '+(s.eta||'—')
        +' · PO '+groups.length+' · '+T('팔렛','Pallets')+' '+pal+' · '+T('카톤','Cajas')+' '+nf(cart)+' · '+nf(qty)+' EA · SKU '+Object.keys(sku).length
        +' · <span style="color:#C0533B">⚠ = '+T('미등록 SKU','SKU no registrado')+'</span></div>'
        +'<div class="bar"><button id="vPrint">🖨 '+T('인쇄','Imprimir')+'</button>'
        +'<button id="vXls" class="g">⤓ '+T('엑셀 다운로드','Descargar Excel')+'</button>'
        +'<button id="vLang" class="alt">🌐 '+(VL==='es'?'한국어':'Español')+'</button></div>'
        +(body||'<div class="idle">'+T('팔렛이 없습니다','Sin pallets')+'</div>')+'</div>';
      try{ w.document.title=T('ERP 등재 내역','Registro en ERP')+' · '+(s.invoice_no||('#'+SHIP)); }catch(e){}
      try{ w.document.documentElement.lang=(VL==='es'?'es':'ko'); }catch(e){}
      var gid=function(id){ return w.document.getElementById(id); };
      var bp=gid('vPrint'); if(bp) bp.addEventListener('click',function(){ try{ w.print(); }catch(e){} });
      var bl=gid('vLang'); if(bl) bl.addEventListener('click',function(){
        VL=(VL==='es')?'ko':'es';
        try{ localStorage.setItem('wh_viewlang',VL); }catch(e){}
        render();                                     // 창 내용만 다시 그린다(본문 LANG 불변)
      });
      var bx=gid('vXls'); if(bx) bx.addEventListener('click',downloadXls);
    }

    // 화면과 같은 표 → .xlsx (머리글·상태는 이 창에서 고른 언어를 따른다)
    function downloadXls(){
      try{
        var aoa=[[ 'ORDER NO','PL','CTR NO',T('품명','Descripción'),T('카톤','Cajas'),T('수량','Cant.'),
                   T('랙','Ubic.'),T('상태','Estado'),T('제품등록','Registrado') ]];
        groups.forEach(function(G){
          G.pals.forEach(function(p){
            p.items.forEach(function(i){
              aoa.push([ G.key, p.pl_no, i.code, i.name||'', Number(i.cartons||0), Number(i.qty||0),
                         i.rack||'', stLbl(p.status), i.registered?'O':T('미등록','No') ]);
            });
          });
        });
        aoa.push([]);
        aoa.push([ T('합계','Total'),'','','', cart, qty, '',
                   T('팔렛','Pallets')+' '+pal, 'SKU '+Object.keys(sku).length ]);
        var ws=XLSX.utils.aoa_to_sheet(aoa);
        ws['!cols']=[{wch:16},{wch:5},{wch:14},{wch:34},{wch:8},{wch:11},{wch:12},{wch:12},{wch:11}];
        var wb=XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb,ws,T('등재내역','Registro'));
        var inv=String(s.invoice_no||('SHIP'+SHIP)).replace(/[\\\/:*?"<>|\[\]]/g,'_');
        XLSX.writeFile(wb, T('ERP등재내역_','Registro_ERP_')+inv+'.xlsx');
        toast('✔ '+L('엑셀 저장됨','Excel guardado'));
      }catch(e){ toast(L('엑셀 생성 실패','Error al generar Excel')+': '+(e&&e.message||e)); }
    }

    render();
  }
  function dlShipFile(fid){

  function attachShipFile(){
    var inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xls,.csv,.pdf';

      var f=inp.files[0]; if(!f) return;

      var r=new FileReader();
      r.onload=function(e){

          body:JSON.stringify({file_name:f.name,file_data:'data:'+mime+';base64,'+bufToB64(e.target.result)})}).then(function(o){
          if(!o.ok||o.body.error){ toast(L('첨부 실패','Error')+': '+(o.body.error||o.status)); return; }

  function palStats(){
    var p=DETAIL.pallets, N=p.length;
    return { N:N, unloaded:p.filter(function(x){return x.status!=='wait';}).length,
      checked:p.filter(palConfirmed).length,
      done:p.filter(function(x){return x.status==='done';}).length };
  }
  // 검수 확정 판정(2026-08-18) — 적치가 진행되면 status 는 'checking' 으로 돌아가지만
  // checked_at 이 있으면 검수는 이미 확정된 팔렛이다("검수중으로 되돌아가 보이던" 버그 수정).
  function palConfirmed(p){ return !!p.checked_at || p.status==='checked' || p.status==='done'; }
  function renderDetail(){
    var s=DETAIL.shipment, st=palStats();

      +(s.status!=='closed'?' <button class="btn ghost sm" id="btnInvEdit" title="'+L('인보이스 번호 입력·수정','Editar factura')+'">✎</button>':'')+'</h2>'

      +'<button class="btn ghost sm" id="btnBack">← '+L('목록','Lista')+'</button></div>'
      +'<div class="steps">'

      +stepBtn('check',L('검수','Verificar'),st.checked+'/'+st.N)
      +stepBtn('put',L('적치','Acomodo'),st.done+'/'+st.N)

    $('app').innerHTML=html;

        openShip(SHIP);

    document.querySelectorAll('.step').forEach(function(b){ b.addEventListener('click',function(){
      var nx=b.dataset.s;
      if(STEP==='put'&&nx!=='put'&&putPending()){ putFlush(function(){ STEP=nx; clearWorking(); putReset(); renderStep(); }); return; }
      if(STEP!==nx) clearWorking();
      STEP=nx; if(STEP==='check')scanReset(); if(STEP==='put')putReset(); renderStep(); }); });

  function stepBtn(k,t,m){ return '<button class="step'+(STEP===k?' on':'')+'" data-s="'+k+'"><div class="t">'+t+'</div><div class="m">'+m+'</div></button>'; }
  function renderStep(){
    document.querySelectorAll('.step').forEach(function(b){ b.classList.toggle('on',b.dataset.s===STEP); });
    if(STEP==='unload') renderUnload();
    else if(STEP==='check') renderCheck();

  /* ===== 점유 표시(소프트 락) — 지금 누가 이 팔렛을 잡고 있는지 =====
     막지 않는다. 같은 팔렛을 굳이 잡아도 증분 저장으로 합산된다. */
  var WORK_STEP_LBL={unload:['하차','Descarga'],check:['검수','Verificación'],put:['적치','Acomodo']};
  function workChip(p,big){
    if(!p||!p.working||p.working_is_me) return '';
    var who=p.working_by_name||L('다른 작업자','otro operador');
    var st=WORK_STEP_LBL[p.working_step]; st=st?L(st[0],st[1]):'';
    if(big) return '<div class="bigwarn" style="background:#F7E9CD;border-color:var(--gold);color:#8A6420">🧑 <b>'
      +esc(who)+'</b> '+L('님이 이 팔렛을','está trabajando en este pallet')+(st?' '+st:'')+L(' 작업 중입니다 — 같이 하면 스캔은 합산됩니다.',' — los escaneos se suman.')+'</div>';
    return '<span class="wchip">🧑 '+esc(who)+(st?' '+st:'')+'</span>';

  function pingWorking(pid,step){
    if(!pid) return;
    WORK_PID=pid; WORK_STEP=step||null;
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/working',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({step:step||null})});

  function clearWorking(){
    var pid=WORK_PID; WORK_PID=null; WORK_STEP=null;
    if(pid) api('/api/inbound/'+SHIP+'/pallets/'+pid+'/working/clear',{method:'POST'});
  }

  var PAL_LBL={wait:['대기','En espera'],unloaded:['하차됨','Descargado'],checking:['적치중','Acomodando'],checked:['검수됨','Verificado'],done:['완료','Listo']};
  function palLbl(s){ var t=PAL_LBL[s]; return t?L(t[0],t[1]):s; }
  /* PO번호 표기 — 고정 접두(예 100RA)는 작게 붙이고, RA 뒤의 실제 PO번호를 크게·자간 넓게.
     예) 100RA1100 → [100RA]작게 + [1100]크게.  패턴이 안 맞으면 전체를 자간만 넓혀 표시. */
  function poParts(v){
    var t=String(v==null?'':v).trim();
    var m=t.match(/^(\d*[A-Za-z]{2,})[\s\-_.]*(\d[\dA-Za-z\-_.\/]*)$/);
    if(m&&m[2]) return {pfx:m[1],po:m[2]};
    return {pfx:'',po:t};
  }
  function poHtml(v){
    var p=poParts(v);
    if(!p.po) return '<span class="po plain">'+esc(L('번호 없음','Sin número'))+'</span>';
    return (p.pfx?'<span class="pfx">'+esc(p.pfx)+'</span>':'')
      +'<span class="po'+(p.pfx?'':' plain')+'">'+esc(p.po)+'</span>';
  }
  // 표 안(마감 탭)에서 쓰는 축소판 — 같은 규칙, 작은 크기
  function poHtmlSm(v){
    var p=poParts(v);
    if(!p.po) return '<span style="color:var(--muted)">—</span>';
    return (p.pfx?'<span style="color:var(--muted);font-size:11px">'+esc(p.pfx)+'</span> ':'')
      +'<b style="font-size:14px;letter-spacing:.1em">'+esc(p.po)+'</b>';
  }
  // 하차만 된 팔렛(스캔·적치 기록 없음)만 되돌릴 수 있다 — 서버 판정과 동일 기준
  function canUndo(p){
    if(p.status!=='unloaded') return false;
    return p.items.every(function(i){ return !(i.scanned_cartons||0) && !(i.put_cartons||0); });
  }
  // ORDER NO(인보이스 번호)로 팔렛을 묶는다 — 긴 번호는 머리글에 한 번만, 카드에는 팔렛 번호만
  function palGroups(){
    var map={}, keys=[];
    DETAIL.pallets.forEach(function(p){
      var k=String(p.order_no==null?'':p.order_no);
      if(!map[k]){ map[k]={key:k,pals:[]}; keys.push(k); }
      map[k].pals.push(p);
    });
    return keys.map(function(k){
      var G=map[k];
      G.pals.sort(function(a,b){ return (a.pl_no||0)-(b.pl_no||0); });
      G.N=G.pals.length;
      G.unloaded=G.pals.filter(function(p){return p.status!=='wait';}).length;
      G.cartons=G.pals.reduce(function(a,p){return a+(p.cartons_expected||0);},0);
      G.qty=G.pals.reduce(function(a,p){return a+(p.qty_expected||0);},0);
      G.wait=G.pals.filter(function(p){return p.status==='wait';});
      G.undoable=G.pals.filter(canUndo);
      return G;
    });
  }
  function palCard(p,withUndo){
    var done=p.items.reduce(function(a,i){return a+(i.scanned_cartons||0);},0);
    var u=(withUndo&&canUndo(p));
    return '<div class="pal st-'+p.status+((u&&undoSel[p.id])?' sel':'')+'" data-pid="'+p.id+'" role="button" tabindex="0">'
      +(withUndo?('<div class="ptop">'
        +(u?'<input type="checkbox" class="pck" data-ck="'+p.id+'"'+(undoSel[p.id]?' checked':'')+' title="'+L('취소할 팔렛 선택','Seleccionar para cancelar')+'">':'<span></span>')
        +(u?'<button class="undo" data-undo="'+p.id+'" title="'+L('이 팔렛만 하차 취소','Cancelar solo este pallet')+'">↩</button>':'<span></span>')
        +'</div>'):'')
      +'<div class="o">'+L('팔렛','Pallet')+'</div><div class="pn">'+p.pl_no+'</div>'
      +'<div class="d">'+palLbl(p.status)+' · '+L('카톤','Cajas')+' '+p.cartons_expected+' · SKU '+p.items.length+'</div>'
      +(workChip(p)||'')
      +'<div class="bar"><i style="width:'+(p.cartons_expected?Math.round(done/p.cartons_expected*100):0)+'%"></i></div></div>';
  }
  // 팔렛 목록에 POST 를 순차 호출(동시 호출 시 선적 상태 경합 방지)
  function runSeq(list,mk,done){
    var i=0, fail=0, lastErr=null;
    (function next(){
      if(i>=list.length){ done(fail,lastErr); return; }
      api(mk(list[i]),{method:'POST'}).then(function(o){
        if(!o.ok||o.body.error){ fail++; lastErr=o.body.error||o.status; }
        i++; next();
      });
    })();
  }

  /* ---- 하차 ---- */
  function selPallets(){ return DETAIL.pallets.filter(function(p){ return undoSel[p.id]&&canUndo(p); }); }
  function syncSel(){
    var n=selPallets().length;
    var b=$('btnUndoSel');
    if(b){ b.disabled=!n; b.textContent='↩ '+L('선택 취소','Cancelar selección')+' ('+n+')'; }
    document.querySelectorAll('#pg .pal').forEach(function(el){ el.classList.toggle('sel',!!undoSel[el.dataset.pid]); });
    document.querySelectorAll('#pg [data-gall]').forEach(function(cb){
      var G=CURGROUPS[+cb.dataset.gall]; if(!G) return;
      var t=G.undoable.length, s=G.undoable.filter(function(p){return undoSel[p.id];}).length;
      cb.checked=(t>0&&s===t); cb.indeterminate=(s>0&&s<t);
    });
  }
  function renderUnload(){
    var b=$('stepbody'), st=palStats(), groups=palGroups();
    CURGROUPS=groups;
    var locked=(DETAIL.shipment.status==='closed');
    var anyWait=DETAIL.pallets.some(function(p){return p.status==='wait';});
    var anyUndo=DETAIL.pallets.some(canUndo);
    // 더 이상 되돌릴 수 없게 된 선택은 정리(검수 시작·이미 취소됨 등)
    Object.keys(undoSel).forEach(function(k){
      var p=DETAIL.pallets.filter(function(x){return String(x.id)===String(k);})[0];
      if(!p||!canUndo(p)) delete undoSel[k];
    });
    b.innerHTML='<p class="hint">'+L('컨테이너에서 팔렛만 빠르게 내립니다. 번호·라벨 확인 불필요. 잘못 눌렀으면 ↩ 로 취소하거나, 체크해서 골라 취소하세요.','Solo baje los pallets. Si se equivocó, use ↩ o marque los pallets y cancele los seleccionados.')+'</p>'
      +'<div class="row" style="margin-bottom:10px">'
      +((!locked&&anyWait)?'<button class="btn o" id="btnUnAll">'+L('전체 하차','Descargar todo')+'</button>':'')
      +((!locked&&anyUndo)?'<button class="btn r" id="btnUndoSel" disabled>↩ '+L('선택 취소','Cancelar selección')+' (0)</button>':'')
      +((!locked&&anyUndo)?'<button class="btn ghost" id="btnUnAllCancel">↩ '+L('전체 하차 취소','Cancelar toda la descarga')+'</button>':'')
      +'<span class="hint" style="margin:0">'+L('인보이스','Factura')+' '+groups.length+' · '+L('팔렛','Pallets')+' '+st.unloaded+'/'+st.N+' '+L('하차','descargados')+'</span></div>'
      +'<div id="pg"></div>';
    $('pg').innerHTML=groups.map(function(G,gi){
      return '<div class="pgrp">'
        +'<div class="gh"><div style="min-width:0">'
        +'<div class="gn">'+poHtml(G.key)+'</div>'
        +'<div class="gd">'+L('팔렛','Pallets')+' '+G.unloaded+'/'+G.N+' · '+L('카톤','Cajas')+' '+fmt(G.cartons)+' · '+fmt(G.qty)+' EA</div></div>'
        +'<div class="ga">'
        +((!locked&&G.undoable.length)?'<label class="gsel"><input type="checkbox" data-gall="'+gi+'">'+L('선택','Sel.')+'</label>':'')
        +((!locked&&G.wait.length)?'<button class="btn o sm" data-gun="'+gi+'">'+L('하차','Descargar')+' '+G.wait.length+'</button>':'')
        +((!locked&&G.undoable.length)?'<button class="btn ghost sm" data-gundo="'+gi+'">↩ '+L('취소','Cancelar')+' '+G.undoable.length+'</button>':'')
        +'</div></div>'
        +'<div class="gb"><div class="pgrid">'+G.pals.map(function(p){ return palCard(p,!locked); }).join('')+'</div></div></div>';
    }).join('');
    document.querySelectorAll('#pg .pal').forEach(function(el){
      el.addEventListener('click',function(ev){
        if(ev.target&&ev.target.closest&&(ev.target.closest('.undo')||ev.target.closest('.pck'))) return;
        unloadOne(+el.dataset.pid);
      });
      el.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); unloadOne(+el.dataset.pid); } });
    });
    document.querySelectorAll('#pg [data-undo]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.preventDefault(); ev.stopPropagation(); undoOne(+el.dataset.undo); });
    });
    document.querySelectorAll('#pg [data-ck]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.stopPropagation(); });
      el.addEventListener('change',function(){ var id=el.dataset.ck; if(el.checked) undoSel[id]=true; else delete undoSel[id]; syncSel(); });
    });
    document.querySelectorAll('#pg [data-gall]').forEach(function(el){
      el.addEventListener('click',function(ev){ ev.stopPropagation(); });
      el.addEventListener('change',function(){
        var G=CURGROUPS[+el.dataset.gall]; if(!G) return;
        G.undoable.forEach(function(p){ if(el.checked) undoSel[p.id]=true; else delete undoSel[p.id]; });
        document.querySelectorAll('#pg [data-ck]').forEach(function(cb){ cb.checked=!!undoSel[cb.dataset.ck]; });
        syncSel();
      });
    });
    document.querySelectorAll('#pg [data-gun]').forEach(function(el){
      el.addEventListener('click',function(){ unloadMany(groups[+el.dataset.gun].wait, groups[+el.dataset.gun].key); });
    });
    document.querySelectorAll('#pg [data-gundo]').forEach(function(el){
      el.addEventListener('click',function(){ undoMany(groups[+el.dataset.gundo].undoable, groups[+el.dataset.gundo].key); });
    });
    var ba=$('btnUnAll');
    if(ba) ba.addEventListener('click',function(){ unloadMany(DETAIL.pallets.filter(function(p){return p.status==='wait';}),null); });
    var bs=$('btnUndoSel');
    if(bs) bs.addEventListener('click',function(){ undoMany(selPallets(),L('선택한 팔렛','Pallets seleccionados')); });
    var bc=$('btnUnAllCancel');
    if(bc) bc.addEventListener('click',function(){ undoMany(DETAIL.pallets.filter(canUndo),null); });
    syncSel();
  }
  function unloadOne(pid){
    var p=DETAIL.pallets.filter(function(x){return x.id===pid;})[0];
    if(p&&p.status!=='wait'){ STEP='check'; scanReset(); renderDetail(); return; }
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/unload',{method:'POST'}).then(function(o){ if(o.ok){ toast(L('하차','Descargado')); refreshDetail(); } });
  }
  function unloadMany(list,label){
    if(!list||!list.length){ toast(L('전부 하차됨','Todo descargado')); return; }
    runSeq(list,function(p){ return '/api/inbound/'+SHIP+'/pallets/'+p.id+'/unload'; },function(fail){
      refreshDetail();
      toast(fail?L('하차 '+(list.length-fail)+'/'+list.length,'Descargados '+(list.length-fail)+'/'+list.length)
                :L('하차 완료','Descarga completa')+(label?' · '+label:''));
    });
  }
  /* ---- 하차 취소 ---- */
  function undoErr(e){
    return e==='has_scan'?L('이미 스캔된 팔렛은 취소할 수 없습니다','Ya tiene escaneos — no se puede cancelar')
      :e==='bad_state'?L('검수·적치가 시작된 팔렛은 취소할 수 없습니다','Ya está en verificación/acomodo — no se puede cancelar')
      :e==='closed'?L('마감된 선적입니다','El embarque está cerrado')
      :L('하차 취소 실패','Error al cancelar')+': '+(e||'');
  }
  function undoOne(pid){
    api('/api/inbound/'+SHIP+'/pallets/'+pid+'/unload-cancel',{method:'POST'}).then(function(o){
      delete undoSel[pid];
      if(!o.ok||o.body.error){ toast(undoErr(o.body.error)); refreshDetail(); return; }
      toast('↩ '+L('하차 취소됨 — 대기로 되돌림','Descarga cancelada — en espera')); refreshDetail();
    });
  }
  function undoMany(list,label){
    if(!list||!list.length){ toast(L('취소할 하차가 없습니다','No hay descargas por cancelar')); return; }
    if(!confirm(L(list.length+'개 팔렛의 하차를 취소하고 대기로 되돌립니다.','Se cancelará la descarga de '+list.length+' pallets.')+(label?'\n'+label:''))) return;
    runSeq(list,function(p){ return '/api/inbound/'+SHIP+'/pallets/'+p.id+'/unload-cancel'; },function(fail,err){
      list.forEach(function(p){ delete undoSel[p.id]; });
      refreshDetail();
      toast(fail?undoErr(err)+' ('+(list.length-fail)+'/'+list.length+')'
                :'↩ '+L('하차 취소 완료','Descarga cancelada')+' '+list.length+(label?' · '+label:''));
    });
  }

  /* ---- 검수(개편 2026-08-17m): "스캔은 기록, 판정은 보고서" ----
     ① 팔렛을 먼저 선택한다(시스템 추측 제거 — 어느 팔렛인지는 작업자가 안다)
     ② 스캔은 무조건 즉시 서버에 기록(0174 inbound_scans) — 어떤 경우에도 차단하지 않는다
     ③ [대조] = 서버가 패킹리스트와 비교한 보고서(예상/스캔/차이) — 보여줄 뿐 막지 않는다
     ④ [입고 확정] = 실제 스캔 수 그대로 저장(클램프 없음), 차이는 기록으로 남는다
     서버가 유일한 진실 — 새로고침·기기 교체·다중 작업자·브라우저 캐시와 무관하게 이어진다.
     전송 실패분은 큐(localStorage 보존)에 남아 3초 간격 자동 재시도. */
  var selPal=null;          // 선택된 팔렛 id — 선택해야 스캔 시작
  var srvTally=[];          // 서버가 확인해준 누적 [{code,qty,n}]
  var scanQ=[];             // 미전송 큐 [{code,qty,matched,k} | {undo,qty,k}]
  /* 스캔 1건의 멱등 키(0175) — 응답 유실로 같은 스캔을 다시 보내도 서버가 1회만 기록.
     "한 순간에 두 번 집계"되던 이중 기록 버그의 근본 수정. */
  function scanKey(){ return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10); }
  var scanBusy=false, scanRetryT=null, reconOn=false, wasOffline=false, lastSendErr='';
  function scanReset(){ selPal=null; srvTally=[]; scanQ=[]; scanBusy=false; reconOn=false; wasOffline=false; lastSendErr=''; scanLbl=null; clearTimeout(scanRetryT); }
  function curSelPal(){ return (DETAIL&&DETAIL.pallets.filter(function(p){return p.id===selPal;})[0])||null; }
  function qKey(){ return 'inb_scanq_'+SHIP+'_'+selPal; }
  function saveQ(){ try{ if(selPal!=null) localStorage.setItem(qKey(),JSON.stringify(scanQ)); }catch(e){} }
  function loadQ(){ try{ scanQ=JSON.parse(localStorage.getItem(qKey())||'[]')||[]; }catch(e){ scanQ=[]; } }
  /* 전송 — 큐 앞쪽의 연속 스캔(또는 취소 1건)을 보내고, 성공하면 서버 tally 로 화면을 맞춘다 */
  function flushScans(){
    if(scanBusy||selPal==null||!scanQ.length){ updSync(); return; }
    var sendScans=[], sendUndo=null;
    if(scanQ[0].undo){ sendUndo=scanQ[0]; }
    else{ for(var i=0;i<scanQ.length&&i<200;i++){ if(scanQ[i].undo) break; sendScans.push(scanQ[i]); } }
    scanBusy=true; updSync();
    var body={};
    if(sendScans.length) body.scans=sendScans.map(function(e){ return {code:e.code,qty:e.qty||null,matched:e.matched!==false,k:e.k||null}; });
    if(sendUndo){ body.undo_code=sendUndo.undo; body.undo_qty=sendUndo.qty||null; body.undo_k=sendUndo.k||null; }
    api('/api/inbound/'+SHIP+'/pallets/'+selPal+'/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(o){
        scanBusy=false;
        if(o.ok&&o.body&&o.body.ok){
          lastSendErr='';
          scanQ.splice(0,sendUndo?1:sendScans.length); saveQ();
          srvTally=o.body.tally||[];
          if(wasOffline&&!scanQ.length){ wasOffline=false; sndInfo(); toast('✔ '+L('밀린 스캔이 서버에 저장되었습니다','Lecturas pendientes guardadas')); }
          renderScanState();
          if(scanQ.length) flushScans(); else updSync();
        }else{
          // 서버가 응답은 했지만 거부 — 원인을 화면에 보여준다(마이그레이션 누락·구버전 API 등)
          lastSendErr=(o.body&&o.body.error)?String(o.body.error):('HTTP '+o.status);
          if(!wasOffline){ wasOffline=true; sndWarn(); }
          updSync();
          clearTimeout(scanRetryT); scanRetryT=setTimeout(flushScans,3000);
        }
      })
      .catch(function(){
        // 응답 자체가 없음(네트워크 단절·서버 다운) — 재시도 루프가 멈추지 않게 반드시 복구
        scanBusy=false;
        lastSendErr=L('네트워크 없음','sin red');
        if(!wasOffline){ wasOffline=true; sndWarn(); }
        updSync();
        clearTimeout(scanRetryT); scanRetryT=setTimeout(flushScans,3000);
      });
  }
  // 전송 실패 원인 → 현장에서 바로 조치할 수 있는 안내문
  function sendErrHint(){
    var e=lastSendErr; if(!e) return '';
    var m;
    if(/^HTTP 5/.test(e)) m=L('서버 오류 — 백엔드 마이그레이션(npm run migrate) 실행 여부를 확인하세요','error del servidor — verifique la migración del backend');
    else if(/^HTTP 404/.test(e)) m=L('서버에 새 API 가 없음 — 백엔드(inboundRoutes.js) 배포를 확인하세요','API no encontrada — verifique el despliegue del backend');
    else if(/^HTTP 401|^HTTP 403/.test(e)) m=L('로그인 만료 — 포털에서 다시 여세요','sesión expirada — vuelva a abrir');
    else if(/네트워크|sin red/.test(e)) m=L('와이파이/인터넷 연결을 확인하세요','verifique la conexión');
    else m=e;
    return ' · <b>'+esc(e)+'</b> — '+m;
  }
  function updSync(){
    var el=$('syncst'); if(!el) return;
    if(!scanQ.length&&!scanBusy) el.innerHTML='<span style="opacity:.95">● '+L('서버 저장됨','guardado')+'</span>';
    else if(wasOffline) el.innerHTML='<span style="color:#FFD9CF">● '+L('전송 대기','pendiente')+' '+scanQ.length+L('건','')+' — '+L('자동 재시도 중','reintentando')+sendErrHint()+'</span>';
    else el.innerHTML='<span style="opacity:.8">● '+L('전송 중','enviando')+'…</span>';
  }
  /* 화면 표시용 누적 = 서버 확인분 + 아직 안 보낸 큐(낙관 반영) */
  function combTally(){
    var t={}, order=[];
    function add(code,qty,d){ var k=code+'|'+(qty||0); if(!t[k]){ t[k]={code:code,qty:qty||0,n:0}; order.push(k); } t[k].n+=d; }
    srvTally.forEach(function(e){ add(e.code,e.qty||0,e.n); });
    scanQ.forEach(function(e){ if(e.undo) add(e.undo,e.qty||0,-1); else add(e.code,e.qty||0,1); });
    return order.map(function(k){ return t[k]; }).filter(function(e){ return e.n>0; });
  }
  function tallyTotal(){
    var pal=curSelPal(), n=0, q=0;
    combTally().forEach(function(e){ n+=e.n;
      var it=pal?(findItem(pal.items,e.code)||findAnyItem(e.code)):findAnyItem(e.code);
      q+=e.n*(e.qty||perCarton(it)); });
    return {n:n,q:q};
  }
  /* 팔렛 선택/해제 — 스캔 시작점. 전송 대기분이 있으면 팔렛을 못 바꾼다(기록 유실 방지). */
  function lockPallet(pid){
    if(reconOn) return;
    if(selPal===pid){
      if(scanQ.length){ sndWarn(); toast(L('전송이 끝나지 않았습니다 — 잠시 후 다시 시도하세요','Aún enviando — espere')); return; }
      clearWorking(); selPal=null; srvTally=[]; renderCheck(); return;
    }
    if(selPal!=null&&scanQ.length){ sndWarn(); toast(L('전송이 끝나지 않았습니다 — 잠시 후 팔렛을 바꾸세요','Aún enviando — espere')); return; }
    var p=DETAIL.pallets.filter(function(x){return x.id===pid;})[0];
    if(!p||p.status==='wait'||p.status==='done') return;
    selPal=pid; srvTally=(p.scans||[]).slice(); loadQ();
    sndInfo(); pingWorking(pid,'check');
    renderCheck(); flushScans();
  }
  function renderPalPick(){
    var el=$('palpick'); if(!el) return;
    var avail=DETAIL.pallets.filter(function(p){return p.status==='unloaded'||p.status==='checking'||p.status==='checked';});
    el.innerHTML=avail.map(function(p){
      var on=(selPal===p.id);
      var sc=(p.scans||[]).reduce(function(a,e){return a+e.n;},0);
      if(on) sc=tallyTotal().n;
      return '<span class="pchip'+(on?' on':'')+'" data-lp="'+p.id+'" role="button" tabindex="0">'
        +(on?'✔ ':(p.status==='checked'?'✓ ':''))+'<span class="n">'+esc(String(p.pl_no))+'</span>'
        +'<span>'+esc(shortPo(p.order_no))+'</span>'
        +'<small>'+(sc?fmt(sc)+'/':'')+fmt(p.cartons_expected)+L('카톤','cajas')+'</small></span>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-lp]'),function(ch){
      ch.addEventListener('click',function(){ lockPallet(+ch.dataset.lp); });
      ch.addEventListener('keydown',function(ev){ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); lockPallet(+ch.dataset.lp); } });
    });
  }
  function shortPo(v){ var t=String(v||''); return t.length>10?t.slice(0,10)+'…':t; }

  function renderCheck(){
    var b=$('stepbody');
    var avail=DETAIL.pallets.filter(function(p){return p.status==='unloaded'||p.status==='checking'||p.status==='checked';});
    var pal=curSelPal();
    if(!pal){
      b.innerHTML='<p class="hint">'+L('<b>① 팔렛 선택</b> → <b>② 박스 전부 스캔</b>(모든 스캔은 즉시 서버에 기록 — 아무것도 막지 않습니다) → <b>③ [대조]</b>로 패킹리스트와 비교 → <b>④ [입고 확정]</b>. 스캔마다 옮길 <b>존</b>이 표시됩니다.','<b>① Elija el pallet</b> → <b>② escanee todas sus cajas</b> (cada lectura se guarda al instante) → <b>③ [Comparar]</b> → <b>④ [Confirmar]</b>.')+'</p>'
        +'<div class="palpick" id="palpick"></div>'
        +(avail.length?'':'<div class="scanbox"><div class="idle">'+L('하차된 팔렛이 없습니다 — 먼저 하차하세요','Sin pallets descargados — descargue primero')+'</div></div>');
      renderPalPick(); return;
    }
    /* .scanstick = PDA 모드에서 헤더 바로 아래 고정되는 블록(잠금줄·스캔결과·입력칸·진행줄).
       일반 모드에서는 아무 효과 없는 단순 div 다. */
    b.innerHTML='<div class="scanstick"><div class="locked"><div class="a">'+L('검수 중','Verificando')+' · <span id="syncst"></span></div>'

      +'<div class="c">'+L('예상','Esp.')+' '+fmt(pal.cartons_expected)+L('카톤','cajas')+' · '+fmt(pal.qty_expected)+' EA'+(pal.status==='checked'?' · ✓ '+L('확정됨 — 더 스캔하고 재확정 가능','confirmado'):'')+'</div></div>'
      +'<div class="scanbox" id="scanres"><div class="idle">'+L('카톤을 스캔하세요','Escanee una caja')+'</div></div>'
      +'<div class="scaninput"><input type="text" id="scanIn" placeholder="'+L('카톤 라벨 스캔 (예: CTR-CE0796-16)','Escanee la etiqueta (ej. CTR-CE0796-16)')+'" autocomplete="off"><button class="btn g" id="btnScanGo">'+L('스캔','Escanear')+'</button></div>'

    var inp=$('scanIn');

      el.style.display=(el.style.display==='none')?'block':'none'; if(el.style.display!=='none') renderScanLog(); });

  /* 스캔 = 기록 — 판정·차단 없음. 존 안내 + 누적 + 즉시 서버 전송. */
  function doScan(input){
    if(!input) return;
    if(reconOn) return;                        // 대조 화면에서는 스캔 잠금([← 계속 스캔]으로 복귀)
    var pal=curSelPal();
    if(!pal){ sndWarn(); toast(L('팔렛을 먼저 선택하세요','Elija un pallet primero')); return; }
    var lbl=parseLabel(input); scanLbl=lbl;
    var code=lbl.code; if(!code) return;
    if(dupScan(lbl.norm)) return;              // 스캐너 이중/연쇄 리딩만 거른다(경고음은 연쇄당 1번)
    var inPal=!!findItem(pal.items,code);
    if(!inPal&&looksCompanion(code)){ logScan(code,L('부속 무시','ignorado')); return; }
    scanQ.push({code:code,qty:lbl.qty||0,matched:inPal,k:scanKey()}); saveQ();
    goodScanMark();
    var it=findItem(pal.items,code)||findAnyItem(code);
    if(!inPal){
      sndWarn(); logScan(code,L('라인에 없음(기록됨)','no en lista (anotada)'));
      showScan(code,'warn',L('이 팔렛의 패킹리스트에 없는 코드 — 기록해 두었습니다. [대조]에서 표시됩니다.','No está en la lista de este pallet — quedó registrado.'));
    }else{
      var mm=qtyMismatch(it,lbl.qty);
      if(mm||zoneNo(it)==null) sndWarn(); else sndOk();
      logScan(code,L('기록','registrada')+(lbl.qty?' ×'+lbl.qty:''));
      showScan(code,'ok',null,null,it);
    }
    renderScanState(); flushScans();
  }
  /* 스캔 결과 표시 — 존 안내가 핵심. 카운트는 "이 코드 누적 n회". */
  function showScan(code,cls,warn,candN,line){
    var box=$('scanres'); if(!box) return;
    box.className='scanbox '+(cls||'');
    var it=line||findAnyItem(code), nm=it?(it.name||''):'';
    if(warn){ box.innerHTML='<div class="sku" style="color:var(--red)">⚠ '+esc(code)+'</div><div class="nm">'+esc(nm)+'</div><div class="z"><b style="color:var(--red)">'+esc(warn)+'</b></div>'+labelHint(); return; }
    var rack=it?it.rack:null, z=zoneOf(rack), isNew=(z==='NEW');
    var n=0; combTally().forEach(function(e){ if(e.code===(it?it.code:code)) n+=e.n; });
    var mm=qtyMismatch(it,scanLbl&&scanLbl.qty);
    box.innerHTML='<div class="sku">'+esc(it?it.code:code)+(scanLbl&&scanLbl.qty?' <span style="font-size:15px;color:var(--muted)">× '+fmt(scanLbl.qty)+' EA</span>':'')+'</div><div class="nm">'+esc(nm)+'</div>'
      +zoneBigHtml(it)
      +'<div class="z"><span class="zone '+(isNew?'new':'')+'">'+(isNew?'🆕 '+L('랙 미지정','Sin ubic.'):z+L('존','')) +'</span>'
      +'<span class="mono" style="color:var(--muted);font-size:12px">'+(isNew?L('적치 때 지정','asignar en acomodo'):esc(rack))+'</span>'
      +'<span style="margin-left:auto;font-weight:700">'+L('이 코드 누적','Acum.')+' <b style="font-size:16px">'+n+'</b>'+L('회','')+'</span></div>'
      +(mm?'<div class="z"><b style="color:#C0533B">⚠ '+L('소입수 불일치','Cant./caja distinta')+' — '+L('라벨','etiqueta')+' '+fmt(mm.got)+' EA · '+L('패킹리스트','lista')+' '+fmt(mm.exp)+' EA</b></div>':'')
      +labelHint();
  }
  /* 하단: 누적 집계표 (+ 행별 −1 보정 — 취소도 서버에 기록된다) */
  function renderScanState(){
    var pal=curSelPal(); if(!pal){ renderPalPick(); return; }
    var tt=tallyTotal();
    var ct=$('ctxt'); if(ct) ct.innerHTML=L('스캔','Lecturas')+' <b>'+fmt(tt.n)+'</b> / '+fmt(pal.cartons_expected)+L('박스','cajas')+' · '+fmt(tt.q)+' EA';
    var cb=$('cbar'); if(cb) cb.style.width=Math.min(100,pal.cartons_expected?Math.round(tt.n*100/pal.cartons_expected):0)+'%';
    var br=$('btnRecon'); if(br) br.textContent='📋 '+L('대조','Comparar')+(tt.n?' ('+tt.n+L('박스','cajas')+')':'');
    var el=$('sklist'); if(!el) return;
    var rows=combTally().map(function(t){
      var it=findItem(pal.items,t.code), known=!!it; if(!it) it=findAnyItem(t.code);
      return '<div class="skurow"><span class="s"'+(known?'':' style="color:var(--red)"')+'>'+(known?'':'⚠ ')+esc(t.code)+(t.qty?' <span class="mono" style="font-size:10.5px;color:var(--muted)">×'+fmt(t.qty)+'</span>':'')+'</span>'
        +'<span class="z2">'+(it?(zoneOf(it.rack)==='NEW'?'🆕':zoneOf(it.rack)):'')+(it?zoneChip(it):'')+'</span>'
        +'<button class="btn ghost sm" data-bdel="'+esc(t.code)+'|'+t.qty+'" title="'+L('한 개 빼기(오스캔 보정)','quitar 1')+'" style="padding:1px 8px">−</button>'
        +'<span class="c"'+(known?'':' style="color:var(--red)"')+'>'+t.n+L('회','')+'</span></div>';
    });
    el.innerHTML=rows.join('');
    Array.prototype.forEach.call(el.querySelectorAll('[data-bdel]'),function(bt){
      bt.addEventListener('click',function(ev){ ev.stopPropagation();
        var kv=bt.dataset.bdel.split('|'), c=kv[0], q=+kv[1];
        scanQ.push({undo:c,qty:q,k:scanKey()}); saveQ();
        sndInfo(); logScan(c,L('수동 −1','ajuste −1')); renderScanState(); flushScans(); });
    });
    renderPalPick();
  }
  /* ===== [대조] — 서버 보고서(저장 없음) → [입고 확정] — 실측 저장 ===== */
  function reconShow(){
    var pal=curSelPal(); if(!pal) return;
    if(scanQ.length){ sndWarn(); toast(L('스캔 전송 중 — 잠시 후 다시 누르세요','Enviando lecturas — espere')); flushScans(); return; }
    api('/api/inbound/'+SHIP+'/pallets/'+pal.id+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({dry:true})})
      .then(function(o){
        if(!o.ok||o.body.error){ sndErr(); toast(L('대조 실패','Error')+': '+(o.body.error||o.status)); return; }
        reconOn=true; renderRecon(pal,o.body);
      })
      .catch(function(){ sndErr(); toast(L('대조 실패 — 네트워크를 확인하세요','Error de red')); });
  }

        +'<td style="text-align:right;padding:5px 8px;font-weight:700">'+l.scanned+'</td>'

    });
    var unknown=rep.unknown||{};
    var unRows=Object.keys(unknown).map(function(c){
      return '<tr style="background:#FDF8EE"><td class="mono" style="padding:5px 8px">'+esc(c)+' <small style="color:#8A6300">'+L('라인에 없음','no en lista')+'</small></td><td style="text-align:right;padding:5px 8px">—</td><td style="text-align:right;padding:5px 8px">'+unknown[c]+'</td><td style="text-align:right;padding:5px 8px">?</td></tr>'; }).join('');
    var tt=tallyTotal();
    var okAll=(diffN===0&&!unRows);
    b.innerHTML='<div class="locked" style="background:'+(okAll?'var(--green)':'#8A6300')+'"><div class="a">'+L('대조 — 패킹리스트 vs 실제 스캔','Comparación — lista vs leído')+'</div>'
      +'<div class="b">'+esc(pal.order_no)+' · '+L('팔렛','Pallet')+' '+pal.pl_no+'</div>'
      +'<div class="c">'+L('스캔','Leído')+' '+fmt(rep.total_scanned)+' / '+fmt(rep.total_expected)+L('박스','cajas')+' · '+fmt(tt.q)+' EA'
      +(okAll?' · ✓ '+L('전부 일치','todo coincide'):' · ⚠ '+L('차이','dif.')+' '+diffN+L('라인',' líneas'))+'</div></div>'
      +'<table style="width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden">'
      +'<thead><tr style="background:#F0EDE4;font-size:11px;color:var(--muted)"><th style="text-align:left;padding:6px 8px">'+L('라인','Línea')+'</th><th style="text-align:right;padding:6px 8px">'+L('예상','Esp.')+'</th><th style="text-align:right;padding:6px 8px">'+L('스캔','Leído')+'</th><th style="text-align:right;padding:6px 8px">'+L('차이','Dif.')+'</th></tr></thead>'
      +'<tbody>'+rows+unRows+'</tbody></table>'
      +'<div class="row" style="margin-top:12px">'
      +'<button class="btn" id="btnConfirm">✔ '+L('입고 확정 (실측 스캔 기준)','Confirmar recepción')+'</button>'
      +'<button class="btn ghost" id="btnReconBack">← '+L('계속 스캔','Seguir escaneando')+'</button></div>'
      +(okAll?'':'<p class="hint" style="margin-top:8px">'+L('차이가 있어도 확정할 수 있습니다 — 실제 스캔한 수가 그대로 저장되고, 차이는 기록으로 남습니다. 부족분은 나중에 더 스캔하고 다시 확정하면 됩니다.','Puede confirmar con diferencias — se guarda lo realmente leído; puede escanear más y reconfirmar.')+'</p>');
    $('btnReconBack').addEventListener('click',function(){ reconOn=false; renderCheck(); });

  function doConfirm(){
    var pal=curSelPal(); if(!pal) return;
    api('/api/inbound/'+SHIP+'/pallets/'+pal.id+'/confirm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})})
      .then(function(o){
        if(!o.ok||o.body.error){ sndErr(); toast(L('확정 실패','Error')+': '+(o.body.error||o.status)); return; }
        sndSaved(); toast('✔ '+L('검수 확정 — 실측 '+fmt(o.body.total_scanned)+'박스 저장','Confirmado — '+fmt(o.body.total_scanned)+' cajas'));
        try{ localStorage.removeItem(qKey()); }catch(e){}
        clearWorking(); scanReset();
        refreshDetail(function(){
          renderDetail();
          // 마지막 팔렛 검수가 끝났으면 바로 입고(마감)로 안내 — 적치를 기다릴 필요 없음(2026-08-17)
          var all=DETAIL&&DETAIL.pallets.length&&DETAIL.pallets.every(palConfirmed);
          if(all&&DETAIL.shipment.status!=='closed'){
            toast('🎉 '+L('모든 팔렛 검수 완료 — [마감] 탭에서 지금 바로 입고할 수 있습니다 (적치는 그 후 계속)','Todo verificado — cierre la recepción en [Cierre]'));
          }

      })
      .catch(function(){ sndErr(); toast(L('확정 실패 — 네트워크를 확인하세요','Error de red')); });
