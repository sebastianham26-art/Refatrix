     ERP 제품 카탈로그를 CTR 개발담당자가 부품별로 점검한다. 화면은 ERP 의 지금 값을 직접 읽는다(사본 없음).
     [확인완료] = 그 자리에서 ERP 제품 마스터 반영(승인 없음) → CRM · 고객 카탈로그에도 같은 값.

<style>
:root{--ink:#13171d;--ink2:#39424e;--mut:#6c7682;--faint:#9aa3ad;--paper:#eceef1;--card:#fff;--line:#dde0e4;--line2:#eef0f2;

*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-size:14px;font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;-webkit-font-smoothing:antialiased}

.wrap{max-width:1320px;margin:0 auto;padding:18px 16px 70px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 12px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.brand{font-weight:800;font-size:21px;letter-spacing:-.02em}

.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}

.btn{font:inherit;font-size:13px;font-weight:800;border-radius:9px;padding:8px 14px;border:1px solid var(--syd);background:var(--syd);color:#fff;cursor:pointer;white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:118px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 13px;cursor:pointer;text-align:left}

.tw{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto}

.code{font-weight:800;white-space:nowrap}

.st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:9px;padding:2px 8px;white-space:nowrap}
.st.pending{background:var(--line2);color:var(--ink2)}.st.draft{background:var(--draft-soft);color:var(--draft)}
.st.changed{background:var(--warn-soft);color:var(--warn)}.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.inact{background:#fbe9e7;color:#a2321f}
.sub{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:12px 0;font-size:12.5px;color:var(--mut)}
/* 편집 서랍 */
.ov{position:fixed;inset:0;background:rgba(19,23,29,.45);z-index:40;display:none}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--paper);z-index:41;transform:translateX(100%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}

.fl .tag{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--syd)}

.was{font-size:11.5px;color:var(--mut);margin-top:6px;word-break:break-word}

.cbox{margin-top:8px;background:var(--warn-soft);border:1px solid #ecc770;border-radius:9px;padding:9px 11px;font-size:12.5px}
.cbox b{color:var(--warn)}
.cbox label{display:flex;gap:7px;align-items:flex-start;margin-top:6px;cursor:pointer}
.cbox .v{word-break:break-word}
.pv{margin-top:8px;font-size:11.5px}
.pv table{border-collapse:collapse;width:100%}
.pv td,.pv th{border-bottom:1px solid var(--line2);padding:3px 6px;text-align:left}
.pv th{font-size:10px;color:var(--mut);font-weight:800}
.sec{font-size:12.5px;font-weight:800;color:var(--mut);margin:16px 2px 8px}
.hist{background:#fff;border:1px solid var(--line);border-radius:11px;padding:4px 12px}
.hi{padding:7px 0;border-bottom:1px dashed var(--line2);font-size:12px}
.hi:last-child{border-bottom:0}
.hi .h{display:flex;gap:8px;flex-wrap:wrap;color:var(--mut);font-size:11px}

.hi .p s{color:#a2321f}
.note{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;resize:vertical;min-height:52px}
.msg{font-size:12.5px;min-height:1em}.msg.err{color:var(--ctr)}.msg.ok{color:var(--ok)}
.mk{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;margin-left:3px;white-space:nowrap}

.mk.quoted{background:#e1edfa;color:#073f78;border:1px solid #9cc2ea}

.rds{display:inline-flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.rd{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:#efe9ff;color:#4b3aa8;border:1px solid #d6ccff;white-space:nowrap}
.cnt{display:inline-block;font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:var(--ok);color:#fff;margin-left:3px}
.cfl{background:#fff;border:1px solid var(--line);border-radius:11px;padding:9px 12px;margin-bottom:10px;font-size:12.5px}
.cfl b{font-size:12.5px}.cfl .dts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.cfl .dt{font-size:11.5px;border:1px solid #9fd3b0;background:var(--ok-soft);color:var(--ok);border-radius:7px;padding:2px 7px;white-space:nowrap}
.cfl .dt.bulk{border-color:#d6ccff;background:#efe9ff;color:#4b3aa8}
.fld select{font:inherit;font-size:13px;width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:#fff}
.fld select+input{margin-top:6px}
.fld :disabled{background:#f4f5f7;color:var(--ink2);cursor:not-allowed}
/* 사진 창 — 편집 서랍 반대쪽(왼쪽). 좁은 화면에서는 서랍 안 맨 위로 */
.ppane{position:fixed;top:0;bottom:0;left:0;right:min(760px,100vw);z-index:41;background:#1b1f26;display:none;flex-direction:column;gap:12px;padding:14px;overflow:auto}
.ppane.on{display:flex}
@media (max-width:1179px){.ppane{display:none!important}}
@media (min-width:1180px){#ppIn{display:none}}
.gal{background:#fff;border-radius:12px;padding:10px 12px;flex:1 1 0;min-height:250px;display:flex;flex-direction:column}
#ppIn .gal{min-height:220px;margin-bottom:10px;border:1px solid var(--line)}
.gal .gh{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px}
.gal .gh .k{font-size:10.5px;font-weight:800;border-radius:7px;padding:2px 8px;color:#fff}
.gal .gh .k.c{background:var(--ctr)}.gal .gh .k.s{background:var(--syd)}
.gal .gh .sp{flex:1}.gal .gc{font-size:12px;color:var(--mut);font-weight:700}
.gal .gi{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:170px;margin-top:6px}
.gal .gi a{display:flex;align-items:center;justify-content:center;max-width:100%;max-height:100%;height:100%}
.gal .gi img{max-width:100%;max-height:100%;object-fit:contain;cursor:zoom-in}
.gal .ar{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:2}
.gal .ar.l{left:2px}.gal .ar.r{right:2px}.gal .ar:disabled{opacity:.3;cursor:default}
.gal .none{color:var(--mut);font-size:12.5px;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:9px;padding:11px 18px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:92vw}

@media (max-width:700px){
  table.list{min-width:0}table.list thead{display:none}

  table.list td.c-syd,table.list td.c-oe{display:none}
  table.list td.c-app{grid-column:1/-1}
  .chip{min-width:0;flex:1 1 30%}
}
</style>

    $('dSt').innerHTML=stBadge(it)+roundsHtml(it)+prioHtml(it);
    $('dSub').textContent=(it.status==='changed'?t('subChanged'):'')+(it.confirmed_at?t('subLast',{by:it.confirmed_by_name||'',at:fmtAt(it.confirmed_at)}):t('subNever'));
    const img=$('dImg'); img.classList.add('hidden'); img.onload=()=>img.classList.remove('hidden'); img.onerror=()=>img.classList.add('hidden'); img.src=CTR_IMG(it.code);
    // 확인완료 날짜 전부 — 몇 번 확인했는지 바로 보이게(최근 순)
    const cf=(it.confirms||[]);
    const cfl=cf.length?('<div class="cfl"><b>'+esc(t('cflHead',{n:cf.length}))+'</b>'+(cf.length>1?' <small style="color:var(--mut)">'+esc(t('cflHint'))+'</small>':'')
      +'<div class="dts">'+cf.map(c=>{ const n=Object.keys(c.applied||{}).length;
        return '<span class="dt'+(c.source==='bulk'?' bulk':'')+'" title="'+esc((c.by||'')+(n?t('dtEdited',{n}):t('dtNoChange'))+(c.note?' · '+c.note:''))+'">'+esc(fmtAt(c.at)+(c.source==='bulk'?t('dtBulk'):'')+(n?t('dtN',{n}):''))+'</span>'; }).join('')+'</div></div>'):'';
    const rdl=(it.rounds||[]).length?('<div class="cfl"><b>'+esc(t('rdHead'))+'</b><div class="dts">'+it.rounds.map(x=>'<span class="dt bulk">'+esc(t('rdItem',{n:x.round,on:x.on||''}))+'</span>').join('')+'</div></div>'):'';
    $('dBody').innerHTML=cfl+rdl+'<div id="ppIn"></div>'+FIELDS.map(fieldHtml).join('')
      +'<div class="fld"><div class="fl"><b>'+esc(t('noteLabel'))+'</b><small>'+esc(t('noteHint'))+'</small></div>'
      +'<textarea class="note" id="eNote" rows="2" maxlength="1000" placeholder="'+esc(t('notePh'))+'">'+esc(it.draft_note||'')+'</textarea></div>'
      +histHtml(it);
    FIELDS.forEach(f=>{ const el=$('e_'+f); el.addEventListener('input',()=>{ markFields(); if(f==='app') schedulePreview(); if(f==='scode') sydFromEditor(); }); });
    Object.keys(PICK).forEach(bindPicker);
    // 겹친 칸 고르기 — 고른 값을 편집칸에도 채워 「무엇이 ERP에 들어가는지」 눈에 보이게
    $('dBody').querySelectorAll('input[type=radio]').forEach(r=>r.onchange=()=>{
      const f=r.name.slice(2); const d=S.cur.draft[f]; S.resolve[f]=r.value;
      const v=r.value==='erp'?d.erp:d.value; $('e_'+f).value=MULTI[f]?lines(v).join('\n'):(v==null?'':v);
      const sel=$('s_'+f); if(sel){ const has=[...sel.options].some(o=>o.value===(v||'')); sel.value=has?(v||''):'__manual'; $('e_'+f).classList.toggle('hidden',has); }
      markFields(); if(f==='app') schedulePreview();
    });
    $('bDiscard').classList.toggle('hidden',it.status!=='draft');
    $('dMsg').textContent=''; $('dMsg').className='msg';
    markFields(); schedulePreview(); renderPhotos();
  }

  // ── 사진 창 — CTR 사진(최대 12장) · SYD 코드별 사진, 화살표로 넘김 ──
  const G={ctr:{list:[],i:0},syd:{list:[],i:0},seq:0};
  function galBox(id,label,cls){
    return '<div class="gal" id="g_'+id+'"><div class="gh"><span class="k '+cls+'" translate="no">'+label+'</span><span class="mono" id="gc_'+id+'" translate="no"></span><span class="sp"></span><span class="gc" id="gn_'+id+'"></span></div>'
      +'<div class="gi"><button type="button" class="ar l" id="gl_'+id+'" aria-label="'+esc(t('gPrev'))+'">‹</button>'
      +'<a id="ga_'+id+'" target="_blank" rel="noopener noreferrer" title="'+esc(t('gZoom'))+'"><img id="gim_'+id+'" referrerpolicy="no-referrer" alt=""></a>'
      +'<div class="none hidden" id="gx_'+id+'"></div>'
      +'<button type="button" class="ar r" id="gr_'+id+'" aria-label="'+esc(t('gNext'))+'">›</button></div></div>';
  }
  function galShow(id){
    const g=G[id], it=g.list[g.i], img=$('gim_'+id); if(!img) return;
    const none=$('gx_'+id), a=$('ga_'+id);
    $('gl_'+id).disabled=g.i<=0; $('gr_'+id).disabled=g.i>=g.list.length-1;
    $('gl_'+id).classList.toggle('hidden',g.list.length<2); $('gr_'+id).classList.toggle('hidden',g.list.length<2);
    $('gn_'+id).textContent=g.list.length>1?((g.i+1)+' / '+g.list.length):'';
    if(!it){ a.classList.add('hidden'); none.classList.remove('hidden'); none.textContent=id==='ctr'?t('noCtr'):t('noSyd'); $('gc_'+id).textContent=''; return; }
    $('gc_'+id).textContent=it.code+(id==='ctr'&&it.n>1?' #'+it.n:'');
    none.classList.add('hidden'); a.classList.remove('hidden'); a.href=it.url;
    img.onerror=()=>{ a.classList.add('hidden'); none.classList.remove('hidden'); none.textContent=t('noPhoto',{b:id==='ctr'?'CTR':'SYD',c:it.code}); };
    img.src=it.url;
  }
  function probe(url){ return new Promise(res=>{ const im=new Image(); im.referrerPolicy='no-referrer'; im.onload=()=>res(true); im.onerror=()=>res(false); im.src=url; }); }
  function sydFromEditor(){
    const codes=lines(edVal('scode')!=null?edVal('scode'):(S.cur&&S.cur.scode));
    const keep=G.syd.list[G.syd.i]&&G.syd.list[G.syd.i].code;
    G.syd.list=codes.map(c=>({code:c,url:SYD_IMG(c)}));
    const k=G.syd.list.findIndex(x=>x.code===keep); G.syd.i=k>=0?k:0; galShow('syd');
  }
  async function renderPhotos(){
    const it=S.cur; if(!it) return;
    const wide=window.matchMedia&&window.matchMedia('(min-width:1180px)').matches;
    const host=wide?$('pp'):$('ppIn'); if(!host) return;
    if(wide){ $('pp').classList.add('on'); $('pp').setAttribute('aria-hidden','false'); }
    const other=wide?$('ppIn'):$('pp'); if(other){ other.innerHTML=''; }
    host.innerHTML=galBox('ctr','CTR','c')+galBox('syd','SYD','s');
    ['ctr','syd'].forEach(id=>{ $('gl_'+id).onclick=()=>{ G[id].i=Math.max(0,G[id].i-1); galShow(id); }; $('gr_'+id).onclick=()=>{ G[id].i=Math.min(G[id].list.length-1,G[id].i+1); galShow(id); }; });
    G.syd.i=0; sydFromEditor();
    const seq=++G.seq; const code=it.code;
    G.ctr={list:[{code,url:CTR_N(code,1),n:1}],i:0}; galShow('ctr');
    // 2번째 사진부터는 있는지 차례로 확인해 붙인다(없으면 거기서 멈춘다)
    for(let n=2;n<=CTR_MAX;n++){
      const ok=await probe(CTR_N(code,n)); if(seq!==G.seq) return;
      if(!ok) break;
      G.ctr.list.push({code,url:CTR_N(code,n),n}); galShow('ctr');
    }
  }
  async function openItem(i){
    const it=S.items[i]; if(!it) return;
    if(S.cur&&S.dirty&&!window.confirm(t('leaveAsk'))) return;
    S.ix=i; S.resolve={};
    try{ setCur(await call('GET','/api/pf-catalog/items/'+it.id)); }catch(e){ toast(e.message); return; }
    renderDrawer(); renderRows();
    $('ov').classList.add('on'); $('dr').classList.add('on'); $('dr').setAttribute('aria-hidden','false'); $('dBody').scrollTop=0;
  }
  function closeDrawer(force){
    if(!force&&S.cur&&S.dirty&&!window.confirm(t('closeAsk'))) return;
    $('ov').classList.remove('on'); $('dr').classList.remove('on'); $('dr').setAttribute('aria-hidden','true');
    $('pp').classList.remove('on'); $('pp').setAttribute('aria-hidden','true'); $('pp').innerHTML=''; G.seq++;
    S.cur=null; S.dirty=false; renderRows();
  }
  function replaceRow(item){
    const k=S.items.findIndex(x=>x.id===item.id);
    if(k>=0) S.items[k]=Object.assign({},S.items[k],item);
  }
  function busy(on){ ['bOk','bSave','bDiscard'].forEach(id=>{ $(id).disabled=on; }); }
  async function saveDraft(){
    busy(true);
    try{
      const r=await call('PUT','/api/pf-catalog/items/'+S.cur.id+'/draft',{fields:edFields(),note:$('eNote').value,loaded:S.loaded,rev:S.rev});
      setCur(r.item); replaceRow(r.item); renderDrawer(); renderRows(); loadSummary();
      $('dMsg').className='msg ok'; $('dMsg').textContent=r.fields.length?t('savedN',{n:r.fields.length}):t('saved0');
    }catch(e){
      if(e.code==='stale_review'&&e.body&&e.body.item){ setCur(e.body.item); replaceRow(e.body.item); renderDrawer(); renderRows();
        $('dMsg').className='msg err'; $('dMsg').textContent=t('staleSave'); }
      else{ $('dMsg').className='msg err'; $('dMsg').textContent=e.message; }
    }
    finally{ busy(false); }
  }
  async function discard(){
    if(!window.confirm(t('discardAsk'))) return;
    busy(true);
    try{ const r=await call('DELETE','/api/pf-catalog/items/'+S.cur.id+'/draft'); setCur(r.item); S.resolve={}; replaceRow(r.item); renderDrawer(); renderRows(); loadSummary(); toast(t('discarded')); }
    catch(e){ $('dMsg').className='msg err'; $('dMsg').textContent=e.message; }
    finally{ busy(false); }
  }
  async function confirmIt(){
    const it=S.cur; const ch=changedFields();
    const unresolved=FIELDS.filter(f=>it.draft&&it.draft[f]&&it.draft[f].state==='conflict'&&!S.resolve[f]);
    if(unresolved.length){ $('dMsg').className='msg err'; $('dMsg').textContent=t('pickFirst',{f:unresolved.map(f=>LABEL[f]).join(', ')}); $('w_'+unresolved[0]).scrollIntoView({block:'center',behavior:'smooth'}); return; }
    const msg=ch.length?t('askApply',{code:it.code,f:ch.map(f=>LABEL[f]).join(', ')}):t('askAsIs',{code:it.code});
    if(!window.confirm(msg)) return;
    busy(true);
    try{
      const r=await call('POST','/api/pf-catalog/items/'+it.id+'/confirm',{fields:edFields(),resolve:S.resolve,note:$('eNote').value,loaded:S.loaded,rev:S.rev});
      const n=Object.keys(r.applied||{}).length;
      toast(t('toastOk',{code:r.code})+(n?t('toastN',{n}):t('toast0')));
      S.dirty=false; S.resolve={}; replaceRow(r.item); loadSummary();
      // 지금 거르기에서 빠지는 품목이면 목록에서도 빠진다 — 그 자리의 다음 품목이 「다음」이다
      const leaves=F.status&&F.status!==r.item.status;
      if(leaves){ S.items.splice(S.ix,1); S.total=Math.max(0,S.total-1); }
      const nextIx=leaves?S.ix:S.ix+1;
      if($('goNext').checked&&S.items[nextIx]){ S.cur=null; renderRows(); await openItem(nextIx); }
      else{ setCur(r.item); renderDrawer(); renderRows(); }
      if(leaves&&S.items.length<5) loadList(true);
    }catch(e){
      if((e.code==='conflict'||e.code==='stale'||e.code==='stale_review')&&e.body&&e.body.item){
        setCur(e.body.item); replaceRow(e.body.item); renderDrawer(); renderRows();
        $('dMsg').className='msg err';
        $('dMsg').textContent=e.code==='conflict'?t('cConflict')
          :e.code==='stale'?t('cStale',{f:(e.body.fields||[]).map(f=>I18N.ko['f_'+f]?LABEL[f]:f).join(', ')})
          :t('cStaleReview');
        const f0=(e.body.conflicts||[])[0]||{field:(e.body.fields||[])[0]}; if(f0&&f0.field&&$('w_'+f0.field)) $('w_'+f0.field).scrollIntoView({block:'center',behavior:'smooth'});
      }else{ $('dMsg').className='msg err'; $('dMsg').textContent=e.message; }
    }finally{ busy(false); }
  }

  // ── 엑셀 다운로드 — 위치(GPS)를 받아 서버에 기록한 뒤에만 데이터가 온다 ──
  function getGps(){
    return new Promise(res=>{
      if(!navigator.geolocation) return res({status:'unavailable',gps:null});
      navigator.geolocation.getCurrentPosition(
        p=>res({status:'ok',gps:{lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}}),
        e=>res({status:e&&e.code===1?'denied':'unavailable',gps:null}),
        {timeout:10000,maximumAge:60000,enableHighAccuracy:false});
    });
  }
  function loadSheetJS(){
    if(window.XLSX) return Promise.resolve(true);
    return new Promise(res=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload=()=>res(!!window.XLSX); sc.onerror=()=>res(false); document.head.appendChild(sc); });
  }
  const ST_ES={pending:'Sin revisar',draft:'En edición',changed:'Revisar de nuevo',ok:'Confirmado (CTR)',bulk:'Revisado (ERP)'};
  function stamp(d){ const p=x=>String(x).padStart(2,'0'); return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes()); }
  async function downloadXlsx(){
    const btn=$('bXlsx'), m=$('xMsg'); m.className='msg'; m.textContent='';
    btn.disabled=true; btn.textContent=t('xGps');
    try{
      const g=await getGps();
      if(g.status==='denied'){ m.className='msg err'; m.textContent=ERR.location_required; return; }
      btn.textContent=t('xPrep');
      const [ok,d]=await Promise.all([loadSheetJS(),call('POST','/api/pf-catalog/export',{filters:{q:F.q,status:F.status,active:F.active==='1'?'1':'all',round:F.round,tag:F.tag},gps:g.gps,gps_status:g.status})]);
      if(!ok){ m.className='msg err'; m.textContent=t('xNoLib',{id:d.export_id}); return; }
      const at=new Date(d.at);
      const cat=d.items.map(it=>({'Clave CTR':it.code,'Producto':it.name||'','Activo':it.activo?'Sí':'No','Clave SyD':it.scode||'',
        'Aplicación':it.app||'','OE':it.oe||'','Material':it.material||'','Revisión CTR':(it.status==='ok'&&it.confirmed_source==='bulk'?ST_ES.bulk:(ST_ES[it.status]||it.status)),
        'Confirmado por':it.confirmed_by_name||'','Fecha confirmación':it.confirmed_at?new Date(it.confirmed_at).toLocaleString('sv-SE').slice(0,16):'',
        'Veces confirmado':it.confirm_count||0,
        'Prioridad':it.prio===1?'1 Corea':it.prio===2?'2 VIO top 30':it.prio===3?'3 China':'',
        'VIO (rank)':it.vio_rank==null?'':it.vio_rank,
        'Vendido':it.sold?'Sí':'No','Cotizado':it.quoted?'Sí':'No',
        ...Object.fromEntries([1,2,3,4,5].map(n=>{ const x=(it.rounds||[]).find(r=>r.round===n); return ['Revisión '+n+'ª',x?x.on:'']; }))}));
      const apps=d.apps.map(a=>({'Clave CTR':a.code,'Marca':a.marca||'','Modelo':a.modelo||'','Año desde':a.desde==null?'':a.desde,'Año hasta':a.hasta==null?'':a.hasta,'Texto original':a.texto||''}));
      const info=[['REFATRIX — Catálogo de productos (sin precios ni existencias)'],[''],
        ['Descargado por',d.by],['Fecha y hora',at.toLocaleString('sv-SE')],['ID de descarga','#'+d.export_id],
        ['Productos',d.items.length+(d.truncated?' (límite '+d.max+')':'')],['Ubicación',g.gps?(g.gps.lat.toFixed(5)+', '+g.gps.lng.toFixed(5)+' (±'+Math.round(g.gps.acc)+' m)'):'GPS no disponible — registrada por IP'],
        [''],['CONFIDENCIAL — Propiedad de REFATRIX. Prohibida su reproducción o entrega a terceros. Esta descarga quedó registrada con usuario, fecha, hora y ubicación.']];
      const wb=XLSX.utils.book_new();
      const ws1=XLSX.utils.json_to_sheet(cat.length?cat:[{'Clave CTR':''}]); ws1['!cols']=[{wch:12},{wch:34},{wch:7},{wch:22},{wch:60},{wch:30},{wch:10},{wch:16},{wch:16},{wch:17}];
      XLSX.utils.book_append_sheet(wb,ws1,'Catalogo');
      const ws2=XLSX.utils.json_to_sheet(apps.length?apps:[{'Clave CTR':''}]); ws2['!cols']=[{wch:12},{wch:16},{wch:26},{wch:10},{wch:10},{wch:44}];
      XLSX.utils.book_append_sheet(wb,ws2,'Aplicaciones');
      const ws3=XLSX.utils.aoa_to_sheet(info); ws3['!cols']=[{wch:18},{wch:70}];
      XLSX.utils.book_append_sheet(wb,ws3,'Info');
      XLSX.writeFile(wb,'REFATRIX_Catalogo_'+stamp(at)+'_'+d.export_id+'.xlsx');
      m.className='msg ok'; m.textContent=t('xDone',{n:d.items.length.toLocaleString('en-US'),id:d.export_id})+(g.gps?'':t('xIp'))+(d.truncated?t('xMax',{max:d.max}):'');
    }catch(e){ m.className='msg err'; m.textContent=e.message; }
    finally{ btn.disabled=false; btn.textContent=t('xlsx'); }
  }
  $('bXlsx').onclick=downloadXlsx;

  $('dX').onclick=()=>closeDrawer(); $('ov').onclick=()=>closeDrawer();
  $('bSave').onclick=saveDraft; $('bDiscard').onclick=discard; $('bOk').onclick=confirmIt;
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&$('dr').classList.contains('on')) closeDrawer(); });
  let qTimer=null;
  $('q').addEventListener('input',()=>{ clearTimeout(qTimer); qTimer=setTimeout(()=>{ F.q=$('q').value.trim(); F.offset=0; loadList(); },300); });
  $('sort').onchange=()=>{ F.sort=$('sort').value; F.offset=0; loadList(); };
  $('round').onchange=()=>{ F.round=$('round').value; F.offset=0; loadList(); };
  $('tag').onchange=()=>{ F.tag=$('tag').value; F.offset=0; loadList(); };
  $('act').onchange=()=>{ F.active=$('act').checked?'1':'all'; F.offset=0; renderChips(); loadList(); };
  window.addEventListener('beforeunload',e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=''; } });

  // ── 화면 언어 바꾸기 — 열려 있는 품목의 고친 내용은 그대로 둔다 ──
  function applyStatic(){
    document.documentElement.lang=LANG; document.title=t('title');
    document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n,{n:el.dataset.n}); });
    document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML=t(el.dataset.i18nHtml); });
    document.querySelectorAll('[data-i18n-ph]').forEach(el=>{ el.placeholder=t(el.dataset.i18nPh); });
    document.querySelectorAll('[data-i18n-title]').forEach(el=>{ el.title=t(el.dataset.i18nTitle); });
    document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label',t(el.dataset.i18nAria)); });
    $('lang').querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.l===LANG); b.setAttribute('aria-pressed',b.dataset.l===LANG?'true':'false'); });
  }
  function setLang(l){
    if(!LANGS.includes(l)||l===LANG) return;
    LANG=l; try{ localStorage.setItem('rfx_pf_lang',l); }catch(e){}
    applyStatic();
    if(sess&&sess.name&&!$('app').classList.contains('hidden')) $('who').textContent=t('who',{name:sess.name});
    if(!$('gate').classList.contains('hidden')) gate();
    $('xMsg').textContent=''; $('xMsg').className='msg';
    renderChips(); if(S.items.length||!$('app').classList.contains('hidden')) renderRows();
    if(S.cur&&$('dr').classList.contains('on')){
      const keep={}; FIELDS.forEach(f=>{ const e=$('e_'+f), s2=$('s_'+f); keep[f]={v:e?e.value:null,s:s2?s2.value:null}; });
      const note=$('eNote')?$('eNote').value:null, msg=$('dMsg').textContent, msgCls=$('dMsg').className, dirty=S.dirty;
      renderDrawer();
      FIELDS.forEach(f=>{ const e=$('e_'+f), s2=$('s_'+f), k=keep[f]; if(e&&k.v!=null) e.value=k.v;
        if(s2&&k.s!=null){ s2.value=k.s; if(e) e.classList.toggle('hidden',k.s!=='__manual'); } });
      if(note!=null) $('eNote').value=note;
      markFields(); sydFromEditor(); schedulePreview(); S.dirty=dirty||!draftMatches();
      $('dMsg').textContent=msg; $('dMsg').className=msgCls;
    }
  }
  $('lang').querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
  applyStatic();

  (async function boot(){
    if(platformSession()) $('back').classList.remove('hidden');
    if(!sess||!sess.token){ if(!(await exchange())){ gate(); return; } }
    $('who').textContent=t('who',{name:sess.name||''});
    $('app').classList.remove('hidden');
    await Promise.all([loadSummary(),loadList(),call('GET','/api/pf-catalog/options').then(o=>{ OPTS=o; }).catch(()=>{ OPTS=null; })]);
  })();
})();
</script>
