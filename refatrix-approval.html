async function api(method,path,body){
 const opt={method,headers:{'Authorization':'Bearer '+session.token}};
 if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
 let res;try{res=await fetch(session.api+path,opt);}catch(e){throw {error:'network',detail:'서버에 연결할 수 없습니다'};}
 let d={};try{d=await res.json();}catch(e){}
 if(!res.ok){if(res.status===401){showLogin();}if(res.status===413)d={error:'too_large'};throw d||{error:res.status};}
 return d;
}
function portalSession(){
 try{const raw=sessionStorage.getItem('refatrix_session');if(raw){const o=JSON.parse(raw);if(o&&o.token)return o;}}catch(e){}
 try{const h=location.hash.slice(1);if(h){const p=new URLSearchParams(h);const token=p.get('token');if(token){const o={token,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')};try{sessionStorage.setItem('refatrix_session',JSON.stringify(o));}catch(e){}return o;}}}catch(e){}
 return null;
}

const U=id=>{if(id==null)return '—';const u=B&&B.users.find(x=>same(x.id,id));return u?u.name:'#'+id;};
const UT=id=>{const u=B&&B.users.find(x=>same(x.id,id));return u?(u.dept||ROLE_KO[u.role]||u.role):'';};
const ROLE_KO={director:'디렉터',socio:'소시오',treasury:'재무',marketing:'마케팅',ops:'영업지원',sales:'영업',sales_support:'영업지원',warehouse:'창고',viewer:'뷰어'};
const catName=id=>{const c=B&&B.categories.find(x=>same(x.id,id));return c?c.name:'—';};
const SL=t=>(B&&B.step_label[t])||t;
const STAGE_L={draft:'기안',progress:'결재중',exec:'집행',post:'사후'};
const STAGE_BADGE={draft:['임시저장','gray'],rejected:['반려','red'],progress:['결재중','blue'],pre:['사전승인 대기','gold'],execwait:['집행대기','gold'],postwait:['사후승인 대기','blue'],flagged:['이의제기','red'],closed:['완결','brand']};
function badges(d){
 if(d.status!=='approved'){const s=STAGE_BADGE[d.stage]||['?','gray'];return `<span class="bdg b-${s[1]}">${s[0]}</span>`;}
 let a='<span class="bdg b-green">승인</span>';
 if(d.exec_status!=='done')return a+'<span class="bdg b-gold">집행대기</span>';
 a+='<span class="bdg b-teal">집행완료</span>';
 a+=d.post_status==='confirmed'?'<span class="bdg b-brand">완결</span>':d.post_status==='flagged'?'<span class="bdg b-red">이의제기</span>':'<span class="bdg b-blue">사후대기</span>';
 return a;
}
function flagsOf(d){
 const f=[],tol=B.settings.variance_tolerance_pct;
 if(d.status!=='draft'&&!d.files_n)f.push('<span class="flag">증빙 없음</span>');
 if(d.director_no_finance)f.push('<span class="flag g">디렉터 기안·재무합의 없음</span>');
 if(d.variance_pct!=null&&d.variance_pct>tol)f.push(`<span class="flag">실적 +${d.variance_pct.toFixed(1)}%</span>`);
 if(d.exec_status==='done'&&!d.has_exec_evidence)f.push('<span class="flag">실적증빙 없음</span>');
 if(d.dup)f.push('<span class="flag">중복 증빙 의심</span>');
 if(d.version>1)f.push(`<span class="flag g">재기안 v${d.version}</span>`);
 return f.join('');
}

/* ═════════ 상세 ═════════ */
function sealText(l){
 if(l.status==='done')return({draft:'기안',agree:'합의',pass:'확인',post_ceo:'확인'})[l.step_type]||'승인';
 return({rejected:l.step_type==='agree'?'반대':'반려',flagged:'이의',pending:'대기중',waiting:'예정',skipped:'—'})[l.status];
}
function stampBox(l){
 const ceo=l.step_type==='pre_ceo'||l.step_type==='post_ceo';
 return `<div class="stp ${ceo?'ceo':''}" title="${esc(l.comment||'')}"><div class="lb">${SL(l.step_type)}</div><div class="nm">${esc(U(l.user_id))}</div><div class="seal ${l.status}">${sealText(l)}</div>${l.acted_at?tm(l.acted_at):'<span class="t">—</span>'}</div>`;
}
function stampsHtml(d,lines){
 if(!lines.length)return '<p class="sub" style="margin:0">상신하면 결재선이 확정됩니다.</p>';
 const main=lines.filter(l=>l.step_type!=='post_ceo').map(stampBox);
 const es=d.status==='rejected'?'skipped':d.exec_status==='done'?'done':d.exec_status==='pending'?'pending':'waiting';
 main.push(`<div class="stp exec"><div class="lb">집행 (재무)</div><div class="nm">${esc(d.exec_by?U(d.exec_by):U(B.settings.finance_user_id))}</div><div class="seal ${es}">${({done:'집행',pending:'대기중',waiting:'예정',skipped:'—'})[es]}</div>${d.exec_at?tm(d.exec_at):'<span class="t">—</span>'}</div>`);
 const pl=lines.find(l=>l.step_type==='post_ceo');if(pl)main.push(stampBox(pl));
 return `<div class="stamps">${main.join('<span class="arrow">›</span>')}</div>`;
}
function extOf(name){const m=String(name||'').toLowerCase().match(/\.([a-z0-9]{1,5})$/);return m?m[1]:'';}
function fileIcon(name){
 const ext=extOf(name);
 const cls=ext==='pdf'?'pdf':/^docx?$/.test(ext)?'doc':/^pptx?$/.test(ext)?'ppt':/^(xlsx?|csv)$/.test(ext)?'xls':/^(jpe?g|png|heic|heif|webp|gif)$/.test(ext)?'img':ext==='xml'?'xml':'etc';
 return `<div class="ic ${cls}">${esc(ext.toUpperCase().slice(0,4)||'FILE')}</div>`;
}
function fileRow(f,d){
 let cf='';
 if(f.cfdi_uuid||f.cfdi_total!=null){const mis=d.exec_status==='done'&&f.cfdi_total!=null&&Math.abs(f.cfdi_total-d.actual_total)>0.5;cf=`<div class="fm">CFDI ${f.cfdi_uuid?esc(f.cfdi_uuid.slice(0,8))+'…':''} · RFC ${esc(f.cfdi_rfc||'—')} · ${f.cfdi_total!=null?money(f.cfdi_total):'—'}${mis?' · <span class="flag">실적금액과 불일치</span>':''}</div>`;}
 return `<div class="file ${f.voided_at?'void':''}">${fileIcon(f.file_name)}<div style="flex:1;min-width:0">
  <div class="fn">${esc(f.file_name)}</div>
  <div class="fm"><span class="bdg b-gray">${esc(f.kind)}</span><span class="bdg b-teal">${STAGE_L[f.stage]||f.stage}</span>${f.comment_id?'<span class="bdg b-blue">💬 댓글</span>':''}${fsize(f.file_size)} · ${esc(U(f.uploaded_by))} · ${tm(f.uploaded_at)}</div>${cf}
  ${f.dup_of?`<div class="fm"><span class="flag">⚠ 동일 파일이 ${esc(f.dup_of)}에서도 사용됨</span></div>`:''}
  ${f.voided_at?`<div class="fm">무효 처리 · ${esc(U(f.voided_by))} · ${tm(f.voided_at)} · ${esc(f.void_reason)}</div>`:''}
 </div><div class="acts"><button class="btn sm" data-act="fopen" data-fid="${f.id}">열기</button>${f.can_delete?`<button class="btn sm danger" data-act="fdel" data-fid="${f.id}">삭제</button>`:''}${f.can_void?`<button class="btn sm danger" data-act="fvoid" data-fid="${f.id}">무효</button>`:''}</div></div>`;
}
const EV_L={submit:'상신',approve:'승인',agree:'합의',pass:'경유 확인',reject:'반려',disagree:'반대 (반려)',approved:'결재 완료 · 집행대기',execute:'집행완료',flag:'이의제기',close_flag:'이의 종결 · 사후 확인',post_confirm:'사후승인 확인',withdraw:'회수',resubmit_from:'재기안',resubmitted:'재기안 문서 작성',file_delete:'증빙 삭제',file_void:'증빙 무효 처리',link:'결재문서 연결'};
function timeline(){
 const it=[];
 DET.events.forEach(e=>it.push({k:'ev',at:e.created_at,e}));
 DET.comments.forEach(c=>it.push({k:'cmt',at:c.created_at,c}));
 DET.files.filter(f=>!f.comment_id).forEach(f=>it.push({k:'file',at:f.uploaded_at,f}));
 return it.sort((a,b)=>String(a.at).localeCompare(String(b.at)));
}
function tlItem(x){
 if(x.k==='cmt')return cmtItem(x.c);
 if(x.k==='file')return `<li><div class="av sys">📎</div><div style="flex:1;min-width:0"><div class="hd"><b>${esc(U(x.f.uploaded_by))}</b> 증빙 등록${tm(x.at)}</div><div class="tx">${esc(x.f.file_name)} <span class="bdg b-gray">${esc(x.f.kind)}</span></div></div></li>`;
 const e=x.e,lab=EV_L[e.action]||e.action,bad=/reject|disagree|flag$/.test(e.action)&&e.action!=='close_flag';
 if(e.actor_id==null)return `<li><div class="av sys">⚙</div><div style="flex:1;min-width:0"><div class="hd"><b>시스템</b>${tm(e.created_at)}</div><div class="tx">${esc(e.detail||lab)}</div></div></li>`;
 return `<li><div class="av">${esc(U(e.actor_id)[0]||'?')}</div><div style="flex:1;min-width:0"><div class="hd"><b>${esc(U(e.actor_id))}</b>${e.step_type&&e.step_type!=='draft'?' · '+SL(e.step_type):''} <span class="bdg ${bad?'b-red':e.action==='submit'?'b-gray':'b-green'}">${lab}</span>${tm(e.created_at)}</div>${e.detail?`<div class="tx">${esc(e.detail)}</div>`:''}</div></li>`;
}

function actionsHtml(){
 const d=DET.doc,a=DET.actions,b=[],mine=DET.lines.find(l=>l.status==='pending'&&same(l.user_id,B.me.id));
 if(a.includes('reject'))b.push(btn('reject',mine&&mine.step_type==='agree'?'반대 (반려)':'반려','danger'));
 if(a.includes('approve')){const t=mine?({pass:'경유 확인',agree:'합의',pre_ceo:'사전승인'})[mine.step_type]||'승인':'승인';b.push(btn('approve',t,'pri'));}
 if(a.includes('flag'))b.push(btn('flag','이의제기','danger'));
 if(a.includes('post_confirm'))b.push(btn('approve','사후승인 확인','pri'));
 if(a.includes('close_flag'))b.push(btn('postclose','이의 종결 · 사후 확인','pri'));
 if(a.includes('execute'))b.push(btn('exec','집행 처리','gold'));
 if(a.includes('withdraw'))b.push(btn('withdraw','회수',''));
 if(a.includes('edit'))b.push(btn('edit','편집',''));
 if(a.includes('submit'))b.push(btn('submitd','상신','pri'));
 if(a.includes('resubmit'))b.push(btn('resubmit','수정 후 재기안','pri'));
 if(d.status==='draft'&&!d.doc_no&&same(d.drafter_id,B.me.id))b.unshift(btn('deldraft','임시저장 삭제','danger'));
 return b.join('');
}

function pendList(arr,key){
 return arr.map((f,i)=>`<div class="file" style="margin-top:6px">${fileIcon(f.name)}<div style="flex:1;min-width:0"><div class="fn">${esc(f.name)}</div><div class="fm">${fsize(f.size)}</div></div>
 <select class="inp" style="width:auto;min-height:32px;padding:4px 6px;font-size:12.5px" data-kind="${key}" data-i="${i}">${B.kinds.map(k=>`<option ${k===f.kind?'selected':''}>${k}</option>`).join('')}</select>
 <button class="x" data-act="prm" data-key="${key}" data-i="${i}" aria-label="제거">✕</button></div>`).join('');
}
const getArr=k=>k==='c'?ui.cmtFiles:k==='m'?ui.mFiles:ui.cd.newFiles;
function refreshPend(k){const el=$('#pl-'+k);if(el)el.innerHTML=pendList(getArr(k),k);}
function guessKind(name){
 const s=String(name||'').toLowerCase();
 if(s.endsWith('.xml'))return 'Factura XML';
 if(/factura|cfdi/.test(s)&&s.endsWith('.pdf'))return 'Factura PDF';
 if(/송금|spei|transfer|comprobante/.test(s))return '송금증';
 if(/견적|cotiz|quote/.test(s))return '견적서';
 if(/계약|contrato/.test(s))return '계약서';
 if(/\.(jpe?g|png|heic|heif|webp|gif)$/.test(s))return '영수증';
 return '기타';
}
const readDataUrl=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(file);});
async function uploadFiles(docId,arr,commentId){
 let n=0;
 for(const f of arr){
  n++;toast(`업로드 중 ${n}/${arr.length} · ${f.name}`);
  const data_url=await readDataUrl(f.file);
  const r=await api('POST',`/api/approvals/${docId}/files`,{file_name:f.name,kind:f.kind,data_url,comment_id:commentId||undefined});
  if(r.dup_of)toast(`⚠ ${f.name}: ${r.dup_of}에서 사용된 파일`);
 }
}

function cdCalc(cd){const s=r2(cd.planned_sub),iva=cd.iva_applied?r2(s*0.16):0;return{sub:s,iva,total:r2(s+iva)};}
function previewLines(cd){
 const S=B.settings,me=B.me.id,c=cdCalc(cd);
 const isDir=B.me.isDirector||same(me,S.director_user_id);
 const ls=[{t:'draft',u:me}];const add=(t,u)=>{if(u==null||same(u,me))return;if(ls.some(x=>x.t===t&&same(x.u,u)))return;ls.push({t,u});};
 if(isDir){if(cd.include_finance)add('agree',S.finance_user_id);ls.push({t:'director',u:me});}
 else{const cat=B.categories.find(x=>same(x.id,cd.category_id));(cat?cat.steps:[]).forEach(s=>add(s.step_type,s.user_id));ls.push({t:'director',u:S.director_user_id});}
 const ceoD=same(me,S.ceo_user_id),b=S.threshold_basis==='sub'?c.sub:c.total,pre=!ceoD&&b>=S.ceo_pre_threshold;
 if(pre)ls.push({t:'pre_ceo',u:S.ceo_user_id});
 ls.push({t:'post_ceo',u:ceoD?S.director_user_id:S.ceo_user_id});
 return{ls,pre,b};
}

async function saveCd(submit){
 if(ui.busy)return;
 const cd=ui.cd;
 if(!cd.title.trim()){toast('제목을 입력하세요');return;}
 if(submit&&!cd.category_id){toast('카테고리를 선택하세요');return;}
 if(submit&&!(r2(cd.planned_sub)>0)){toast('예정금액을 입력하세요');return;}
 ui.busy=true;
 const body={category_id:cd.category_id?Number(cd.category_id):null,title:cd.title,vendor:cd.vendor,pay_due:cd.pay_due||null,pay_method:cd.pay_method,planned_sub:r2(cd.planned_sub),iva_applied:cd.iva_applied,body:cd.body,refs:cd.refs,shares:cd.shares,include_finance:cd.include_finance};
 try{
  if(cd.id)await api('PUT','/api/approvals/'+cd.id,body);else cd.id=(await api('POST','/api/approvals',body)).id;
  if(cd.newFiles.length){await uploadFiles(cd.id,cd.newFiles);cd.newFiles=[];}
  if(submit){const r=await api('POST',`/api/approvals/${cd.id}/submit`);const id=cd.id;ui.cd=null;toast('상신되었습니다 · '+r.doc_no);await loadList();openDoc(id);}
  else{toast('임시저장되었습니다');DET=await api('GET','/api/approvals/'+cd.id);ui.cd=cdFromDet();await loadList();render();}
 }catch(e){toast(errText(e));if(cd.id){try{DET=await api('GET','/api/approvals/'+cd.id);ui.cd.files=DET.files.slice();render();}catch(x){}}}
 finally{ui.busy=false;}
}

 if(ui.view==='compose'&&!ui.cd)ui.cd=newCd();
 renderTabs();
 $('#app').innerHTML=({board:renderBoard,detail:renderDetail,compose:renderCompose,ceo:renderCeo,report:renderReport,settings:renderSettings})[ui.view]();
 if(ui.view==='compose')updateCompose();

async function start(){
 $('#loginCard').classList.add('hidden');
 try{await loadBoot();await loadList();}
 catch(e){if(e&&e.error==='unauthorized')return;$('#app').innerHTML=`<div class="card sec warn red">불러오지 못했습니다: ${esc(errText(e))}<br>마이그레이션(0234_e_approval) 적용 여부를 확인하세요.</div>`;return;}
 $('#who').innerHTML=`<b>${esc(B.me.name)}</b><br>${esc(B.me.isCeo?'대표이사':ROLE_KO[B.me.role]||B.me.role)}`;
 $('#tabs').classList.remove('hidden');$('#bellBtn').classList.remove('hidden');
 if(!ui.mon)ui.mon=todayMX().slice(0,7);
 const m=location.hash.match(/(?:^#|&)doc=(\d+)/);
 if(m)openDoc(m[1]);else render();
 refreshBell();
}
(function boot(){
 const ps=portalSession();
 if(ps&&ps.token){session={token:ps.token,api:(ps.api||$('#apiUrl').value).replace(/\/+$/,''),user:ps.user};start();}
 else showLogin();
})();
