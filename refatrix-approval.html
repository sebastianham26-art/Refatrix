<body>
<div class="wrap">
 <div class="top">
  <div><div class="ttl0">전자결재</div><div class="sub0">비용집행 품의 · 사전/사후승인 · 증빙</div></div>
  <div class="who" id="who"></div>
  <button class="bell hidden" id="bellBtn" data-act="bell" aria-label="알림">🔔<i id="bellCnt"></i></button>
 </div>
 <div class="card login hidden" id="loginCard">
  <h3 style="margin:0 0 10px;color:var(--brand)">로그인</h3>
  <div class="fld"><label>API 주소</label><input class="inp" id="apiUrl" value="https://refatrix-production.up.railway.app"></div>
  <div class="fld"><label>아이디</label><input class="inp" id="lid" autocomplete="username"></div>
  <div class="fld"><label>PIN</label><input class="inp" id="pin" type="password" autocomplete="current-password"></div>
  <button class="btn pri" data-act="login" style="width:100%">로그인</button>
  <p class="sub" id="loginMsg"></p>
 </div>
 <nav class="tabs hidden" id="tabs"></nav>
 <main id="app"><div class="loading">불러오는 중…</div></main>
</div>
<div id="notifPanel" class="notif hidden"></div>
<div id="modal" class="modal hidden"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast"></div>
<input type="file" id="imgPick" multiple hidden accept="image/*">
<input type="file" id="filePick" multiple hidden accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.csv,.txt,.jpg,.jpeg,.png,.gif,.heic,.heif,.webp,.xml,.zip,.eml,.msg,image/*">
<script>
'use strict';
/* ═════════ 세션 · API ═════════ */
let session={token:null,api:'',user:null};
let B=null;              // bootstrap: me · settings · categories · users · 상수
let LIST=[];             // 게시판 목록
let DET=null;            // 상세
let REP=null;            // 리포트
let NOTIFS=[];
const ui={view:'board',box:'todo',flt:'all',cat:'',q:'',noEvid:false,docId:null,cd:null,cmtFiles:[],mFiles:[],modal:null,pick:null,postSel:new Set(),postCat:'',mon:'',busy:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v??'').replace(/[^0-9.\-]/g,''));return isFinite(x)?x:0;};
const r2=v=>Math.round((num(v)+Number.EPSILON)*100)/100;
// 현재 처리자 대기 시간 — 1일 이상 노랑, 3일 이상 빨강
function ageOf(iso){
 if(!iso)return null;const ms=Date.now()-new Date(iso).getTime();if(!(ms>=0))return{t:'방금',c:''};
 const m=Math.floor(ms/60000),h=Math.floor(m/60),d=Math.floor(h/24);
 const t=m<1?'방금':m<60?`${m}분째`:h<24?`${h}시간째`:d<7&&h%24?`${d}일 ${h%24}시간째`:`${d}일째`;
 return{t,c:h>=72?'hot':h>=24?'warn':''};
}
function agoHtml(iso){const a=ageOf(iso);return a?`<span class="ago ${a.c}" data-since="${esc(iso)}" title="차례가 된 시각 ${esc(fmtT(iso,'America/Mexico_City').slice(0,16))}">${a.t}</span>`:'';}
function curHtml(d,cls){const ps=d.current_parts&&d.current_parts.length?d.current_parts:(d.current?[{who:d.current,since:null}]:[]);
 return ps.map(p=>`<span class="${cls||''}">${esc(p.who)}${agoHtml(p.since)}</span>`).join(cls==='cp'?'':', ');}
function curText(d){return (d.current_parts||[]).map(p=>p.who+(ageOf(p.since)?` (${ageOf(p.since).t})`:'')).join(', ')||d.current||'';}
const money=v=>'$'+Number(v||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtT=(iso,tz)=>new Intl.DateTimeFormat('sv-SE',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(iso));
function tm(iso){if(!iso)return '';const mx=fmtT(iso,'America/Mexico_City'),kr=fmtT(iso,'Asia/Seoul');return `<time datetime="${esc(iso)}" title="${mx} (멕시코) · ${kr} (한국)">${mx.slice(0,16)}</time>`;}
const todayMX=()=>fmtT(new Date().toISOString(),'America/Mexico_City').slice(0,10);
const fsize=b=>b>=1048576?(b/1048576).toFixed(1)+'MB':Math.max(1,Math.round(b/1024))+'KB';
const val=s=>{const el=$(s);return el?el.value.trim():'';};
const same=(a,b)=>a!=null&&b!=null&&Number(a)===Number(b);
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('on'),2800);}

const ERRMSG={not_your_turn:'이미 처리되었거나 내 차례가 아닙니다',bad_state:'현재 상태에서는 할 수 없습니다',memo_required:'사유를 입력하세요',
 exec_evidence_required:'Factura(XML/PDF) 또는 송금증이 1건 이상 필요합니다',director_unset:'설정에서 디렉터 결재자를 먼저 지정해야 합니다',
 ceo_unset:'설정에서 대표이사 계정을 먼저 지정해야 합니다',too_large:'20MB를 넘는 파일입니다',bad_type:'지원하지 않는 파일 형식입니다',
 director_only:'디렉터만 할 수 있습니다',forbidden:'권한이 없습니다',not_found:'문서를 찾을 수 없거나 열람 권한이 없습니다',
 category_required:'카테고리를 선택하세요',amount_required:'예정금액을 입력하세요',title_required:'제목을 입력하세요',duplicate:'이미 있는 단계입니다',
 doc_not_found:'문서번호를 확인하세요',bad_user:'사용할 수 없는 사용자입니다',bad_comment:'댓글을 확인하세요',unauthorized:'로그인이 만료되었습니다. 다시 로그인하세요'};
const errText=d=>ERRMSG[d&&d.detail]||ERRMSG[d&&d.error]||(d&&(d.detail||d.error))||'오류';

async function api(method,path,body){
 const opt={method,headers:{'Authorization':'Bearer '+session.token}};
 if(body!==undefined){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body);}
 let res;try{res=await fetch(session.api+path,opt);}catch(e){throw {error:'network',detail:'서버에 연결할 수 없습니다'};}
 let d={};try{d=await res.json();}catch(e){}
 if(!res.ok){if(res.status===401){showLogin();}if(res.status===413)d={error:'too_large'};throw d||{error:res.status};}
 return d;
}
function portalSession(){
 try{const raw=sessionStorage.getItem('refatrix_session');if(raw){const o=JSON.parse(raw);if(o&&o.token)return o;}}catch(e){}
 try{const h=location.hash.slice(1);if(h){const p=new URLSearchParams(h);const token=p.get('token');if(token){const o={token,api:p.get('api')||'',user:JSON.parse(p.get('user')||'{}')};try{sessionStorage.setItem('refatrix_session',JSON.stringify(o));}catch(e){}return o;}}}catch(e){}
 return null;
}
function showLogin(){$('#loginCard').classList.remove('hidden');$('#tabs').classList.add('hidden');$('#app').innerHTML='';}

/* ═════════ 표시 도우미 ═════════ */
const U=id=>{if(id==null)return '—';const u=B&&B.users.find(x=>same(x.id,id));return u?u.name:'#'+id;};
const UT=id=>{const u=B&&B.users.find(x=>same(x.id,id));return u?(u.dept||ROLE_KO[u.role]||u.role):'';};
const ROLE_KO={director:'디렉터',socio:'소시오',treasury:'재무',marketing:'마케팅',ops:'영업지원',sales:'영업',sales_support:'영업지원',warehouse:'창고',viewer:'뷰어'};
const catName=id=>{const c=B&&B.categories.find(x=>same(x.id,id));return c?c.name:'—';};
const SL=t=>(B&&B.step_label[t])||t;
const STAGE_L={draft:'기안',progress:'결재중',exec:'집행',post:'사후'};
const STAGE_BADGE={draft:['임시저장','gray'],rejected:['반려','red'],progress:['결재중','blue'],pre:['사전승인 대기','gold'],execwait:['집행대기','gold'],postwait:['사후승인 대기','blue'],flagged:['이의제기','red'],closed:['완결','brand']};
function badges(d){
 if(d.status!=='approved'){const s=STAGE_BADGE[d.stage]||['?','gray'];return `<span class="bdg b-${s[1]}">${s[0]}</span>`;}
 let a='<span class="bdg b-green">승인</span>';
 if(d.exec_status!=='done')return a+'<span class="bdg b-gold">집행대기</span>';
 a+='<span class="bdg b-teal">집행완료</span>';
 a+=d.post_status==='confirmed'?'<span class="bdg b-brand">완결</span>':d.post_status==='flagged'?'<span class="bdg b-red">이의제기</span>':'<span class="bdg b-blue">사후대기</span>';
 return a;
}
function flagsOf(d){
 const f=[],tol=B.settings.variance_tolerance_pct;
 if(d.status!=='draft'&&!d.files_n)f.push('<span class="flag">증빙 없음</span>');
 if(d.director_no_finance)f.push('<span class="flag g">디렉터 기안·재무합의 없음</span>');
 if(d.variance_pct!=null&&d.variance_pct>tol)f.push(`<span class="flag">실적 +${d.variance_pct.toFixed(1)}%</span>`);
 if(d.exec_status==='done'&&!d.has_exec_evidence)f.push('<span class="flag">실적증빙 없음</span>');
 if(d.dup)f.push('<span class="flag">중복 증빙 의심</span>');
 if(d.version>1)f.push(`<span class="flag g">재기안 v${d.version}</span>`);
 return f.join('');
}

/* ═════════ 데이터 적재 ═════════ */
async function loadBoot(){B=await api('GET','/api/approvals/bootstrap');$('#bellCnt').textContent=B.unread||'';}
async function loadList(){LIST=(await api('GET','/api/approvals')).items;}
async function refreshBell(){try{NOTIFS=(await api('GET','/api/approvals/notifications')).items;$('#bellCnt').textContent=NOTIFS.filter(n=>!n.read_at).length||'';}catch(e){}}
async function reload(){await loadList();if(ui.view==='detail'&&ui.docId){try{DET=await api('GET','/api/approvals/'+ui.docId);}catch(e){DET=null;ui.view='board';}}if(ui.view==='report')await loadReport();render();refreshBell();}
async function loadReport(){REP=await api('GET','/api/approvals/report'+(ui.mon?('?month='+encodeURIComponent(ui.mon)):''));ui.mon=REP.month;}

/* ═════════ 탭 ═════════ */
function tabsFor(){
 const m=B.me,t=[['board','게시판'],['compose','작성']];
 if(m.isCeo||m.isDirector)t.push(['ceo','대표이사 결재함']);
 if(m.isCeo||m.isDirector||m.isFinance)t.push(['report','예정·실적']);
 if(m.isDirector)t.push(['settings','설정']);
 return t;
}
function renderTabs(){
 const todo=LIST.filter(d=>d.todo).length,cc=LIST.filter(d=>(d.stage==='pre'||d.stage==='postwait')&&d.todo).length;
 const cnt=k=>k==='board'&&todo?`<i>${todo}</i>`:(k==='ceo'&&cc&&B.me.isCeo?`<i>${cc}</i>`:'');
 const on=k=>ui.view===k||(k==='board'&&ui.view==='detail');
 $('#tabs').innerHTML=tabsFor().map(([k,l])=>`<button class="tab ${on(k)?'on':''}" data-act="nav" data-v="${k}">${l}${cnt(k)}</button>`).join('');
}

/* ═════════ 게시판 ═════════ */
function renderBoard(){
 const m=B.me,sum=(a,f)=>a.reduce((s,d)=>s+(f(d)||0),0),mon=todayMX().slice(0,7);
 const todo=LIST.filter(d=>d.todo),prog=LIST.filter(d=>d.status==='progress'),unexec=LIST.filter(d=>d.status==='approved'&&d.exec_status==='pending');
 const execM=LIST.filter(d=>d.exec_status==='done'&&(d.exec_date||'').startsWith(mon)),postw=LIST.filter(d=>d.exec_status==='done'&&d.post_status!=='confirmed');
 const boxes=[['todo',m.isFinance?'결재·집행할 문서':'처리할 문서',todo.length],['mine','내가 올린 문서',LIST.filter(d=>same(d.drafter_id,m.id)).length],['ref','참조·공람',LIST.filter(d=>d.is_ref).length],['all','전체',LIST.length]];
 const F=[['all','전체'],['draft','임시저장'],['progress','결재중'],['pre','사전승인 대기'],['execwait','집행대기'],['postwait','사후승인 대기'],['flagged','이의제기'],['closed','완결'],['rejected','반려']];
 return `
 <div class="kpis">
  <button class="card kpi ${todo.length?'hot':''}" data-act="kpi" data-b="todo" data-f="all"><small>내가 처리할 문서</small><b>${todo.length}건</b><em>결재·합의·집행·소명</em></button>
  <button class="card kpi" data-act="kpi" data-b="all" data-f="progress"><small>결재 진행중</small><b>${prog.length}건</b><em>${money(sum(prog,d=>d.planned_total))}</em></button>
  <button class="card kpi" data-act="kpi" data-b="all" data-f="execwait"><small>승인 · 미집행</small><b>${money(sum(unexec,d=>d.planned_total))}</b><em>${unexec.length}건</em></button>
  <button class="card kpi" data-act="kpi" data-b="all" data-f="all"><small>이번 달 집행실적</small><b>${money(sum(execM,d=>d.actual_total))}</b><em>${execM.length}건 · 예정 ${money(sum(execM,d=>d.planned_total))}</em></button>
  <button class="card kpi" data-act="kpi" data-b="all" data-f="postwait"><small>사후승인 미완료</small><b>${postw.length}건</b><em>이의제기 ${postw.filter(d=>d.post_status==='flagged').length}건</em></button>
 </div>
 <div class="boxes">${boxes.map(([k,l,n])=>`<button class="box ${ui.box===k?'on':''}" data-act="box" data-v="${k}">${l}<i>${n}</i></button>`).join('')}</div>
 <div class="fbar">
  <div class="chips">${F.map(([k,l])=>`<button class="chip ${ui.flt===k?'on':''}" data-act="flt" data-v="${k}">${l}</button>`).join('')}</div>

function sealText(l){
 if(l.status==='done')return({draft:'기안',agree:'합의',pass:'확인',post_ceo:'확인'})[l.step_type]||'승인';
 return({rejected:l.step_type==='agree'?'반대':'반려',flagged:'이의',pending:'대기중',waiting:'예정',skipped:'—'})[l.status];
}
function stampBox(l){
 const ceo=l.step_type==='pre_ceo'||l.step_type==='post_ceo';
 return `<div class="stp ${ceo?'ceo':''}" title="${esc(l.comment||'')}"><div class="lb">${SL(l.step_type)}</div><div class="nm">${esc(U(l.user_id))}</div><div class="seal ${l.status}">${sealText(l)}</div>${l.acted_at?tm(l.acted_at):'<span class="t">—</span>'}</div>`;
}
// 축소 결재선 — 상세 제목 오른쪽. 칸: 단계 · 이름 · 도장 · 날짜
const SL_SHORT={draft:'기안',approve:'결재',agree:'합의',pass:'경유',director:'디렉터',pre_ceo:'대표 사전',post_ceo:'대표 사후'};
const execState=d=>d.status==='rejected'?'skipped':d.exec_status==='done'?'done':d.exec_status==='pending'?'pending':'waiting';
function miniStamp(lb,name,status,mark,at,title,cls){
 return `<td class="ms ${status} ${cls||''}" title="${esc(title||'')}"><div class="ml">${lb}</div><div class="mn">${esc(name)}</div><div class="mk"><span>${mark||''}</span></div><div class="mt">${at?pdt(at,11):''}</div></td>`;
}
function miniStampsHtml(d,lines){
 if(!lines.length)return '<div class="sub">상신하면 결재선이 확정됩니다</div>';
 const cell=l=>{const mk=l.status==='done'?sealText(l):l.status==='rejected'?(l.step_type==='agree'?'반대':'반려'):l.status==='flagged'?'이의':l.status==='pending'?'대기':'';
  return miniStamp(SL_SHORT[l.step_type]||SL(l.step_type),U(l.user_id),l.status,mk,l.acted_at,`${SL(l.step_type)} · ${U(l.user_id)}${l.comment?'\n'+l.comment:''}`,l.step_type==='pre_ceo'||l.step_type==='post_ceo'?'ceo':'');};
 const main=lines.filter(l=>l.step_type!=='post_ceo').map(cell);
 const es=execState(d);
 main.push(d.exec_required===false?miniStamp('집행','없음','skipped','생략',null,'집행 단계 없음 — 승인 시 예정 금액으로 집행완료','exec'):miniStamp('집행',d.exec_by?U(d.exec_by):U(B.settings.finance_user_id),es,({done:'집행',pending:'대기'})[es]||'',d.exec_at,'집행 (재무)','exec'));
 const pl=lines.find(l=>l.step_type==='post_ceo');if(pl)main.push(cell(pl));
 return `<table class="mstamps"><tr>${main.join('')}</tr></table>`;
}
function stampsHtml(d,lines){
 if(!lines.length)return '<p class="sub" style="margin:0">상신하면 결재선이 확정됩니다.</p>';
 const main=lines.filter(l=>l.step_type!=='post_ceo').map(stampBox);
 const es=execState(d);
 main.push(d.exec_required===false?`<div class="stp exec"><div class="lb">집행 (재무)</div><div class="nm">없음</div><div class="seal skipped">생략</div><span class="t">${d.exec_status==='done'?'예정=실적':'—'}</span></div>`
  :`<div class="stp exec"><div class="lb">집행 (재무)</div><div class="nm">${esc(d.exec_by?U(d.exec_by):U(B.settings.finance_user_id))}</div><div class="seal ${es}">${({done:'집행',pending:'대기중',waiting:'예정',skipped:'—'})[es]}</div>${d.exec_at?tm(d.exec_at):'<span class="t">—</span>'}</div>`);
 const pl=lines.find(l=>l.step_type==='post_ceo');if(pl)main.push(stampBox(pl));
 return `<div class="stamps">${main.join('<span class="arrow">›</span>')}</div>`;
}

const EV_L={submit:'상신',approve:'승인',agree:'합의',pass:'경유 확인',reject:'반려',disagree:'반대 (반려)',approved:'결재 완료 · 집행대기',execute:'집행완료',flag:'이의제기',close_flag:'이의 종결 · 사후 확인',post_confirm:'사후승인 확인',withdraw:'회수',resubmit_from:'재기안',resubmitted:'재기안 문서 작성',file_delete:'증빙 삭제',file_void:'증빙 무효 처리',link:'결재문서 연결',edit:'내용 수정',lines_edit:'결재선 수정',addend:'추가 작성',exec_done:'전 회차 처리',pay_skip:'회차 중단',exec_skip:'집행 생략 · 예정 금액으로 집행완료',delete:'임시저장 삭제'};
function timeline(){

 DET.events.forEach(e=>it.push({k:'ev',at:e.created_at,e}));

const IMG_RE=/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/]+={0,2}$/;
const PT_L={once:'일시불',installment:'분할 지급',recurring:'정기 지급'};
const FREQ_L={weekly:'매주',biweekly:'격주',monthly:'매월',quarterly:'분기'};
const cm=(v,cur)=>(cur==='USD'?'US':'')+money(v);                 // 통화 표시: US$ / $
function addPeriod(start,freq,i){
 const [y,m,d]=start.split('-').map(Number);let dt;
 if(freq==='weekly'||freq==='biweekly')dt=new Date(Date.UTC(y,m-1,d+i*(freq==='weekly'?7:14)));
 else{const mo=i*(freq==='quarterly'?3:1);const last=new Date(Date.UTC(y,m-1+mo+1,0)).getUTCDate();dt=new Date(Date.UTC(y,m-1+mo,Math.min(d,last)));}
 return dt.toISOString().slice(0,10);
}
function splitEven(total,count){const per=r2(total/count),rows=Array.from({length:count},()=>per);rows[count-1]=r2(total-per*(count-1));return rows;}

/* 본문 편집기(contenteditable): 텍스트 + 그림. 서식 붙여넣기는 텍스트로만 받는다(안전). */
function nodesToEdHtml(nodes){
 return (nodes||[]).map(n=>n.t==='img'?(IMG_RE.test(n.src)?`<img src="${esc(n.src)}"${n.w?` data-w="${n.w}"`:''}${n.h?` data-h="${n.h}"`:''} alt="">`:''):esc(n.v).replace(/\n/g,'<br>')).join('<br>');
}
function serializeEd(root){
 const out=[];let buf='';
 const flush=()=>{const v=buf.replace(/^\n+|\n+$/g,'');if(v.trim())out.push({t:'p',v});buf='';};
 const BLOCK=/^(DIV|P|LI|H[1-6]|TR|BLOCKQUOTE|PRE|UL|OL|TABLE)$/;
 (function walk(node){
  for(const c of node.childNodes){
   if(c.nodeType===3){buf+=c.nodeValue.replace(/ /g,' ');continue;}
   if(c.nodeType!==1)continue;
   const tag=c.tagName;
   if(tag==='IMG'){const src=c.getAttribute('src')||'';if(IMG_RE.test(src)){flush();out.push({t:'img',src,w:(c.naturalWidth||+c.dataset.w||null)||null,h:(c.naturalHeight||+c.dataset.h||null)||null});}continue;}
   if(tag==='BR'){buf+='\n';continue;}
   const block=BLOCK.test(tag);
   if(block&&buf&&!buf.endsWith('\n'))buf+='\n';
   walk(c);
   if(tag==='TD'||tag==='TH')buf+='\t';
   if(block&&!buf.endsWith('\n'))buf+='\n';
  }
 })(root);
 flush();
 return out;
}
function renderBodyNodes(nodes){
 if(!nodes||!nodes.length||nodes.every(n=>n.t==='p'&&!n.v.trim()))return '<span class="sub">—</span>';
 return nodes.map(n=>n.t==='img'?(IMG_RE.test(n.src)?`<img class="bimg" src="${esc(n.src)}" alt="첨부 그림" data-act="bimg">`:''):`<p class="body">${esc(n.v)}</p>`).join('');
}
async function compressImage(file){
 const url=URL.createObjectURL(file);
 try{
  const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
  const sc=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
  if(sc===1&&file.size<=700*1024&&/^image\/(png|jpeg|webp|gif)$/.test(file.type))return{src:await readDataUrl(file),w,h};
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,h);g.drawImage(img,0,0,w,h);
  return{src:c.toDataURL('image/jpeg',0.85),w,h};
 }finally{URL.revokeObjectURL(url);}
}
function edInsertNode(node){
 const ed=document.getElementById(ui.edTarget||'bodyEd')||$('#bodyEd')||$('#adEd');if(!ed)return;
 const sel=window.getSelection();

 else ed.appendChild(node);
}
async function edAddImages(files){

  let r;try{r=await compressImage(f);}catch(e){toast(`${f.name}: 이 형식은 본문에 넣을 수 없습니다(증빙으로 올려 주세요)`);continue;}
  if(r.src.length>3*1024*1024){toast(`${f.name}: 그림이 너무 큽니다`);continue;}
  const img=document.createElement('img');img.src=r.src;img.dataset.w=r.w;img.dataset.h=r.h;img.alt='';
  edInsertNode(img);edInsertNode(document.createElement('br'));
 }

 }
}

function cdCalc(cd){
 const iv=cd.iva_applied;
 if(cd.payment_type==='recurring'){
  const count=Math.max(0,Math.min(60,parseInt(cd.plan.count,10)||0)),perSub=r2(cd.plan.per_sub);
  const sub=r2(perSub*count),iva=iv?r2(sub*0.16):0,total=r2(sub+iva);
  const ok=count>=2&&/^\d{4}-\d{2}-\d{2}$/.test(cd.plan.start||'');
  const rows=ok?splitEven(total,count).map((a,i)=>({due_date:addPeriod(cd.plan.start,cd.plan.freq,i),amount:a})):[];
  return{sub,iva,total,per:count?r2(total/count):0,count,rows};
 }
 const sub=r2(cd.orig_sub),iva=iv?r2(sub*0.16):0,total=r2(sub+iva);
 if(cd.payment_type==='installment')return{sub,iva,total,rows:cd.sched.map(r=>({due_date:r.due_date,amount:r2(r.amount)}))};
 return{sub,iva,total,rows:[{due_date:cd.pay_due,amount:total}]};
}

function previewLines(cd){
 const S=B.settings,me=B.me.id,c=cdCalc(cd),rate=cdRate(cd).rate||0,mx={sub:r2(c.sub*rate),total:r2(c.total*rate)};
 const isDir=B.me.isDirector||same(me,S.director_user_id);
 const ls=[{t:'draft',u:me}];const add=(t,u)=>{if(u==null||same(u,me))return;if(ls.some(x=>x.t===t&&same(x.u,u)))return;ls.push({t,u});};
 if(isDir){ls.push({t:'director',u:me});cdSteps(cd).forEach(x=>add(x.step_type,x.user_id));}
 else{const cat=B.categories.find(x=>same(x.id,cd.category_id));(cat?cat.steps:[]).forEach(s=>add(s.step_type,s.user_id));ls.push({t:'director',u:S.director_user_id});}
 const ceoD=same(me,S.ceo_user_id),b=S.threshold_basis==='sub'?mx.sub:mx.total,hasPre=ls.some(x=>x.t==='pre_ceo'),pre=hasPre||(!ceoD&&b>=S.ceo_pre_threshold);
 if(pre&&!hasPre)ls.push({t:'pre_ceo',u:S.ceo_user_id});
 ls.push({t:'post_ceo',u:ceoD?S.director_user_id:S.ceo_user_id});
 return{ls,pre,b};
}

 if(submit&&!(c.total>0)){toast('금액을 입력하세요');return;}
 if(cd.payment_type==='recurring'&&c.rows.length<2){toast('정기 지급은 첫 지급일과 횟수(2회 이상)가 필요합니다');return;}
 if(cd.payment_type==='installment'){

 }
 ui.busy=true;
 const body={category_id:cd.category_id?Number(cd.category_id):null,title:cd.title,vendor:cd.vendor,pay_due:cd.pay_due||null,pay_method:cd.pay_method,
  currency:cd.currency,payment_type:cd.payment_type,iva_applied:cd.iva_applied,orig_sub:c.sub,
  payment_plan:cd.payment_type==='recurring'?{freq:cd.plan.freq,count:c.count,start:cd.plan.start,per_sub:r2(cd.plan.per_sub)}:null,
  schedule:cd.payment_type==='installment'?c.rows.map(r=>({due_date:r.due_date||null,amount:r.amount})):null,
  body_rich:cd.body_nodes,refs:cd.refs,shares:cd.shares,include_finance:cd.include_finance,
  custom_steps:B.me.isDirector&&!cd.revise?cdSteps(cd).map(x=>({step_type:x.step_type,user_id:Number(x.user_id)})):undefined,
  exec_required:B.me.isDirector&&!cd.revise?cd.exec!==false:undefined};
 try{
  if(cd.revise){
   const r=await api('PUT',`/api/approvals/${cd.id}/content`,{...body,reason:cd.reason||''});
   if(cd.newFiles.length){await uploadFiles(cd.id,cd.newFiles);cd.newFiles=[];}
   const id=cd.id;ui.cd=null;
   toast(r.changes.length?`수정했습니다 · ${r.changes.map(x=>x.label).join(', ')}${r.pre_added?' · 대표이사 사전승인 추가됨':''}`:'바뀐 내용이 없습니다');
   await loadList();openDoc(id);return;
  }
  if(cd.id)await api('PUT','/api/approvals/'+cd.id,body);else cd.id=(await api('POST','/api/approvals',body)).id;
  if(cd.newFiles.length){await uploadFiles(cd.id,cd.newFiles);cd.newFiles=[];}
  if(submit){const r=await api('POST',`/api/approvals/${cd.id}/submit`);const id=cd.id;ui.cd=null;toast('상신되었습니다 · '+r.doc_no);await loadList();openDoc(id);}
  else{toast('임시저장되었습니다');DET=await api('GET','/api/approvals/'+cd.id);ui.cd=cdFromDet();await loadList();render();}
 }catch(e){toast(errText(e));if(cd.id){try{DET=await api('GET','/api/approvals/'+cd.id);ui.cd.files=DET.files.slice();render();}catch(x){}}}
 finally{ui.busy=false;}

 const postAll=LIST.filter(d=>d.stage==='postwait');
 const post=postAll.filter(d=>!ui.postCat||same(d.category_id,ui.postCat));

 [...ui.postSel].forEach(id=>{if(!post.some(d=>d.id===id&&d.todo))ui.postSel.delete(id);});
 const selSum=post.filter(d=>ui.postSel.has(d.id)).reduce((s,d)=>s+d.actual_total,0);

/* ═════════ 인쇄 — A4 1장 결재문서 ═════════
   화면 상세를 그대로 찍지 않고, 인쇄 전용 시트(#printSheet)를 따로 만든다.
   ① 촘촘한 표 배치(결재 도장 1줄 · 정보 4열 · 회차/증빙/이력은 칸 나눔)
   ② 넘치면 'tight'(그림·이력 줄이기) → ③ 그래도 넘치면 zoom 으로 A4 한 장에 맞춤(최소 55%).
   레이아웃은 표(table)만 써서 오래된 인쇄 엔진에서도 같게 나온다. */
const PR_MIN_ZOOM=0.55;
const pdt=(iso,len=16)=>iso?fmtT(iso,'America/Mexico_City').slice(5,len):'';           // MM-DD HH:mm
const cut=(s,nn)=>{s=String(s||'').replace(/\s*\n\s*/g,' · ');return s.length>nn?s.slice(0,nn-1)+'…':s;};
function prCols(rows,maxPerCol,head,maxCols=3){
 // 행이 많으면 표를 옆으로 나란히(최대 maxCols 칸) — 세로 공간 절약
 if(!rows.length)return '';
 const cols=Math.min(maxCols,Math.max(1,Math.ceil(rows.length/maxPerCol))),per=Math.ceil(rows.length/cols),cells=[];
 for(let i=0;i<cols;i++){const part=rows.slice(i*per,(i+1)*per);if(part.length)cells.push(`<td class="pcol"><table class="ptb">${head}${part.join('')}</table></td>`);}
 return `<table class="pcols"><tr>${cells.join('')}</tr></table>`;
}
function printSheetHtml(){
 const d=DET.doc,usd=d.currency==='USD',cur=d.currency,S=B.settings;
 const st=STAGE_BADGE[d.stage]||['',''];
 const status=d.status==='approved'?(d.exec_status!=='done'?'승인 · 집행대기':d.post_status==='confirmed'?'완결':d.post_status==='flagged'?'이의제기':'집행완료 · 사후대기'):st[0];
 // 결재 도장 1줄
 const stp=l=>{const s=l.status,mk=s==='done'?sealText(l):s==='rejected'?(l.step_type==='agree'?'반대':'반려'):s==='flagged'?'이의':s==='pending'?'대기':s==='skipped'?'—':'';
  return `<td class="pst-c ${s}"><div class="pl">${SL(l.step_type).replace('대표이사 ','대표 ')}</div><div class="pn">${esc(U(l.user_id))}</div><div class="pm">${mk}</div><div class="pt">${l.acted_at?pdt(l.acted_at,11):''}</div></td>`;};
 const main=DET.lines.filter(l=>l.step_type!=='post_ceo'),pl=DET.lines.find(l=>l.step_type==='post_ceo');
 const es=d.exec_required===false?'skipped':execState(d);
 const execCell=d.exec_required===false?`<td class="pst-c skipped"><div class="pl">집행 (재무)</div><div class="pn">없음</div><div class="pm">생략</div><div class="pt"></div></td>`:`<td class="pst-c ${es}"><div class="pl">집행 (재무)</div><div class="pn">${esc(U(d.exec_by||S.finance_user_id))}</div><div class="pm">${({done:'집행',pending:'대기',waiting:'',skipped:'—'})[es]}</div><div class="pt">${d.exec_at?pdt(d.exec_at,11):''}</div></td>`;
 const stamps=DET.lines.length?`<table class="pst"><tr>${main.map(stp).join('')}${execCell}${pl?stp(pl):''}</tr></table>`:'<div class="pnote">상신 전 문서 — 결재선 미확정</div>';
 // 정보(4열)
 const done=DET.payments.filter(p=>p.status==='done'),open=DET.payments.filter(p=>p.status==='planned');
 const plan=d.payment_plan,v=d.variance_pct;
 const ptxt=(PT_L[d.payment_type]||'일시불')+(d.payment_type==='recurring'&&plan?` · ${FREQ_L[plan.freq]||''} ${plan.count}회 · ${plan.start}~`:d.payment_type==='installment'?` · ${DET.payments.length}회`:'');
 const refs=DET.viewers.filter(x=>x.kind==='ref').map(x=>U(x.user_id)),shares=DET.viewers.filter(x=>x.kind==='share').map(x=>U(x.user_id));
 const kv=[
  ['카테고리',esc(catName(d.category_id))],['기안자',`${esc(U(d.drafter_id))} <span class="pg">${esc(UT(d.drafter_id))}</span>`],
  ['상신',d.submitted_at?pdt(d.submitted_at):'—'],['상태',`<b>${esc(status)}</b>`],
  ['거래처',esc(d.vendor||'—')],['결제 방식',esc(ptxt)],['지급 방법',esc(d.pay_method||'—')],['지급 예정',esc((open[0]||{}).due_date||d.pay_due||'—')],
  ['예정 소계',money(d.planned_sub)],['IVA 16%',money(d.planned_iva)],['예정 합계',`<b>${money(d.planned_total)}</b> MXN`],

// A4 세로(여백 8mm) 한 장 높이에 맞춘다. 반환: { zoom, fits }
function fitPrintSheet(el){
 const probe=document.createElement('div');probe.style.cssText='position:absolute;visibility:hidden;width:100mm;height:0';document.body.appendChild(probe);
 const pxmm=probe.getBoundingClientRect().width/100||3.7795;probe.remove();
 const W=194,availH=(297-16)*pxmm-4;
 const measure=z=>{el.style.zoom='';el.style.width=(W/z)+'mm';return el.scrollHeight*z;};
 el.classList.remove('tight');
 let z=1,h=measure(1),fits=true;
 if(!h)return{zoom:1,fits:true};                        // 레이아웃 없는 환경(테스트)
 if(h>availH){el.classList.add('tight');h=measure(1);}
 if(h>availH){
  // 넓게 펼치면 줄바꿈이 줄어 높이가 비선형 → 들어가는 가장 큰 배율을 이분 탐색
  if(measure(PR_MIN_ZOOM)>availH){z=PR_MIN_ZOOM;fits=false;}
  else{let lo=PR_MIN_ZOOM,hi=1;for(let i=0;i<8;i++){const mid=(lo+hi)/2;if(measure(mid)<=availH)lo=mid;else hi=mid;}z=Math.floor(lo*1000)/1000;}
 }
 el.style.width=(W/z)+'mm';el.style.zoom=String(z);
 return{zoom:z,fits};
}
async function buildPrintSheet(){
 let el=document.getElementById('printSheet');if(el)el.remove();
 el=document.createElement('div');el.id='printSheet';el.className='measuring';el.innerHTML=printSheetHtml();
 document.body.appendChild(el);
 await Promise.all([...el.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):null));
 const r=fitPrintSheet(el);el.classList.remove('measuring');
 return r;
}
async function printDoc(){
 if(!DET)return;
 const r=await buildPrintSheet();          // 화면에는 안 보임(@media screen 숨김) — 다음 인쇄 때 새로 만든다
 if(!r.fits)toast('내용이 많아 최대로 줄여도 1장을 넘습니다 — 2장으로 출력됩니다');
 window.print();
}

let xlsxLoading=null;
function loadXlsx(){if(window.XLSX)return Promise.resolve();if(xlsxLoading)return xlsxLoading;xlsxLoading=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js';s.onload=ok;s.onerror=()=>{xlsxLoading=null;no();};document.head.appendChild(s);});return xlsxLoading;}
async function exportXls(name,head,rows){
 try{await loadXlsx();}catch(e){toast('엑셀 도구를 불러오지 못했습니다');return;}
 const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=head.map((h,i)=>({wch:i===2||i===0?22:14}));
 head.forEach((h,i)=>{const c=ws[XLSX.utils.encode_cell({r:0,c:i})];if(c)c.s={font:{bold:true,color:{rgb:'FFFFFF'}},fill:{fgColor:{rgb:'143D34'}}};});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'목록');XLSX.writeFile(wb,`${name}_${todayMX()}.xlsx`);
}

document.addEventListener('paste',e=>{

 e.preventDefault();

 edInsertText(dt.getData('text/plain'));
});

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='ivaOn'&&ui.cd){ui.cd.iva_applied=t.checked;updateCompose();}
 else if(t.dataset.cs&&ui.cd){const k=t.dataset.cs,st=cdSteps(ui.cd);if(k==='type')st[Number(t.dataset.i)].step_type=t.value;else if(k==='user')st[Number(t.dataset.i)].user_id=Number(t.value);else if(k==='addT')ui.csAddT=t.value;else if(k==='addU')ui.csAddU=Number(t.value);if(k==='type'||k==='user')updateCompose();}
 else if(t.dataset.le&&ui.le){const k=t.dataset.le;if(k==='type')ui.le.rows[Number(t.dataset.i)].step_type=t.value;else if(k==='user')ui.le.rows[Number(t.dataset.i)].user_id=Number(t.value);else if(k==='post')ui.le.post=Number(t.value);else if(k==='addT')ui.le.addT=t.value;else if(k==='addU')ui.le.addU=Number(t.value);}
 else if(t.dataset.kind){getArr(t.dataset.kind)[Number(t.dataset.i)].kind=t.value;}
 else if(t.id==='catSel'){ui.cat=t.value;render();}
 else if(t.id==='noEvid'){ui.noEvid=t.checked;render();}
 else if(t.dataset.addto&&t.value&&ui.cd){ui.cd[t.dataset.addto].push(Number(t.value));render();}
 else if(t.id==='postCat'){ui.postCat=t.value;render();}
 else if(t.id==='monSel'){ui.mon=t.value;REP=null;render();run(loadReport).then(render);}
});
