name: Deploy HTML to VPS

on:
  workflow_dispatch:
 
  push:
    branches:
      - main
    
jobs:
  deploy-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy root files to VPS
        run: |
          find . -maxdepth 1 -type f -print0 | \
          rsync -av --from0 --files-from=- \
            -e "ssh -i ~/.ssh/github_actions" \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/erp-refatrix/
